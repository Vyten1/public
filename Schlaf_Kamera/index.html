<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d14">
<title>Sleep Cam</title>
<style>
/* Layout: one narrow column of cards; a full-screen black "night" overlay while recording. Deliberately dark-only (it runs in a bedroom). */
:root {
  --bg: #0b0d14;
  --panel: #141826;
  --line: #262b3d;
  --fg: #dfe2ee;
  --muted: #8a90a8;
  --accent: #e0a458;   /* warm amber, easy on night eyes */
  --snore: #d9725f;
  --ok: #7fb58a;
  --warn: #e0c158;
  --font: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
main > header { order: -2; } #langPick, #rec, #nights { order: -1; }
h1 { font-size: 28px; margin: 4px 0 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
header.top > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#btnLang { flex: none; margin-top: 6px; }
h2 { font-size: 17px; margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
video#preview { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 10px; object-fit: cover; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
select, input[type=number] { font: 15px var(--font); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
button { font: 600 15px var(--font); border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; background: var(--line); color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #1a1206; }
button.danger { background: transparent; color: var(--snore); border: 1px solid var(--snore); }
button.small { padding: 7px 11px; font-size: 13px; }
button:disabled { opacity: 0.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > button.grow { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.bad { color: var(--snore); border-color: var(--snore); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.mbar { position: relative; height: 10px; border-radius: 5px; background: var(--line, #333); overflow: hidden; margin-top: 8px; }
.mfill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .15s; }
.mfill.hot { background: var(--snore); }
.mthr { position: absolute; top: 0; bottom: 0; width: 2px; background: currentColor; opacity: .8; }
.mLast b.ok { color: var(--snore); }
.calib { border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.calStep { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.calMsg { font-size: 22px; font-weight: 600; line-height: 1.25; }
.calMsg .ok { color: var(--snore); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat b { display: block; font: 600 22px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.clock { font: 600 44px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
canvas.chart { width: 100%; height: 110px; display: block; }
.log { font: 12px var(--mono); color: var(--muted); max-height: 120px; overflow: auto; white-space: pre-wrap; }
.night-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.clips { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; }
.clip { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.clip .t { font-family: var(--mono); min-width: 52px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--line); }
.tag.snore { background: var(--snore); color: #1a0a06; }
.vids video { width: 100%; border-radius: 10px; background: #000; }
.vid { display: flex; flex-direction: column; gap: 6px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
ul.tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
#night { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #2a2a2a; font: 600 40px var(--mono); }
#night small { font: 13px var(--font); color: #222; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 data-i18n-html="appName">Sleep <span>Cam</span></h1>
      <p class="sub" data-i18n="intro" id="intro"></p>
    </div>
    <button class="small" id="btnLang" hidden></button>
  </header>

  <section class="card" id="langPick" hidden>
    <h2>Sprache wählen · Choose language</h2>
    <div class="row">
      <button class="primary grow" data-lang="de">Deutsch</button>
      <button class="primary grow" data-lang="en">English</button>
    </div>
  </section>

  <section class="card" id="setup" hidden>
    <video id="preview" playsinline muted autoplay></video>
    <div class="grid">
      <label><span data-i18n="lblInterval"></span>
        <select id="interval"><option value="10">10 s</option><option value="20" selected>20 s</option><option value="30">30 s</option><option value="60">60 s</option></select>
      </label>
      <label><span data-i18n="lblChunk"></span>
        <select id="chunkH"><option value="1" data-i18n="optH1"></option><option value="2" data-i18n="optH2"></option><option value="4" selected data-i18n="optH4"></option><option value="12" data-i18n="optEnd"></option></select>
      </label>
      <label><span data-i18n="lblFps"></span>
        <select id="fps"><option value="8" data-i18n="optFps8"></option><option value="12" selected data-i18n="optFps12"></option><option value="24" data-i18n="optFps24"></option></select>
      </label>
      <label><span data-i18n="lblBright"></span>
        <select id="bright"><option value="auto" selected data-i18n="optAuto"></option><option value="1" data-i18n="optOff"></option><option value="2">2×</option><option value="4">4×</option></select>
      </label>
      <label><span data-i18n="lblCamera"></span>
        <select id="facing"><option value="environment" selected data-i18n="optBack"></option><option value="user" data-i18n="optFront"></option></select>
      </label>
      <label><span data-i18n="lblSens"></span>
        <select id="sens"><option value="14" data-i18n="optLow"></option><option value="10" selected data-i18n="optNormal"></option><option value="7" data-i18n="optHigh"></option><option value="cal" data-i18n="optCal" hidden></option></select>
      </label>
    </div>
    <div class="meter" hidden>
      <div class="stats" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat"><b class="mBg">–</b><span data-i18n="mBg"></span></div>
        <div class="stat"><b class="mNow">–</b><span data-i18n="mNow"></span></div>
      </div>
      <div class="mbar"><div class="mfill"></div><div class="mthr"></div></div>
      <p class="sub mHint"></p>
      <p class="sub mLast"></p>
    </div>
    <div class="calib" id="calPanel" hidden>
      <div class="calStep" id="calStep"></div>
      <div class="calMsg" id="calMsg"></div>
      <div class="progress" id="calBar"><div></div></div>
      <p class="sub" id="calSub"></p>
      <div class="row"><button id="calClose" class="small" data-i18n="calClose"></button></div>
    </div>
    <button id="btnCal" class="primary" data-i18n="btnCal"></button>
    <div class="row">
      <button id="btnPreview" data-i18n="btnTest"></button>
      <button id="btnStart" class="primary grow" data-i18n="btnStart"></button>
    </div>
    <details>
      <summary data-i18n="tipsTitle"></summary>
      <ul class="tips">
        <li data-i18n-html="tip1"></li>
        <li data-i18n-html="tip2"></li>
        <li data-i18n-html="tip3"></li>
        <li data-i18n-html="tip4"></li>
        <li data-i18n-html="tip5"></li>
      </ul>
    </details>
  </section>

  <section class="card" id="rec" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="clock" id="clock">00:00:00</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sPhotos">0</b><span data-i18n="statPhotos"></span></div>
      <div class="stat"><b id="sSnores">0</b><span data-i18n="statSnores"></span></div>
      <div class="stat"><b id="sLevel">–</b><span data-i18n="statLevel"></span></div>
    </div>
    <div class="meter" hidden>
      <div class="stats" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat"><b class="mBg">–</b><span data-i18n="mBg"></span></div>
        <div class="stat"><b class="mNow">–</b><span data-i18n="mNow"></span></div>
      </div>
      <div class="mbar"><div class="mfill"></div><div class="mthr"></div></div>
      <p class="sub mHint"></p>
      <p class="sub mLast"></p>
    </div>
    <canvas class="chart" id="liveChart"></canvas>
    <p class="sub" id="nextVid"></p>
    <div class="progress" id="renderBar" hidden><div></div></div>
    <div class="row">
      <button id="btnDark" class="grow" data-i18n="btnDark"></button>
      <button id="btnStop" class="danger grow" data-i18n="btnStop"></button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <section id="nights" style="display:flex;flex-direction:column;gap:16px"></section>

  <p class="sub" id="storage"></p>
</main>

<div id="night" hidden>
  <div id="nightClock">00:00</div>
  <small data-i18n="nightHint"></small>
</div>

<canvas id="grab" hidden></canvas>
<canvas id="render" hidden></canvas>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hhmmss = (t) => { const d = new Date(t); return hhmm(t) + ':' + pad(d.getSeconds()); };
const dur = (ms) => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };

function log(msg) {
  const el = $('log');
  el.textContent = hhmmss(Date.now()) + '  ' + msg + '\n' + el.textContent.slice(0, 4000);
}

/* ---------------- IndexedDB ---------------- */
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('sleepcam', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('nights', { keyPath: 'id' });
      const p = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      p.createIndex('night', 'night');
      const c = d.createObjectStore('clips', { keyPath: 'id', autoIncrement: true });
      c.createIndex('night', 'night');
      const v = d.createObjectStore('videos', { keyPath: 'id', autoIncrement: true });
      v.createIndex('night', 'night');
      const m = d.createObjectStore('minutes', { keyPath: 'id', autoIncrement: true });
      m.createIndex('night', 'night');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    Promise.resolve(fn(s)).then(v => { out = v; });
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const put = (store, val) => tx(store, 'readwrite', s => req(s.put(val)));
const byNight = (store, night) => tx(store, 'readonly', s => req(s.index('night').getAll(night)));
const allNights = () => tx('nights', 'readonly', s => req(s.getAll()));
async function deleteNight(night) {
  for (const store of ['photos', 'clips', 'videos', 'minutes']) {
    await tx(store, 'readwrite', s => new Promise(res => {
      const c = s.index('night').openKeyCursor(IDBKeyRange.only(night));
      c.onsuccess = () => { const cur = c.result; if (cur) { s.delete(cur.primaryKey); cur.continue(); } else res(); };
    }));
  }
  await tx('nights', 'readwrite', s => req(s.delete(night)));
}
async function photoMetaByNight(night) {
  // photos without loading every blob into memory at once
  return tx('photos', 'readonly', s => new Promise(res => {
    const out = [];
    const c = s.index('night').openCursor(IDBKeyRange.only(night));
    c.onsuccess = () => { const cur = c.result; if (cur) { const v = cur.value; out.push({ id: v.id, t: v.t, chunk: v.chunk, db: v.db, snore: v.snore }); cur.continue(); } else res(out); };
  }));
}
const getPhoto = (id) => tx('photos', 'readonly', s => req(s.get(id)));

/* ---------------- Photos ---------------- */
let lastSnoreAt = 0;
async function takePhoto() {
  const v = $('preview');
  if (!v.videoWidth) return;
  const W = 640, H = Math.round(640 * v.videoHeight / v.videoWidth);
  const c = $('grab'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(v, 0, 0, W, H);
  // brighten
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  let gain = 1;
  const mode = $('bright').value;
  if (mode === 'auto') {
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 64) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
    const mean = sum / n;
    gain = Math.max(1, Math.min(8, 105 / Math.max(mean, 2)));
  } else gain = +mode;
  if (gain > 1.05) {
    for (let i = 0; i < d.length; i += 4) { d[i] = d[i] * gain; d[i + 1] = d[i + 1] * gain; d[i + 2] = d[i + 2] * gain; }
    ctx.putImageData(img, 0, 0);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  if (!blob) return;
  const t = Date.now();
  const chunk = chunkOf(t);
  const level = S.audio ? Math.max(0, S.audio.levelOverFloor) : 0;
  await put('photos', { night: S.night.id, t, chunk, blob, db: Math.round(level), snore: t - lastSnoreAt < (+$('interval').value) * 1000 });
  S.photos++;
  $('sPhotos').textContent = S.photos;
  if (chunk !== S.lastChunk) {
    const done = S.lastChunk;
    S.lastChunk = chunk;
    queueRender(S.night.id, done);
  }
}
function chunkOf(t) {
  const h = +S.night.chunkH;
  return Math.floor((t - S.night.start) / (h * 3600e3));
}

/* ---------------- Audio + snore detection ---------------- */
const CLIP_RATE = 8000;          // stored clip sample rate
const CLIP_SECS = 12;
async function startAudio(restart) {

  if (S.audio) { try { S.audio.proc.disconnect(); S.audio.src.disconnect(); S.audio.proc.onaudioprocess = null; } catch (e) {} }

    ctx, src, an, proc, spec, ring, ringPos: 0, ratio: ctx.sampleRate / CLIP_RATE, acc: 0, accN: 0, frac: 0,
    floor: null, levelOverFloor: 0, ev: null, recent: [], lastClip: 0, lastLoudClip: 0,
    minute: null, live: [],

    let sq = 0, sub = 0, subMax = 0;
    const subLen = x.length >> 3;

      const s = x[i]; sq += s * s; sub += s * s;
      if ((i + 1) % subLen === 0) { subMax = Math.max(subMax, sub); sub = 0; }
      A.acc += s; A.accN++; A.frac += 1;

    const imp = sq > 0 ? subMax / (sq / 8) : 1;
    const dbv = 10 * Math.log10(sq / x.length + 1e-12);
    A.dbNow = dbv;
    if (A.floor == null) A.floor = dbv;
    // floor follows quiet quickly, loud only very slowly
    A.floor += (dbv - A.floor) * (dbv < A.floor ? 0.05 : 0.002);
    const over = dbv - A.floor;
    A.levelOverFloor = over;
    // spectrum: share of energy at 60–500 Hz (snoring is low-pitched, clicks are broadband)
    an.getFloatFrequencyData(spec);

    const lowShare = all > 0 ? lo / all : 0;

    const now = Date.now();
    const thr = A.thrOverride ?? sensThr(); const L = limits();
    if (over > thr) {
      if (!A.ev) A.ev = { start: now, end: now, peak: over, lowSum: 0, impSum: 0, n: 0, quiet: 0, gaps: 0 };
      const ev = A.ev;
      if (ev.quiet) { ev.gaps += ev.quiet; ev.quiet = 0; }
      ev.end = now; ev.peak = Math.max(ev.peak, over); ev.lowSum += lowShare; ev.impSum += imp; ev.n++;
    } else if (A.ev) {
      // allow short dips (≤ 2 blocks ≈ 0.2 s) inside one breath

        const ev = A.ev; A.ev = null;
        const len = (ev.end - ev.start) / 1000 + x.length / ctx.sampleRate;

        else if (low < L.low) v = 'vHigh';
        else if (fill < 0.6) v = 'vGaps';

  };

    // Snoring repeats with each breath (every ~2-9 s). Look for that rhythm.
    A.recent = A.recent.filter(t => now - t < 75e3);

    let rhythmic = 0;
    for (let i = 1; i < A.recent.length; i++) { const g = (A.recent[i] - A.recent[i - 1]) / 1000; if (g >= 2 && g <= 9) rhythmic++; }
    if (rhythmic >= 3) {

      if (A.minute) A.minute.snores++;

setInterval(() => {

    m.querySelector('.mthr').style.left = pct(trig) + '%';

async function phase(step, msgKey, subKey, secs, subVars) {
  $('calStep').textContent = tr('calStepN', { n: step });
  $('calMsg').innerHTML = tr(msgKey);
  const bar = $('calBar').firstElementChild, t0 = Date.now();
  while (Date.now() - t0 < secs * 1000) {
    const left = Math.ceil(secs - (Date.now() - t0) / 1000);
    $('calSub').textContent = tr(subKey, { s: left, ...(subVars ? subVars() : {}) });
    bar.style.width = ((Date.now() - t0) / secs / 10) + '%';
    await sleep(200);
  }
  bar.style.width = '100%';
}
$('calClose').onclick = () => { S.calAbort = true; $('calPanel').hidden = true; $('btnCal').hidden = false; };
$('btnCal').onclick = async () => {
  getCtx();
  S.calAbort = false;
  $('btnCal').hidden = true; $('calPanel').hidden = false; $('calBar').hidden = false;
  $('calMsg').textContent = '…'; $('calStep').textContent = ''; $('calSub').textContent = '';
  try { await openCamera(); await startAudio(true); } catch (e) { alertBox(tr('errCam', { e: e.message })); $('calClose').onclick(); return; }
  const A = S.audio;
  await sleep(600);
  // 1) silence → background level
  const quiet = [];
  const qi = setInterval(() => { if (A.dbNow != null) quiet.push(A.dbNow); }, 100);
  await phase(1, 'calQuiet', 'calQuietSub', 4);
  clearInterval(qi);
  if (S.calAbort) return;
  quiet.sort((a, b) => a - b);
  if (quiet.length) A.floor = quiet[Math.floor(quiet.length / 2)];
  const bg = A.floor;
  // 2) fake snores, with a low trigger so we hear everything
  const evs = [];
  A.thrOverride = 5; A.onEvent = e => { if (e.len >= 0.3 && e.len <= 4) evs.push(e); };
  await phase(2, 'calSnore', 'calSnoreSub', 25, () => ({ n: evs.length }));
  A.onEvent = null;
  if (S.calAbort) { A.thrOverride = null; return; }
  if (evs.length < 3) {
    A.thrOverride = null;
    $('calStep').textContent = ''; $('calMsg').textContent = tr('calFail', { n: evs.length }); $('calSub').textContent = ''; $('calBar').hidden = true;
    $('btnCal').hidden = false; return;
  }
  // use the stronger snores (ignore stray little noises)
  evs.sort((a, b) => b.peak - a.peak);
  const top = evs.slice(0, Math.max(3, Math.ceil(evs.length * 0.7)));
  const minPeak = Math.min(...top.map(e => e.peak));
  const med = top[Math.floor(top.length / 2)].peak;
  let cal = {
    thr: Math.max(4, Math.min(25, minPeak * 0.6)),
    low: Math.max(0.15, Math.min(0.5, Math.min(...top.map(e => e.low)) - 0.1)),
    imp: Math.max(4, Math.min(10, Math.max(...top.map(e => e.imp)) * 1.4)),
  };
  // 3) silence again → count false alarms with the new settings
  CAL = cal; A.thrOverride = null;
  const prevSens = $('sens').value; $('sens').querySelector('[value=cal]').hidden = false; $('sens').value = 'cal';
  let fa = 0; A.onEvent = e => { if (e.v === 'vOk') fa++; };
  await phase(3, 'calCheck', 'calCheckSub', 8);
  A.onEvent = null;
  if (S.calAbort) { $('sens').value = prevSens; return; }
  if (fa) cal = { ...cal, thr: Math.min(30, cal.thr + 4), imp: Math.max(3, cal.imp * 0.8), low: Math.min(0.6, cal.low + 0.05) };
  CAL = cal;
  try { localStorage.setItem('sleepcam-cal', JSON.stringify(cal)); } catch (e) {}
  saveSettings();
  A.recent = []; A.last = null;
  $('calStep').textContent = ''; $('calBar').hidden = true;
  $('calMsg').innerHTML = tr('calDone');
  $('calSub').textContent = tr('calDoneSub', { bg: Math.max(0, bg + 100).toFixed(0), sn: Math.max(0, bg + med + 100).toFixed(0), tr: Math.max(0, bg + cal.thr + 100).toFixed(0), fa }) + (fa ? tr('calDoneFa') : '');
  $('btnCal').hidden = false;
};

function flushMinute(m) {
  if (!S.night) return;
  const rec = { night: S.night.id, t: m.k * 60e3, avg: +(m.sum / Math.max(1, m.n)).toFixed(1), max: +m.max.toFixed(1), snores: m.snores };
  put('minutes', rec).catch(() => {});
  S.audio.live.push(rec);
  if (S.audio.live.length > 240) S.audio.live.shift();
}

function ringToWav(A) {
  const n = A.ring.length, out = new Int16Array(n);

  log(kind === 'snore' ? tr('logClipSnore') : tr('logClipLoud'));
}
const byNightCount = (store, night) => tx(store, 'readonly', s => req(s.index('night').count(night)));

/* ---------------- Live chart ---------------- */
function drawChart(canvas, mins, t0, t1) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  g.clearRect(0, 0, W, H);
  const top = 6, bot = H - 18, maxDb = 40;
  g.strokeStyle = col('--line'); g.lineWidth = 1;
  for (const d of [0, 20, 40]) { const y = bot - (d / maxDb) * (bot - top); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  if (!mins.length) { g.fillStyle = col('--muted'); g.font = '12px ' + col('--font'); g.fillText(tr('chartEmpty'), 4, H / 2); return; }
  t0 = t0 ?? mins[0].t; t1 = Math.max(t1 ?? mins[mins.length - 1].t + 60e3, t0 + 60e3);
  const x = (t) => (t - t0) / (t1 - t0) * W;
  const bw = Math.max(1, W * 60e3 / (t1 - t0) - 0.5);
  for (const m of mins) {
    const h = Math.min(1, m.max / maxDb) * (bot - top);
    g.fillStyle = m.snores ? col('--snore') : col('--accent');
    g.globalAlpha = m.snores ? 0.95 : 0.45;
    g.fillRect(x(m.t), bot - h, bw, h);
  }
  g.globalAlpha = 1;
  g.fillStyle = col('--muted'); g.font = '11px ' + col('--mono');
  const step = (t1 - t0) > 4 * 3600e3 ? 3600e3 : (t1 - t0) > 3600e3 ? 1800e3 : 600e3;
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) {
    const xx = x(t); if (xx < 2 || xx > W - 34) continue;
    g.fillText(hhmm(t), xx - 15, H - 4);
  }
}

/* ---------------- Recording control ---------------- */
$('btnStart').onclick = async () => {
  getCtx();
  try {
    if (!S.stream || S.stream.getTracks().some(t => t.readyState !== 'live')) await openCamera();
  } catch (e) { alertBox(tr('errCamMic', { e: e.message })); return; }
  try { await navigator.storage?.persist?.(); } catch (e) {}
  const now = Date.now();
  let resume = null;
  try { resume = JSON.parse(localStorage.getItem('sleepcam-active') || 'null'); } catch (e) {}
  const nights = await allNights();
  const prev = resume && nights.find(n => n.id === resume && !n.end && now - n.start < 14 * 3600e3);
  S.night = prev || { id: 'n' + now, start: now, end: null, chunkH: +$('chunkH').value, interval: +$('interval').value, fps: +$('fps').value };
  await put('nights', S.night);
  try { localStorage.setItem('sleepcam-active', S.night.id); } catch (e) {}
  S.photos = prev ? (await byNightCount('photos', S.night.id)) : 0;
  S.snores = 0; S.lastChunk = chunkOf(now);
  await startAudio(true);
  await lockScreen();
  S.running = true;
  $('setup').hidden = true; $('rec').hidden = false; $('btnLang').hidden = true;
  $('sPhotos').textContent = S.photos; $('sSnores').textContent = 0;
  log(prev ? tr('logResumed') : tr('logStarted'));
  takePhoto();
  S.photoTimer = setInterval(takePhoto, S.night.interval * 1000);
  S.tickTimer = setInterval(tick, 1000);
  tick();
};

function tick() {
  if (!S.running) return;
  const now = Date.now();
  $('clock').textContent = dur(now - S.night.start);
  $('nightClock').textContent = hhmm(now);
  $('sLevel').textContent = S.audio ? Math.max(0, S.audio.levelOverFloor).toFixed(0) : '–';
  const next = S.night.start + (S.lastChunk + 1) * S.night.chunkH * 3600e3;
  $('nextVid').textContent = S.night.chunkH >= 12 ? tr('nextAtStop') : tr('nextAt', { t: hhmm(next) });
  if (now % 5 < 1 || !$('rec').hidden) {
    const live = S.audio ? S.audio.live.slice() : [];
    if (S.audio?.minute) { const m = S.audio.minute; live.push({ t: m.k * 60e3, max: m.max, snores: m.snores }); }
    if (!$('rec').hidden) drawChart($('liveChart'), live);
  }
  if (now % 30000 < 1000) renderChips();
}

$('btnDark').onclick = () => { $('night').hidden = false; };
$('night').onclick = () => { $('night').hidden = true; };

$('btnStop').onclick = async () => {
  if (!S.running) return;
  S.running = false;
  clearInterval(S.photoTimer); clearInterval(S.tickTimer);
  if (S.audio?.minute) flushMinute(S.audio.minute);
  S.night.end = Date.now();
  await put('nights', S.night);
  try { localStorage.removeItem('sleepcam-active'); } catch (e) {}
  $('btnStop').disabled = true;
  log(tr('logStopped'));
  queueRender(S.night.id, S.lastChunk);
  await S.rendering;
  try { S.audio?.proc.disconnect(); } catch (e) {}
  S.audio = null;
  S.stream?.getTracks().forEach(t => t.stop()); S.stream = null;
  try { await S.wakeLock?.release(); } catch (e) {}
  $('btnStop').disabled = false;
  $('rec').hidden = true; $('setup').hidden = false; $('btnLang').hidden = false;
  renderNights();
};

/* ---------------- Video rendering ---------------- */
function queueRender(night, chunk) {
  S.rendering = S.rendering.then(() => renderVideo(night, chunk)).catch(e => log(tr('logVidFail', { e: e.message })));
  return S.rendering;
}
function pickMime() {
  const opts = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
async function renderVideo(night, chunk, onProgress) {
  let meta = (await photoMetaByNight(night)).sort((a, b) => a.t - b.t);
  if (chunk != null) meta = meta.filter(p => p.chunk === chunk);
  if (meta.length < 2) { log(tr('logFewPhotos')); return; }
  const nightRec = (await allNights()).find(n => n.id === night) || {};
  const fps = nightRec.fps || +$('fps').value;
  const bar = $('renderBar'); bar.hidden = false;
  const prog = (f) => { bar.firstElementChild.style.width = (f * 100).toFixed(1) + '%'; onProgress?.(f); };
  log(tr('logMaking', { n: meta.length, s: Math.ceil(meta.length / fps) }));
  const first = await createImageBitmap((await getPhoto(meta[0].id)).blob);
  const c = $('render'); c.width = first.width; c.height = first.height;
  const g = c.getContext('2d');
  const mime = pickMime();
  const stream = c.captureStream(fps);
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 2_500_000 } : undefined);
  const parts = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  const draw = (bmp, p) => {
    g.drawImage(bmp, 0, 0, c.width, c.height);
    const fs = Math.round(c.width / 22);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, c.height - fs * 1.8, c.width, fs * 1.8);
    g.fillStyle = '#fff'; g.font = `600 ${fs}px ui-monospace, Menlo, monospace`;
    g.fillText(hhmm(p.t), fs * 0.6, c.height - fs * 0.55);
    const bx = fs * 4.6, bw = c.width * 0.35, by = c.height - fs * 1.15, bh = fs * 0.5;
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(bx, by, bw, bh);
    g.fillStyle = p.snore ? '#d9725f' : '#e0a458'; g.fillRect(bx, by, bw * Math.min(1, (p.db || 0) / 40), bh);
    if (p.snore) { g.fillStyle = '#d9725f'; g.fillText(tr('overlaySnore'), bx + bw + fs * 0.6, c.height - fs * 0.55); }
  };
  draw(first, meta[0]); first.close?.();
  rec.start(1000);
  let next = createImageBitmap((await getPhoto(meta[1]?.id || meta[0].id)).blob);
  const frameMs = 1000 / fps;
  let tNext = performance.now() + frameMs;
  for (let i = 1; i < meta.length; i++) {
    const bmp = await next;
    if (i + 1 < meta.length) next = getPhoto(meta[i + 1].id).then(r => createImageBitmap(r.blob));
    const wait = tNext - performance.now();
    if (wait > 0) await sleep(wait);
    draw(bmp, meta[i]); bmp.close?.();
    tNext += frameMs;
    if (i % 10 === 0) prog(i / meta.length);
  }
  await sleep(frameMs * 3);
  rec.stop();
  await stopped;
  stream.getTracks().forEach(t => t.stop());
  const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
  const blob = new Blob(parts, { type });
  await put('videos', { night, chunk: chunk ?? 'all', t0: meta[0].t, t1: meta[meta.length - 1].t, blob, type, frames: meta.length });
  prog(1); setTimeout(() => { bar.hidden = true; }, 800);
  log(tr('logVidReady', { a: hhmm(meta[0].t), b: hhmm(meta[meta.length - 1].t), mb: (blob.size / 1e6).toFixed(1) }));
  if (!S.running) renderNights();
}

/* ---------------- Save / share ---------------- */
async function saveBlob(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
}

/* ---------------- Morning view ---------------- */
const urls = [];
let renderGen = 0;
async function renderNights() {
  const gen = ++renderGen;
  const nights = (await allNights()).sort((a, b) => b.start - a.start);
  const data = [];
  for (const n of nights) data.push(await Promise.all([photoMetaByNight(n.id), byNight('clips', n.id), byNight('videos', n.id), byNight('minutes', n.id)]));
  if (gen !== renderGen) return;
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  const box = $('nights'); box.innerHTML = '';
  for (const [i, n] of nights.entries()) {
    const [meta, clips, vids, mins] = data[i];
    const end = n.end || (meta.length ? meta[meta.length - 1].t : n.start);
    const snoreMins = mins.filter(m => m.snores > 0).length;
    const card = document.createElement('section'); card.className = 'card';
    const d = new Date(n.start);
    card.innerHTML = `
      <div class="night-head"><h2>${d.toLocaleDateString(tr('locale'), { weekday: 'long', day: 'numeric', month: 'short' })}</h2>
      <span class="sub">${hhmm(n.start)}–${hhmm(end)} · ${dur(end - n.start).slice(0, 5)} h${n.end ? '' : ' · ' + tr('unfinished')}</span></div>
      <div class="stats">
        <div class="stat"><b>${meta.length}</b><span>${tr('statPhotos')}</span></div>
        <div class="stat"><b>${snoreMins}</b><span>${tr('statSnoreMin')}</span></div>
        <div class="stat"><b>${clips.filter(c => c.kind === 'snore').length}</b><span>${tr('statSnoreClips')}</span></div>
      </div>
      <canvas class="chart"></canvas>
      <p class="sub">${tr('chartCaption')}</p>
      <div class="vids" style="display:flex;flex-direction:column;gap:12px"></div>
      <div class="row"><button class="small mk">${tr('btnWhole')}</button><button class="small danger del">${tr('btnDelete')}</button></div>
      <details><summary>${tr('clipsTitle', { n: clips.length })}</summary><div class="clips"></div></details>`;
    box.appendChild(card);
    drawChart(card.querySelector('canvas'), mins.sort((a, b) => a.t - b.t), n.start, end);
    const vbox = card.querySelector('.vids');
    vids.sort((a, b) => a.t0 - b.t0).forEach(v => {
      const u = URL.createObjectURL(v.blob); urls.push(u);
      const ext = v.type.includes('webm') ? 'webm' : 'mp4';
      const el = document.createElement('div'); el.className = 'vid';
      el.innerHTML = `<video src="${u}" controls playsinline preload="metadata"></video>
        <div class="row" style="justify-content:space-between"><span class="sub">${v.chunk === 'all' ? tr('vidWhole') : tr('vidPart')} · ${hhmm(v.t0)}–${hhmm(v.t1)} · ${(v.blob.size / 1e6).toFixed(1)} MB</span>
        <button class="small">${tr('btnSaveVid')}</button></div>`;
      el.querySelector('button').onclick = () => saveBlob(v.blob, `${tr('filePrefix')}-${d.toISOString().slice(0, 10)}-${hhmm(v.t0).replace(':', '')}.${ext}`);
      vbox.appendChild(el);
    });
    if (!vids.length) vbox.innerHTML = '<p class="sub">' + tr('noVideo') + '</p>';
    const cbox = card.querySelector('.clips');
    clips.sort((a, b) => a.t - b.t).forEach(c => {
      const el = document.createElement('div'); el.className = 'clip';
      el.innerHTML = `<span class="t">${hhmm(c.t)}</span><span class="tag ${c.kind === 'snore' ? 'snore' : ''}">${c.kind === 'snore' ? tr('tagSnore') : tr('tagLoud')}</span><button class="small">${tr('play')}</button>`;
      let audio = null;
      el.querySelector('button').onclick = (e) => {
        if (!audio) { const u = URL.createObjectURL(c.blob); urls.push(u); audio = new Audio(u); audio.onended = () => e.target.textContent = tr('play'); }
        if (audio.paused) { audio.play(); e.target.textContent = tr('pause'); } else { audio.pause(); e.target.textContent = tr('play'); }
      };
      cbox.appendChild(el);
    });
    if (!clips.length) cbox.innerHTML = '<p class="sub">' + tr('noClips') + '</p>';
    card.querySelector('.mk').onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = tr('making');
      await queueRender(n.id, null);
    };
    const del = card.querySelector('.del');
    del.onclick = async () => {
      if (del.dataset.armed) { await deleteNight(n.id); renderNights(); return; }
      del.dataset.armed = '1'; del.textContent = tr('btnDeleteConfirm');
      setTimeout(() => { delete del.dataset.armed; del.textContent = tr('btnDelete'); }, 4000);
    };
  }
  try {
    const est = await navigator.storage.estimate();
    $('storage').textContent = tr('storage', { mb: (est.usage / 1e6).toFixed(0) });
  } catch (e) {}
}

loadSettings();
applyLang();
if (LANG) { $('setup').hidden = false; $('btnLang').hidden = false; }
else { $('langPick').hidden = false; $('nights').hidden = true; $('intro').hidden = true; $('storage').hidden = true; }
if (!navigator.mediaDevices?.getUserMedia) alertBox(tr('errNoCam'));
if (!window.MediaRecorder) alertBox(tr('errNoRec'));
renderNights();
renderChips();
</script>
