<title>Hundert Stufen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,500&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; a Reclam-yellow cover band on top, "Hefte" (tracks) below, each opening onto a 10×10 map of Stufen. */
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#15171C; --muted:#5A6070; --line:#D9DCE2; --soft:#E9EBEF;
  --reclam:#F4C300; --reclam-ink:#1B1600;
  --a2:#17806F; --b1:#2D57CC; --b2:#8A3CA6;
  --ok:#1D7F48; --ok-bg:#E3F3EA; --bad:#C2352B; --bad-bg:#FBE7E5;
  --f-text:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111318; --card:#1A1D23; --ink:#ECEDF0; --muted:#9BA1AE; --line:#2C3038; --soft:#23272E;
  --reclam:#F4C300; --reclam-ink:#1B1600;
  --a2:#3CC2AC; --b1:#7D9CFF; --b2:#C887E8;
  --ok:#55C985; --ok-bg:#16301F; --bad:#FF7468; --bad-bg:#3A1A18; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#111318; --card:#1A1D23; --ink:#ECEDF0; --muted:#9BA1AE; --line:#2C3038; --soft:#23272E;
  --reclam:#F4C300; --reclam-ink:#1B1600;
  --a2:#3CC2AC; --b1:#7D9CFF; --b2:#C887E8;
  --ok:#55C985; --ok-bg:#16301F; --bad:#FF7468; --bad-bg:#3A1A18; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
.cover{background:var(--reclam);color:var(--reclam-ink)}
.cover .wrap{padding-block:18px 20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
h1,h2,h3{font-family:var(--f-text);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:34px;line-height:1.05;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.15}
h3{font-size:18px}
.de{font-family:var(--f-text)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.tnum{font-variant-numeric:tabular-nums}

/* cover stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.stat{border:1.5px solid var(--reclam-ink);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:22px;font-family:var(--f-text);line-height:1.1}
.stat span{font-size:12px}
.goalbar{height:6px;border-radius:3px;background:rgba(27,22,0,.18);margin-top:6px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--reclam-ink)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:14px 16px;font-weight:700;cursor:pointer;min-height:50px;text-align:center}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-yellow{background:var(--reclam);color:var(--reclam-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{font-weight:500;opacity:.8}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions .wide{grid-column:1/-1}

/* sections */
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}

/* track list */
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.track:hover{border-color:var(--muted)}
.heft{font-family:var(--f-text);font-weight:700;font-size:15px;width:44px;height:56px;border-radius:4px;background:var(--reclam);color:var(--reclam-ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.track-name{font-weight:700;min-width:0}
.track-sub{font-size:13px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.c-A2{color:var(--a2)} .c-B1{color:var(--b1)} .c-B2{color:var(--b2)}
.bg-A2{background:var(--a2)} .bg-B1{background:var(--b1)} .bg-B2{background:var(--b2)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
.topbar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center}
.topbar .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* level map */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:14px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.tile{aspect-ratio:1/1.12;max-width:100%;border-radius:7px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:13px;font-weight:700;position:relative;overflow:hidden}
.tile .st{font-size:8px;letter-spacing:1px;line-height:1;margin-top:2px;color:var(--reclam-ink)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bandc)}
.tile.done{background:var(--reclam);color:var(--reclam-ink);border-color:var(--reclam)}
.tile.next{border-color:var(--ink);border-width:2.5px}
.tile.locked{opacity:.38;cursor:pointer}
.tile[data-band="A2"]{--bandc:var(--a2)} .tile[data-band="B1"]{--bandc:var(--b1)} .tile[data-band="B2"]{--bandc:var(--b2)}
.band-label{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 2px}

/* lesson */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lesson-title{margin:6px 0 4px}
.explain{font-family:var(--f-text);font-size:17px}
.explain-en{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:8px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--b1);font-weight:700;cursor:pointer;text-align:left;font-size:14px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--soft)}
.ex:first-child{border-top:0}
.ex .de{flex:1;min-width:0;font-size:17px}
.ex mark{background:transparent;color:inherit;font-weight:700;box-shadow:inset 0 -0.45em 0 rgba(244,195,0,.55);padding:0 1px}
.ex .en{font-size:14px;color:var(--muted)}
.art-der{color:var(--b1)} .art-die{color:var(--bad)} .art-das{color:var(--a2)}

/* quiz */
.qprog{display:flex;gap:4px;margin:14px 0 18px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.qprog i.ok{background:var(--ok)} .qprog i.bad{background:var(--bad)} .qprog i.cur{background:var(--ink)}
.qkind{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.qtext{font-family:var(--f-text);font-size:21px;line-height:1.4;margin:8px 0 6px;overflow-wrap:anywhere}
.qtext .blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--ink);height:1.1em;vertical-align:baseline}
.qtext .filled{border-bottom:2.5px solid var(--ok);font-weight:700}
.qtext .filled.bad{border-color:var(--bad)}
.qhint{color:var(--muted);font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;font-family:var(--f-text);font-size:17px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--f-ui);font-size:12px;font-weight:700;width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opts.arts{flex-direction:row}
.opts.arts .opt{justify-content:center;font-weight:700;font-size:19px}
.typebox{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.typebox input{font-family:var(--f-text);font-size:19px;padding:13px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.umlauts{display:flex;gap:6px}
.umlauts button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-family:var(--f-text);font-size:17px;cursor:pointer}
.fb{margin-top:16px;border-radius:var(--r);padding:14px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .verdict{font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb .ans{font-family:var(--f-text);font-size:17px;margin-top:6px}
.fb .why{font-family:var(--f-text);margin-top:8px}
.sticky-next{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top, var(--paper) 70%, transparent)}

/* result */
.result{text-align:center;padding-top:30px}
.big{font-family:var(--f-text);font-size:64px;font-weight:700;line-height:1}
.stars{font-size:34px;letter-spacing:6px;color:var(--reclam)}
.stars .off{color:var(--soft)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));max-height:88vh;overflow:auto}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 0;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px}
.mistake{padding:12px 0;border-top:1px solid var(--soft)}
.mistake:first-child{border-top:0}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .opt,.tile,.btn{transition:border-color .12s, background-color .12s, transform .08s}
  .btn:active,.opt:active:not(:disabled){transform:scale(.985)}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
}
@media (max-width:380px){ h1{font-size:28px} .map{gap:3px} .tile{font-size:11px} }
</style>

 Personen (wohnen) oder Firmen (arbeiten).","en":"\"bei\" + dative: at someone's home or working for a company.","sents":["Ich wohne noch bei {meinen|meine|meiner} Eltern.","Sie arbeitet bei {einer|eine|einen} Bank."]},{"title":"nach + Dativ","de":"„nach“ + Dativ: zeitlich „danach“; bei Ländern und Städten ohne Artikel: Richtung.","en":"\"nach\" + dative: \"after\"; with countries/cities without article: direction \"to\".","sents":["Nach {dem|den|das} Essen gehen wir spazieren.","Wir fliegen {nach|zu|in} Spanien."]},{"title":"zu + Dativ","de":"„zu“ + Dativ, oft verschmolzen: zu dem = zum, zu der = zur.","en":"\"zu\" + dative, often contracted: zu dem = zum, zu der = zur.","sents":["Ich gehe {zum|zur|zu} Arzt.","Kommst du heute {zur|zum|zu der die} Party?"]},{"title":"von + Dativ","de":"„von“ + Dativ: Absender oder Startpunkt; von dem = vom.","en":"\"von\" + dative: sender or starting point; von dem = vom.","sents":["Das ist ein Geschenk {von|aus|bei} meiner Oma.","Ich komme gerade vom {Bahnhof|Bahnhofs|Bahnhofe}."]},{"title":"seit + Dativ","de":"„seit“ + Dativ: etwas hat in der Vergangenheit begonnen und dauert noch an.","en":"\"seit\" + dative: something started in the past and is still going on (\"for/since\").","sents":["Ich lerne {seit|vor|für} zwei Jahren Deutsch.","Seit {einer|eine|einen} Woche ist er krank."]},{"title":"vor + Zeit","de":"„vor“ + Dativ bei Zeit = „ago“: abgeschlossen in der Vergangenheit.","en":"\"vor\" + dative with time = \"ago\": finished in the past.","sents":["Ich habe ihn {vor|seit|nach} drei Tagen gesehen.","Vor {einem|einen|ein} Jahr bin ich umgezogen."]},{"title":"für + Akkusativ","de":"„für“ steht immer mit Akkusativ.","en":"\"für\" always takes the accusative.","sents":["Das Geschenk ist für {meinen|meinem|mein} Bruder.","Ich habe keine Zeit für {dich|dir|du}."]},{"title":"ohne + Akkusativ","de":"„ohne“ steht immer mit Akkusativ, oft ohne Artikel.","en":"\"ohne\" always takes the accusative, often without an article.","sents":["Ich trinke Kaffee ohne {Zucker|den Zuckers|dem Zucker}.","Er geht nie ohne {seinen|seinem|sein} Hund spazieren."]},{"title":"durch + Akkusativ","de":"„durch“ + Akkusativ: von einer Seite zur anderen oder „mithilfe von“.","en":"\"durch\" + accusative: \"through\" or \"by means of\".","sents":["Wir gehen durch {den|dem|der} Park.","Ich habe die Stelle durch {einen|einem|ein} Freund gefunden."]},{"title":"gegen + Akkusativ","de":"„gegen“ + Akkusativ: Kontakt, Widerstand oder ungefähre Uhrzeit.","en":"\"gegen\" + accusative: against, or approximately (time).","sents":["Das Auto fuhr gegen {einen|einem|ein} Baum.","Ich habe nichts gegen {deinen|deinem|dein} Plan."]},{"title":"um + Uhrzeit","de":"„um“ + Akkusativ: genaue Uhrzeit oder „rund herum“.","en":"\"um\" + accusative: exact clock time or \"around\".","sents":["Der Kurs beginnt {um|am|im} acht Uhr.","Wir sitzen um {den|dem|der} Tisch."]},{"title":"am, im, um","de":"Zeit: am + Tag/Datum, im + Monat/Jahreszeit, um + Uhrzeit.","en":"Time: am + day/date, im + month/season, um + clock time.","sents":["Ich habe {am|im|um} Montag Zeit.","Wir fahren {im|am|um} Juli in Urlaub."]},{"title":"in + Akkusativ (wohin?)","de":"Wechselpräposition: Richtung (wohin?) → Akkusativ.","en":"Two-way preposition: direction (where to?) → accusative.","sents":["Ich gehe in {die|der|den} Küche.","Er legt das Buch in {den|dem|die} Schrank."]},{"title":"in + Dativ (wo?)","de":"Wechselpräposition: Ort (wo?) → Dativ; in dem = im.","en":"Two-way preposition: location (where?) → dative; in dem = im.","sents":["Ich bin in {der|die|den} Küche.","Das Buch liegt im {Schrank|Schranks|Schranke}."]},{"title":"auf","de":"„auf“ = Kontakt von oben. Wo? → Dativ, wohin? → Akkusativ.","en":"\"auf\" = on top (touching). Where? → dative, where to? → accusative.","sents":["Die Tasse steht auf {dem|den|das} Tisch.","Stell die Tasse bitte auf {den|dem|der} Tisch."]},{"title":"an","de":"„an“ = Kontakt von der Seite. Wo? → Dativ, wohin? → Akkusativ.","en":"\"an\" = touching at the side. Where? → dative, where to? → accusative.","sents":["Das Bild hängt an {der|die|den} Wand.","Ich hänge das Bild an {die|der|den} Wand."]},{"title":"über / unter","de":"„über“/„unter“ sind Wechselpräpositionen: wo? Dativ – wohin? Akkusativ.","en":"\"über\"/\"unter\" are two-way: where? dative – where to? accusative.","sents":["Die Lampe hängt über {dem|den|das} Tisch.","Die Katze läuft unter {das|dem|des} Bett."]},{"title":"vor / hinter","de":"„vor“/„hinter“: wo? Dativ – wohin? Akkusativ.","en":"\"vor\"/\"hinter\": where? dative – where to? accusative.","sents":["Das Auto steht vor {dem|den|das} Haus.","Der Ball rollt hinter {den|dem|der} Schrank."]},{"title":"neben / zwischen","de":"„neben“/„zwischen“: wo? Dativ – wohin? Akkusativ.","en":"\"neben\"/\"zwischen\": where? dative – where to? accusative.","sents":["Ich sitze neben {meinem|meinen|mein} Freund.","Stell den Stuhl zwischen {die|den|der} Fenster."]},{"title":"zu Hause / nach Hause","de":"Feste Ausdrücke: zu Hause (wo?) – nach Hause (wohin?).","en":"Fixed phrases: zu Hause (at home) – nach Hause (home, direction).","sents":["Ich bin heute Abend {zu|nach|in} Hause.","Ich gehe jetzt {nach|zu|in} Hause."]},{"title":"in die / nach","de":"Länder mit Artikel: in + Akk. Länder ohne Artikel: nach.","en":"Countries with article: in + acc. Countries without article: nach.","sents":["Wir fahren {in die|nach|zu} Schweiz.","Im Sommer fliege ich {nach|in|zu} Italien."]},{"title":"zum / zur / nach","de":"Gebäude/Personen als Ziel: zu.","en":"Buildings/people as destination: zu.","sents":["Ich gehe {zur|zum|in} Post.","Wir fahren {zum|zur|nach} Bahnhof."]},{"title":"ins Kino / im Kino","de":"in das = ins (wohin?), in dem = im (wo?).","en":"in das = ins (where to?), in dem = im (where?).","sents":["Wir gehen heute {ins|im|zum das} Kino.","Gestern waren wir {im|ins|am} Theater."]},{"title":"gegenüber","de":"„gegenüber“ + Dativ, bei Pronomen oft nachgestellt.","en":"\"gegenüber\" + dative, often placed after pronouns.","sents":["Die Apotheke ist gegenüber {dem|den|des} Bahnhof.","Er wohnt mir {gegenüber|vor|neben}."]},{"title":"bis","de":"„bis“ = Endpunkt (Zeit oder Ort), meist ohne Artikel.","en":"\"bis\" = until / as far as, usually without article.","sents":["Ich arbeite {bis|seit|für} 17 Uhr.","Der Zug fährt nur bis {Köln|nach Köln zu|zum Köln}."]},{"title":"ab","de":"„ab“ = Startpunkt in der Zukunft oder Abfahrtsort.","en":"\"ab\" = from (a future point) or departure point.","sents":["{Ab|Seit|Von} nächster Woche arbeite ich Vollzeit.","Der Bus fährt ab {Hauptbahnhof|dem Hauptbahnhofs|zum Hauptbahnhof}."]},{"title":"von … bis","de":"„von … bis“ für Zeiträume; mit Datum: vom … bis zum.","en":"\"von … bis\" for periods; with dates: vom … bis zum.","sents":["Der Laden ist {von|ab|seit} 9 bis 18 Uhr geöffnet.","Wir haben vom 1. {bis zum|nach dem|zum bis} 5. Mai Urlaub."]},{"title":"während","de":"„während“ + Genitiv: gleichzeitig mit etwas.","en":"\"während\" + genitive: during.","sents":["{Während|Seit|Nach} des Unterrichts ist das Handy aus.","Während {der|die|dem} Pause trinke ich Kaffee."]},{"title":"wegen","de":"„wegen“ + Genitiv (gesprochen oft Dativ): Grund.","en":"\"wegen\" + genitive (spoken often dative): because of.","sents":["Wegen {des|dem|den} Regens bleiben wir zu Hause.","Der Zug fällt wegen {eines|einem|einen} Streiks aus."]},{"title":"trotz","de":"„trotz“ + Genitiv: Gegengrund.","en":"\"trotz\" + genitive: despite.","sents":["Trotz {des|dem|der} Regens gehen wir spazieren.","Er arbeitet trotz {seiner|seine|seinen} Krankheit."]},{"title":"statt","de":"„(an)statt“ + Genitiv; ohne Artikel oft endungslos.","en":"\"(an)statt\" + genitive: instead of; without article often no ending.","sents":["Statt {eines|einem|einen} Autos kaufe ich ein Fahrrad.","Ich nehme Tee statt {Kaffee|dem Kaffees|zum Kaffee}."]},{"title":"innerhalb / außerhalb","de":"„innerhalb/außerhalb“ + Genitiv: Zeit oder Ort.","en":"\"innerhalb/außerhalb\" + genitive: within/outside (time or place).","sents":["Bitte zahlen Sie innerhalb {einer|eine|einem} Woche.","Wir wohnen außerhalb {der|die|dem} Stadt."]},{"title":"Akk oder Dativ? I","de":"Verben haben feste Präpositionen: warten auf + Akk.","en":"Verbs have fixed prepositions: warten auf + acc.","sents":["Ich warte {auf|für|an} den Bus.","Wir treffen uns {vor|an|bei} dem Kino."]},{"title":"Akk oder Dativ? II","de":"legen (wohin?) → Akk; liegen (wo?) → Dativ.","en":"legen (where to?) → acc; liegen (where?) → dative.","sents":["Leg den Schlüssel auf {den|dem|der} Tisch!","Der Schlüssel liegt auf {dem|den|das} Tisch."]},{"title":"Akk oder Dativ? III","de":"stellen → wohin? Akk; stehen → wo? Dativ.","en":"stellen → where to? acc; stehen → where? dative.","sents":["Ich stelle die Flasche in {den|dem|der} Kühlschrank.","Die Flasche steht im {Kühlschrank|Kühlschranks|Kühlschranke}."]},{"title":"Akk oder Dativ? IV","de":"hängen + Akk (Bewegung) – hängen + Dativ (Zustand).","en":"hängen + acc (action) – hängen + dative (state).","sents":["Ich hänge die Jacke an {den|dem|der} Haken.","Die Jacke hängt an {dem|den|das} Haken."]},{"title":"Akk oder Dativ? V","de":"sich setzen (wohin?) → Akk; sitzen (wo?) → Dativ.","en":"sich setzen (where to?) → acc; sitzen (where?) → dative.","sents":["Er setzt sich auf {das|dem|den} Sofa.","Er sitzt auf {dem|das|den} Sofa."]},{"title":"Wiederholung A2","de":"zu + Person; seit + Dativ.","en":"zu + person; seit + dative.","sents":["Ich gehe heute {zum|ins|nach} Zahnarzt.","Wir sind seit {einer|eine|ein} Stunde hier."]},{"title":"warten auf","de":"warten auf + Akkusativ; Frage: worauf?","en":"warten auf + accusative; question: worauf?","sents":["Ich warte schon lange auf {deine|deiner|deinen} Antwort.","Worauf {wartest|wartet|warten} du?"]},{"title":"denken an","de":"denken an + Akkusativ; Frage: woran?","en":"denken an + accusative; question: woran?","sents":["Ich denke oft an {meine|meiner|meinen} Kindheit.","{Woran|Worauf|Wofür} denkst du gerade?"]},{"title":"sich freuen auf / über","de":"freuen auf = Zukunft; freuen über = Gegenwart/Vergangenheit.","en":"sich freuen auf = looking forward to; über = happy about (now/past).","sents":["Ich freue mich {auf|über|an} den Urlaub nächste Woche.","Ich freue mich {über|auf|für} dein Geschenk."]},{"title":"sich interessieren für","de":"sich interessieren für + Akkusativ.","en":"sich interessieren für + accusative.","sents":["Ich interessiere mich {für|an|über} Politik.","{Wofür|Woran|Worüber} interessierst du dich?"]},{"title":"sprechen über / mit","de":"sprechen über + Akk (Thema), sprechen mit + Dativ (Person).","en":"sprechen über + acc (topic), mit + dative (person).","sents":["Wir sprechen {über|von|an} das Problem.","Ich muss {mit|zu|bei} meinem Chef sprechen."]},{"title":"Angst haben vor","de":"Angst haben vor + Dativ.","en":"Angst haben vor + dative.","sents":["Viele Kinder haben Angst {vor|von|für} Hunden.","Ich habe Angst vor {der|die|den} Prüfung."]},{"title":"teilnehmen an","de":"teilnehmen an + Dativ.","en":"teilnehmen an + dative.","sents":["Ich nehme {an|bei|in} einem Deutschkurs teil.","Sie nimmt an {der|die|den} Konferenz teil."]},{"title":"sich bewerben um / bei","de":"sich bewerben um (Stelle) + Akk, bei (Firma) + Dativ.","en":"apply for (um + acc), apply to a company (bei + dative).","sents":["Ich bewerbe mich {um|für|auf} eine Stelle als Koch.","Er bewirbt sich {bei|an|für} einer großen Firma."]},{"title":"sich kümmern um","de":"sich kümmern um + Akkusativ.","en":"sich kümmern um + accusative.","sents":["Wer kümmert sich {um|für|auf} die Kinder?","Ich kümmere mich um {das|dem|des} Essen."]},{"title":"sich gewöhnen an","de":"sich gewöhnen an + Akk; Pronominaladverb: daran.","en":"sich gewöhnen an + acc; pronominal adverb: daran.","sents":["Ich habe mich {an|auf|um} das Wetter gewöhnt.","{Daran|Darauf|Darum} musst du dich gewöhnen."]},{"title":"abhängen von","de":"abhängen von + Dativ; „davon … ob“.","en":"abhängen von + dative; \"davon … ob\".","sents":["Das hängt {vom|am|zum} Wetter ab.","Es hängt davon ab, {ob|dass|wenn} ich Zeit habe."]},{"title":"sich erinnern an","de":"sich erinnern an + Akkusativ.","en":"sich erinnern an + accusative.","sents":["Ich erinnere mich gut {an|von|auf} meinen ersten Schultag.","Erinnerst du dich {daran|darüber|davon}?"]},{"title":"sich beschweren über / bei","de":"sich beschweren über (Sache) + Akk, bei (Person) + Dativ.","en":"complain about (über + acc), to someone (bei + dative).","sents":["Ich beschwere mich {über|von|gegen} den Lärm.","Sie beschwert sich {beim|zum|am} Vermieter."]},{"title":"bitten um","de":"bitten um + Akkusativ.","en":"bitten um + accusative.","sents":["Darf ich Sie {um|für|nach} Hilfe bitten?","Er bat mich um {einen|einem|ein} Gefallen."]},{"title":"fragen nach","de":"fragen nach + Dativ.","en":"fragen nach + dative.","sents":["Der Tourist fragt {nach|um|für} dem Weg.","Sie hat {nach|über|an} dir gefragt."]},{"title":"sich entschuldigen für / bei","de":"sich entschuldigen für (Grund) + Akk, bei (Person) + Dativ.","en":"apologise for (für + acc), to someone (bei + dative).","sents":["Ich entschuldige mich {für|um|über} die Verspätung.","Du musst dich {bei|an|zu} ihr entschuldigen."]},{"title":"sich vorbereiten auf","de":"sich vorbereiten auf + Akkusativ.","en":"sich vorbereiten auf + accusative.","sents":["Ich bereite mich {auf|für|an} die Prüfung vor.","{Worauf|Wofür|Woran} bereitest du dich vor?"]},{"title":"sich ärgern über","de":"sich ärgern über + Akkusativ.","en":"sich ärgern über + accusative.","sents":["Ich ärgere mich {über|auf|an} meinen Fehler.","Ärgere dich nicht {darüber|davon|daran}!"]},{"title":"träumen von","de":"träumen von + Dativ.","en":"träumen von + dative.","sents":["Ich träume {von|über|an} einem eigenen Haus.","{Wovon|Worüber|Woran} träumst du?"]},{"title":"gehören zu","de":"gehören zu + Dativ = Teil von etwas sein.","en":"gehören zu + dative = to be part of.","sents":["Das gehört {zu|an|bei} meinen Aufgaben.","Er gehört {zur|zum|zu der den} Familie."]},{"title":"sich verlassen auf","de":"sich verlassen auf + Akkusativ.","en":"sich verlassen auf + accusative.","sents":["Du kannst dich {auf|an|zu} mich verlassen.","Ich verlasse mich auf {deine|deiner|deinen} Hilfe."]},{"title":"Pronominaladverb da-","de":"Bei Sachen: da(r) + Präposition.","en":"For things: da(r) + preposition.","sents":["Ich warte auf den Bus. – Ich warte auch {darauf|auf ihn|worauf}.","Sie spricht über ihre Arbeit. – Sie spricht oft {darüber|über es|worüber}."]},{"title":"Personen vs. Sachen","de":"Bei Personen: Präposition + Pronomen; Frage: Präp. + wen/wem.","en":"For people: preposition + pronoun; question: prep. + wen/wem.","sents":["Ich warte auf meinen Bruder. – Ich warte auf {ihn|darauf|woran}.","{Auf wen|Worauf|Wofür} wartest du? – Auf Anna."]},{"title":"außer","de":"„außer“ + Dativ = mit Ausnahme von.","en":"\"außer\" + dative = except.","sents":["Alle {außer|ohne|statt} mir waren da.","Außer {einem|einen|ein} Apfel habe ich nichts gegessen."]},{"title":"entlang","de":"„entlang“ steht meist nach dem Nomen + Akkusativ.","en":"\"entlang\" usually comes after the noun + accusative.","sents":["Wir gehen den Fluss {entlang|entlangs|entlanges}.","Gehen Sie {die Straße entlang|entlang die Straße zu|der Straße entlang zu}."]},{"title":"um … herum","de":"„um … herum“ + Akkusativ = im Kreis.","en":"\"um … herum\" + accusative = around (in a circle).","sents":["Wir sitzen {um|an|über} das Feuer herum.","Der Bus fährt um {die|der|den} Stadt herum."]},{"title":"laut / gemäß","de":"„laut“/„gemäß“ = nach Angabe von (oft Dativ).","en":"\"laut\"/\"gemäß\" = according to (often dative).","sents":["{Laut|Wegen|Statt} Wetterbericht wird es morgen warm.","Gemäß {dem|den|des} Vertrag müssen Sie kündigen."]},{"title":"dank","de":"„dank“ + Genitiv/Dativ: positiver Grund.","en":"\"dank\" + genitive/dative: thanks to.","sents":["{Dank|Trotz|Ohne} deiner Hilfe habe ich es geschafft.","Dank {des|den|dem das} guten Wetters konnten wir grillen."]},{"title":"mithilfe","de":"„mithilfe“ + Genitiv = mit Unterstützung von.","en":"\"mithilfe\" + genitive = with the help of.","sents":["Mithilfe {eines|einem|einen} Wörterbuchs habe ich den Text verstanden.","Er hat die Wohnung {mithilfe|mitsamt|mittels zu} seines Bruders renoviert."]},{"title":"zwischen (Zeit)","de":"„zwischen“ + Dativ bei Zeitangaben.","en":"\"zwischen\" + dative with times.","sents":["Ruf mich {zwischen|unter|innerhalb} 8 und 9 Uhr an.","Zwischen {den|die|der} Feiertagen ist das Büro geschlossen."]},{"title":"nach / zu / bei: Personen","de":"Zu einer Person hin = zu; bei einer Person sein = bei.","en":"Going to a person = zu; being at a person's place = bei.","sents":["Ich fahre am Wochenende {zu|nach|bei} meinen Eltern.","Ich bin am Wochenende {bei|zu|an} meinen Eltern."]},{"title":"auf dem Land / aufs Land","de":"Feste Ausdrücke: auf dem Land (wo?), aufs Land (wohin?).","en":"Fixed phrases: in the countryside (auf dem Land) / to the countryside (aufs Land).","sents":["Meine Großeltern wohnen {auf dem|im|am} Land.","Am Wochenende fahren wir {aufs|ins|zum das} Land."]},{"title":"am Meer / ans Meer","de":"an + Wasser: am Meer (wo?), ans Meer (wohin?).","en":"an + water: am Meer (where?), ans Meer (where to?).","sents":["Wir machen Urlaub {am|im|auf dem} Meer.","Im Sommer fahren wir {ans|ins|zum das} Meer."]},{"title":"in den Bergen","de":"Berge: in den Bergen (wo?) – in die Berge (wohin?).","en":"Mountains: in den Bergen (where?) – in die Berge (where to?).","sents":["Wir wandern gern {in den|auf den|an den} Bergen.","Wir fahren {in die|nach die|zu die} Berge."]},{"title":"auf der Arbeit","de":"Umgangssprache: auf der Arbeit (wo?), zur Arbeit (wohin?).","en":"Colloquial: at work (auf der Arbeit), to work (zur Arbeit).","sents":["Ich bin noch {auf der|in der|zur} Arbeit.","Ich gehe jetzt {zur|auf die zu|in der} Arbeit."]},{"title":"Zeit: in / innerhalb","de":"„in“ + Dativ für die Zukunft: nach Ablauf von.","en":"\"in\" + dative for the future: in (ten minutes).","sents":["Der Zug kommt {in|vor|seit} zehn Minuten.","Ich bin {in|seit|vor} einer Stunde fertig."]},{"title":"für (Zeitraum)","de":"„für“ + Akk = geplante Dauer.","en":"\"für\" + acc = planned duration.","sents":["Ich fahre {für|seit|vor} zwei Wochen nach Spanien.","Wir haben das Zimmer für {eine|einer|einen} Nacht gebucht."]},{"title":"über (Menge/Thema)","de":"„über“ = mehr als; oder Thema + Akk.","en":"\"über\" = more than; or topic + acc.","sents":["Die Reise kostet {über|auf|an} 1000 Euro.","Das ist ein Buch über {die|der|den} Geschichte Berlins."]},{"title":"unter (Menge/Gruppe)","de":"„unter“ = weniger als / innerhalb einer Gruppe.","en":"\"unter\" = less than / among.","sents":["Kinder {unter|über|zwischen} 6 Jahren zahlen nichts.","Unter {uns|wir|unser} gesagt: Das war ein Fehler."]},{"title":"Wiederholung B1 I","de":"freuen über (etwas Geschehenes); trotz + Genitiv.","en":"happy about (über); trotz + genitive.","sents":["Ich habe mich {über|für|auf} die Nachricht sehr gefreut.","Trotz {des|dem|den} Staus kamen wir pünktlich an."]},{"title":"Wiederholung B1 II","de":"zufrieden mit + Dativ; stolz auf + Akkusativ.","en":"zufrieden mit + dative; stolz auf + accusative.","sents":["Ich bin {mit|über|für} deiner Arbeit sehr zufrieden.","Sie ist stolz {auf|über|von} ihren Sohn."]},{"title":"Adjektiv + Präposition I","de":"verheiratet mit, fertig mit + Dativ.","en":"married to, finished with: mit + dative.","sents":["Ich bin {verheiratet mit|verheiratet an|verheiratet zu} einem Lehrer.","Bist du {fertig mit|fertig von|fertig an} der Arbeit?"]},{"title":"Adjektiv + Präposition II","de":"verliebt in + Akk; gespannt auf + Akk.","en":"in love with: in + acc; eager to see: auf + acc.","sents":["Er ist {verliebt in|verliebt an|verliebt mit} seine Nachbarin.","Ich bin {gespannt auf|gespannt an|gespannt über} das Ergebnis."]},{"title":"Adjektiv + Präposition III","de":"interessiert an + Dativ; verantwortlich für + Akk.","en":"interested in: an + dative; responsible for: für + acc.","sents":["Ich bin {an|für|auf} Kunst interessiert.","Sie ist {für|an|zu} das Projekt verantwortlich."]},{"title":"Adjektiv + Präposition IV","de":"abhängig von, überzeugt von + Dativ.","en":"dependent on, convinced of: von + dative.","sents":["Er ist {abhängig von|abhängig an|abhängig über} seinen Eltern.","Ich bin {überzeugt von|überzeugt an|überzeugt über} deiner Idee."]},{"title":"Nomen + Präposition I","de":"Lust auf + Akk; Interesse an + Dativ.","en":"Lust auf + acc; Interesse an + dative.","sents":["Ich habe keine Lust {auf|für|an} Fernsehen.","Er hat großes Interesse {an|für|über} Geschichte."]},{"title":"Nomen + Präposition II","de":"Dank für + Akk; Frage zu + Dativ (Thema).","en":"thanks for: für + acc; question about: zu + dative.","sents":["Danke für {deine|deiner|deinen} Hilfe!","Ich habe eine Frage {zu|an|von} der Rechnung."]},{"title":"Nomen + Präposition III","de":"Angst vor + Dativ; Vertrauen zu + Dativ.","en":"fear of: vor + dative; trust in: zu + dative.","sents":["Die Angst {vor|von|über} der Zukunft ist groß.","Ich habe kein Vertrauen {zu|an|für} ihm."]},{"title":"infolge / aufgrund","de":"„aufgrund“/„infolge“ + Genitiv = wegen (formell).","en":"\"aufgrund\"/\"infolge\" + genitive = due to (formal).","sents":["{Aufgrund|Trotz|Statt} der hohen Kosten wurde das Projekt gestoppt.","Infolge {des|dem|den} Unfalls gab es einen Stau."]},{"title":"bezüglich / hinsichtlich","de":"„bezüglich“/„hinsichtlich“ + Genitiv = in Bezug auf (Amtssprache).","en":"\"bezüglich\"/\"hinsichtlich\" + genitive = regarding (formal).","sents":["Bezüglich {Ihrer|Ihre|Ihrem} Anfrage melden wir uns morgen.","Hinsichtlich {des|dem|den} Termins gibt es eine Änderung."]},{"title":"angesichts","de":"„angesichts“ + Genitiv = wenn man … betrachtet.","en":"\"angesichts\" + genitive = in view of.","sents":["{Angesichts|Anlässlich|Ungeachtet} der Lage müssen wir sparen.","Angesichts {der|die|den} Probleme bleibt er ruhig."]},{"title":"anlässlich","de":"„anlässlich“ + Genitiv = aus Anlass von.","en":"\"anlässlich\" + genitive = on the occasion of.","sents":["{Anlässlich|Angesichts|Aufgrund} seines Geburtstags gab es ein Fest.","Anlässlich {des|dem|den} Jubiläums erhalten alle eine Prämie."]},{"title":"ungeachtet / trotz","de":"„ungeachtet“ + Genitiv = trotz (gehoben).","en":"\"ungeachtet\" + genitive = regardless of (formal).","sents":["{Ungeachtet|Anlässlich|Infolge} aller Warnungen fuhr er los.","Ungeachtet {der|die|den} Kritik hält sie an ihrem Plan fest."]},{"title":"zufolge","de":"„zufolge“ steht nach dem Nomen + Dativ.","en":"\"zufolge\" comes after the noun + dative: according to.","sents":["Dem Bericht {zufolge|gemäß zu|laut zu} ist die Lage stabil.","{Einer Studie zufolge|Zufolge einer Studie|Zufolge eine Studie} schlafen wir zu wenig."]},{"title":"seitens","de":"„seitens“ + Genitiv = von Seiten (Amtssprache).","en":"\"seitens\" + genitive = on the part of (formal).","sents":["{Seitens|Mithilfe|Zwecks} der Firma gab es keine Antwort.","Seitens {des|dem|den} Vermieters ist alles geklärt."]},{"title":"zwecks","de":"„zwecks“ + Genitiv, oft ohne Artikel = zum Zweck von.","en":"\"zwecks\" + genitive, often without article = for the purpose of.","sents":["{Zwecks|Seitens|Laut} Klärung bitten wir um Rückruf.","Wir treffen uns zwecks {Planung|der Planung zu|dem Planung} des Festes."]},{"title":"Nomen-Verb mit Präposition","de":"Feste Verbindungen: in Kraft treten, zur Sprache bringen.","en":"Fixed phrases: come into force, bring up (a topic).","sents":["Das Gesetz tritt morgen {in|auf|zu} Kraft.","Wir müssen das Problem {zur|in die|auf die} Sprache bringen."]},{"title":"Präposition + Infinitiv","de":"ohne … zu / um … zu / (an)statt … zu + Infinitiv.","en":"ohne/um/statt … zu + infinitive.","sents":["Er ging, {ohne|statt|um} sich zu verabschieden.","Sie arbeitet, {um|ohne|statt} Geld zu sparen."]},{"title":"sich beziehen auf / bestehen auf","de":"sich beziehen auf + Akk; bestehen auf + Dativ (= etwas fordern).","en":"refer to: auf + acc; insist on: auf + dative.","sents":["Ich beziehe mich {auf|an|zu} Ihr Schreiben vom 3. Mai.","Er besteht {auf|an|über} einer Entschuldigung."]},{"title":"bestehen aus / in","de":"bestehen aus = Teile haben; bestehen in = der Kern ist.","en":"bestehen aus = consist of; bestehen in = lie in, consist in.","sents":["Das Team besteht {aus|von|in} fünf Personen.","Das Problem besteht {darin|daraus|darauf}, dass niemand Zeit hat."]}]},{"id":"kasus","name":"Kasus & Endungen","en":"Cases & endings","kind":"gap","levels":[{"title":"Nominativ: Wer?","de":"Das Subjekt steht im Nominativ. Frage: Wer oder was?","en":"The subject is in the nominative. Question: who or what?","sents":["{Der|Den|Dem} Mann liest Zeitung.","{Die|Der|Den} Kinder spielen im Garten."]},{"title":"Akkusativ: der → den","de":"Nur maskulin ändert sich im Akkusativ: der → den, ein → einen.","en":"Only masculine changes in the accusative: der → den, ein → einen.","sents":["Ich sehe {den|der|dem} Hund.","Wir kaufen {einen|ein|einem} Tisch."]},{"title":"Akkusativ: die, das bleiben","de":"Feminin und neutral sind im Akkusativ gleich wie im Nominativ.","en":"Feminine and neuter are the same in accusative as in nominative.","sents":["Ich kaufe {die|der|den} Jacke.","Er liest {das|den|dem} Buch."]},{"title":"Dativ: dem / der","de":"Dativ: maskulin/neutral → dem, feminin → der.","en":"Dative: masculine/neuter → dem, feminine → der.","sents":["Ich helfe {dem|den|der} Mann.","Er gibt {der|die|den} Frau eine Blume."]},{"title":"Dativ Plural: -n","de":"Dativ Plural: Artikel „den“ und Nomen + -n.","en":"Dative plural: article \"den\" and noun + -n.","sents":["Ich spiele mit {den Kindern|die Kinder|den Kinder}.","Wir danken {unseren Gästen|unsere Gäste|unseren Gäste}."]},{"title":"Possessiv: mein, dein","de":"Possessivartikel haben die Endungen von „ein“.","en":"Possessive articles take the same endings as \"ein\".","sents":["Das ist {mein|meinen|meine} Bruder.","Ich besuche {meine|meiner|meinen} Oma."]},{"title":"kein im Akkusativ","de":"„kein“ hat die Endungen von „ein“; Plural: keine.","en":"\"kein\" takes the endings of \"ein\"; plural: keine.","sents":["Ich habe {keinen|kein|keine} Hunger.","Wir haben {keine|keinen|kein} Zeit."]},{"title":"Personalpronomen Akkusativ","de":"Akkusativ: mich, dich, ihn, sie, es, uns, euch, sie.","en":"Accusative: mich, dich, ihn, sie, es, uns, euch, sie.","sents":["Ich liebe {dich|dir|du}.","Kennst du {ihn|ihm|er}?"]},{"title":"Personalpronomen Dativ","de":"Dativ: mir, dir, ihm, ihr, ihm, uns, euch, ihnen.","en":"Dative: mir, dir, ihm, ihr, ihm, uns, euch, ihnen.","sents":["Kannst du {mir|mich|ich} helfen?","Ich gebe {ihm|ihn|er} das Buch."]},{"title":"Verben mit Dativ I","de":"gefallen, danken, helfen, gehören + Dativ.","en":"gefallen, danken, helfen, gehören take the dative.","sents":["Das Kleid gefällt {mir|mich|ich}.","Ich danke {Ihnen|Sie|Ihr} für die Hilfe."]},{"title":"Verben mit Dativ II","de":"gehören + Dativ; „Wie geht es dir?“","en":"gehören + dative; \"Wie geht es dir?\"","sents":["Das Auto gehört {meinem|meinen|mein} Vater.","Wie geht es {dir|dich|du}?"]},{"title":"Dativ + Akkusativ","de":"Person im Dativ, Sache im Akkusativ.","en":"Person in the dative, thing in the accusative.","sents":["Ich schenke {meiner|meine|meinen} Mutter einen Schal.","Er erklärt {den|die|dem} Schülern die Regel."]},{"title":"Pronomen-Reihenfolge","de":"Zwei Pronomen: Akkusativ vor Dativ.","en":"Two pronouns: accusative before dative.","sents":["Ich gebe {es ihm|ihm es|ihn es}.","Gibst du mir das Buch? – Ja, ich gebe {es dir|dir es|dich es}."]},{"title":"Adjektiv nach der/die/das","de":"Nach bestimmtem Artikel, Nominativ Sg. und Akk. feminin/neutral: -e.","en":"After the definite article, nominative singular (and acc. fem./neut.): -e.","sents":["Der {alte|alten|alter} Mann wohnt hier.","Ich sehe die {neue|neuen|neuer} Wohnung."]},{"title":"Adjektiv nach den/dem","de":"Nach dem/den/der (Dativ) und im Plural: -en.","en":"After dem/den/der (dative) and in the plural: -en.","sents":["Ich kenne den {jungen|junge|junger} Lehrer.","Wir wohnen in dem {großen|große|großes} Haus."]},{"title":"Adjektiv nach ein I","de":"Nach „ein“ zeigt das Adjektiv das Genus: -er (mask.), -es (neutr.).","en":"After \"ein\" the adjective shows the gender: -er (masc.), -es (neut.).","sents":["Das ist ein {guter|gute|guten} Film.","Das ist ein {schönes|schöne|schöner} Auto."]},{"title":"Adjektiv nach ein II","de":"Feminin: -e; Akkusativ maskulin: -en.","en":"Feminine: -e; accusative masculine: -en.","sents":["Ich suche eine {günstige|günstigen|günstiger} Wohnung.","Ich habe einen {neuen|neuer|neue} Job."]},{"title":"Adjektiv nach ein III","de":"Dativ nach ein/eine: immer -en.","en":"Dative after ein/eine: always -en.","sents":["Ich wohne in einer {kleinen|kleine|kleiner} Stadt.","Er fährt mit einem {alten|alte|alter} Auto."]},{"title":"Adjektiv ohne Artikel","de":"Ohne Artikel zeigt das Adjektiv die Endung des Artikels.","en":"Without an article the adjective takes the article's ending.","sents":["Ich trinke gern {kalte|kalten|kalter} Milch.","{Frisches|Frische|Frischen} Brot schmeckt gut."]},{"title":"Adjektiv Plural","de":"Plural mit Artikel: -en; ohne Artikel: -e.","en":"Plural with article: -en; without article: -e.","sents":["Die {neuen|neue|neuer} Kollegen sind nett.","Ich mag {große|großen|großer} Hunde."]},{"title":"Komparativ","de":"Komparativ: Adjektiv + -er, oft mit Umlaut; Vergleich mit „als“.","en":"Comparative: adjective + -er, often with umlaut; comparison with \"als\".","sents":["Berlin ist {größer|großer|mehr groß} als München.","Mein Bruder ist {älter|alter|mehr alt} als ich."]},{"title":"als / wie","de":"Gleichheit: so … wie; Unterschied: Komparativ + als.","en":"Equality: so … wie; difference: comparative + als.","sents":["Sie ist so groß {wie|als|wenn} ihre Mutter.","Er ist größer {als|wie|denn} sein Vater."]},{"title":"Superlativ","de":"Superlativ: der/die/das -ste oder am -sten.","en":"Superlative: der/die/das -ste or am -sten.","sents":["Das ist der {höchste|höchster|hochste} Berg Deutschlands.","Im Sommer ist es am {wärmsten|wärmste|warmsten}."]},{"title":"Unregelmäßige Steigerung","de":"gut – besser – am besten; gern – lieber – am liebsten.","en":"good – better – best; gladly – rather – most of all.","sents":["Ich trinke {lieber|gerner|mehr gern} Tee als Kaffee.","Das ist die {beste|guteste|bessere} Idee."]},{"title":"viel / mehr / meist","de":"viel – mehr – am meisten.","en":"much – more – most.","sents":["Ich habe {mehr|vieler|mehrer} Zeit als du.","Die {meisten|meiste|mehrsten} Leute arbeiten."]},{"title":"Genitiv: Name + s","de":"Bei Namen: + s ohne Apostroph.","en":"With names: + s without apostrophe.","sents":["Das ist {Annas|Anna's|Annas'} Auto.","Wo ist {Peters|des Peter|Peter} Jacke?"]},{"title":"Genitiv: des / der","de":"Genitiv: des + -(e)s (mask./neutr.), der (fem./Pl.).","en":"Genitive: des + -(e)s (masc./neut.), der (fem./pl.).","sents":["Das ist das Auto {des|dem|der} Lehrers.","Die Farbe {der|die|des} Tasche gefällt mir."]},{"title":"von + Dativ statt Genitiv","de":"Gesprochen ersetzt „von + Dativ“ oft den Genitiv.","en":"In speech \"von + dative\" often replaces the genitive.","sents":["Das ist das Fahrrad {von|vom das|aus} meinem Bruder.","Das Haus von {meinen|meine|meiner} Eltern ist alt."]},{"title":"dieser","de":"„dieser“ hat die Endungen von der/die/das.","en":"\"dieser\" takes the endings of der/die/das.","sents":["Ich nehme {diesen|dieser|dieses} Pullover.","Wem gehört {dieses|diesen|dieser} Fahrrad?"]},{"title":"welcher","de":"„welcher“ hat die Endungen von der/die/das.","en":"\"welcher\" takes the endings of der/die/das.","sents":["{Welchen|Welcher|Welches} Film möchtest du sehen?","In {welcher|welche|welchen} Straße wohnst du?"]},{"title":"jeder","de":"„jeder“ hat die Endungen von der/die/das; Zeitangaben im Akkusativ.","en":"\"jeder\" takes der/die/das endings; time expressions are accusative.","sents":["{Jeden|Jeder|Jedes} Morgen trinke ich Kaffee.","{Jedes|Jeder|Jeden} Kind bekommt ein Geschenk."]},{"title":"Akkusativ bei Zeit","de":"Zeitdauer ohne Präposition steht im Akkusativ.","en":"Duration without a preposition is in the accusative.","sents":["Ich bleibe {einen|einem|ein} Monat in Berlin.","Wir arbeiten {den|dem|der} ganzen Tag."]},{"title":"Reflexivpronomen Akk","de":"Reflexiv im Akkusativ: mich, dich, sich, uns, euch, sich.","en":"Reflexive accusative: mich, dich, sich, uns, euch, sich.","sents":["Ich wasche {mich|mir|ich}.","Wir treffen {uns|unser|wir} um acht."]},{"title":"Reflexivpronomen Dativ","de":"Gibt es schon ein Akkusativobjekt, steht das Reflexivpronomen im Dativ.","en":"If there is already an accusative object, the reflexive is dative.","sents":["Ich wasche {mir|mich|ich} die Hände.","Kaufst du {dir|dich|du} ein neues Handy?"]},{"title":"n-Deklination","de":"Manche maskuline Nomen bekommen -n in allen Fällen außer Nominativ.","en":"Some masculine nouns take -n in every case except the nominative.","sents":["Ich frage {den Nachbarn|den Nachbar|dem Nachbar}.","Kennst du {den Studenten|den Student|der Studenten}?"]},{"title":"Herr / Kollege","de":"Herr → Herrn; Kollege → Kollegen (n-Deklination).","en":"Herr → Herrn; Kollege → Kollegen (n-declension).","sents":["Ich spreche mit {Herrn|Herr|Herren} Müller.","Ich helfe {meinem Kollegen|meinem Kollege|meinen Kollege}."]},{"title":"man","de":"„man“ = Leute allgemein; Dativ: einem, Akk: einen.","en":"\"man\" = people in general; dative: einem, accusative: einen.","sents":["Hier darf {man|mann|einer} nicht rauchen.","Das kann man {einem|einen|man} nicht erklären."]},{"title":"Fragewörter wer/wen/wem","de":"Wer (Nom.), wen (Akk.), wem (Dat.), wessen (Gen.).","en":"Who: wer (nom.), wen (acc.), wem (dat.), wessen (gen.).","sents":["{Wen|Wem|Wer} hast du gestern gesehen?","{Wem|Wen|Wer} gehört die Tasche?"]},{"title":"Wechselpräposition + Adjektiv","de":"Nach dem/den: Adjektiv -en.","en":"After dem/den: adjective -en.","sents":["Die Katze schläft auf dem {weichen|weiche|weiches} Sofa.","Ich lege das Buch auf den {kleinen|kleine|kleinem} Tisch."]},{"title":"Wiederholung A2","de":"Kind ist neutral → Dativ: dem; Garten ist maskulin → Akk: einen.","en":"Kind is neuter → dative dem; Garten is masculine → accusative einen.","sents":["Ich gebe {dem|den|der} Kind einen Apfel.","Wir haben {einen|ein|einem} großen Garten."]},{"title":"Relativpronomen Nominativ","de":"Relativpronomen: Genus vom Nomen, Kasus aus dem Nebensatz.","en":"Relative pronoun: gender from the noun, case from the relative clause.","sents":["Der Mann, {der|den|dem} dort steht, ist mein Chef.","Das Kind, {das|dem|der} singt, ist meine Tochter."]},{"title":"Relativpronomen Akkusativ","de":"Ist das Relativpronomen Objekt, steht es im Akkusativ (mask.: den).","en":"If the relative pronoun is the object it is accusative (masc.: den).","sents":["Der Film, {den|der|dem} ich gesehen habe, war gut.","Die Frau, {die|der|den} ich liebe, heißt Eva."]},{"title":"Relativpronomen Dativ","de":"Dativ: dem (m/n), der (f), denen (Pl).","en":"Dative: dem (m/n), der (f), denen (pl).","sents":["Der Freund, {dem|den|der} ich helfe, heißt Tom.","Die Kollegin, {der|die|dem} ich das Buch gebe, ist neu."]},{"title":"Relativpronomen Plural Dativ","de":"Dativ Plural des Relativpronomens: denen.","en":"Dative plural relative pronoun: denen.","sents":["Die Leute, {denen|den|die} ich helfe, sind nett.","Die Kinder, mit {denen|den|die} ich spiele, sind laut."]},{"title":"Relativpronomen Genitiv","de":"Genitiv: dessen (m/n), deren (f/Pl).","en":"Genitive: dessen (m/n), deren (f/pl): whose.","sents":["Der Mann, {dessen|deren|dem} Auto rot ist, wohnt hier.","Die Frau, {deren|dessen|der} Sohn krank ist, bleibt zu Hause."]},{"title":"Relativsatz mit Präposition","de":"Präposition steht vor dem Relativpronomen und bestimmt den Kasus.","en":"The preposition comes before the relative pronoun and decides the case.","sents":["Das ist die Firma, {bei der|bei die|der bei} ich arbeite.","Der Stuhl, {auf dem|auf den|dem auf} du sitzt, ist alt."]},{"title":"wo / was als Relativpronomen","de":"Nach alles/nichts/etwas: was. Bei Orten: wo.","en":"After alles/nichts/etwas: was. For places: wo.","sents":["Das ist alles, {was|das|wo} ich weiß.","Berlin ist die Stadt, {wo|was|wer} ich geboren bin."]},{"title":"Adjektivdeklination: Genitiv","de":"Im Genitiv nach Artikel: immer -en.","en":"In the genitive after an article: always -en.","sents":["Das ist das Haus des {reichen|reiche|reichem} Mannes.","Trotz des {schlechten|schlechte|schlechtes} Wetters gehen wir raus."]},{"title":"Adjektiv ohne Artikel Dativ","de":"Ohne Artikel im Dativ mask./neutr.: -em.","en":"Without article, dative masc./neut.: -em.","sents":["Mit {großem|großen|großer} Interesse lese ich den Text.","Bei {schönem|schönen|schöner} Wetter grillen wir."]},{"title":"Adjektiv ohne Artikel Genitiv","de":"Ohne Artikel Genitiv mask./neutr.: -en (weil das Nomen schon -s hat).","en":"Without article, genitive masc./neut.: -en (the noun already shows -s).","sents":["Wegen {starken|starkes|starker} Regens fiel das Spiel aus.","Trotz {großer|großen|großes} Probleme blieb er ruhig."]},{"title":"Partizip als Adjektiv","de":"Partizipien als Adjektiv bekommen normale Endungen.","en":"Participles used as adjectives take normal endings.","sents":["Das ist ein {spannendes|spannender|spannenden} Buch.","Die {reparierte|repariert|reparierten} Uhr geht wieder."]},{"title":"Adjektiv als Nomen","de":"Nominalisierte Adjektive werden wie Adjektive dekliniert.","en":"Adjectival nouns are declined like adjectives.","sents":["Der {Kranke|Krank|Kranken} liegt im Bett.","Ich habe einen {Bekannten|Bekannte|Bekannter} getroffen."]},{"title":"der Deutsche / ein Deutscher","de":"ein Deutscher, der Deutsche, die Deutschen.","en":"ein Deutscher, der Deutsche, die Deutschen (adjectival noun).","sents":["Er ist {Deutscher|Deutsch|Deutsche}.","Die {Deutschen|Deutsche|Deutscher} trinken viel Kaffee."]},{"title":"alle / beide","de":"„alle“/„beide“ + Plural; danach Adjektiv -en.","en":"\"alle\"/\"beide\" + plural; following adjective -en.","sents":["{Alle|Alles|Allen} Kinder sind da.","Ich kenne {beide|beiden|beider} Schwestern."]},{"title":"viele / einige + Adjektiv","de":"Nach viele, einige, mehrere: Adjektiv wie ohne Artikel (-e).","en":"After viele, einige, mehrere: adjective as without article (-e).","sents":["Es gibt viele {gute|guten|guter} Restaurants.","Ich habe einige {neue|neuen|neuer} Freunde."]},{"title":"etwas / nichts + Adjektiv","de":"etwas/nichts + Adjektiv-es; alles + Adjektiv-e.","en":"etwas/nichts + adjective -es; alles + adjective -e.","sents":["Ich wünsche dir alles {Gute|Gutes|Guten}!","Gibt es etwas {Neues|Neue|Neuen}?"]},{"title":"derselbe","de":"derselbe: beide Teile werden dekliniert (der + selbe).","en":"derselbe: both parts decline (der + selbe).","sents":["Wir wohnen in {derselben|dieselbe|demselben} Straße.","Er trägt {denselben|derselbe|demselben} Pullover wie gestern."]},{"title":"solcher / so ein","de":"„so ein“ wie „ein“; „solche“ wie „die“.","en":"\"so ein\" like \"ein\"; \"solche\" like \"die\".","sents":["Ich möchte auch {so einen|so ein|so einem} Hund.","{Solche|Solchen|Solcher} Probleme kenne ich."]},{"title":"Possessiv + Adjektiv","de":"Nach mein/dein (wie ein): Nom. mask. -er; Plural -en.","en":"After mein/dein (like ein): nom. masc. -er; plural -en.","sents":["Das ist mein {bester|beste|besten} Freund.","Ich treffe meine {alten|alte|alter} Freunde."]},{"title":"Dativ-Adjektive","de":"Einige Adjektive brauchen Dativ: dankbar, egal, ähnlich, bekannt.","en":"Some adjectives need the dative: dankbar, egal, ähnlich, bekannt.","sents":["Ich bin {dir|dich|du} dankbar.","Das ist {mir|mich|ich} egal."]},{"title":"ähnlich / bekannt","de":"ähnlich, bekannt + Dativ.","en":"ähnlich, bekannt + dative.","sents":["Er sieht {seinem|seinen|sein} Vater ähnlich.","Der Name ist {mir|mich|meiner} bekannt."]},{"title":"Genitiv-Attribut","de":"Genitiv als Attribut: wessen?","en":"Genitive as attribute: whose?","sents":["Das Ende {des|dem|der} Films war traurig.","Die Meinung {der|des|den} Experten ist klar."]},{"title":"Deklination: Kurz-Test I","de":"bei + Dativ (fem.: seiner); Rock ist maskulin → Akk einen.","en":"bei + dative (fem.: seiner); Rock is masculine → accusative einen.","sents":["Er wohnt bei {seiner|seine|seinen} Tante.","Sie hat {einen|ein|einem} roten Rock gekauft."]},{"title":"Deklination: Kurz-Test II","de":"mit + Dativ → dem; Drucker maskulin → Akk einen.","en":"mit + dative → dem; Drucker masculine → accusative einen.","sents":["Ich habe mit {dem|den|der} neuen Chef gesprochen.","Wir brauchen {einen|eine|ein} neuen Drucker."]},{"title":"Deklination: Kurz-Test III","de":"Genitiv Plural: der; danken + Dativ: euch.","en":"Genitive plural: der; danken + dative: euch.","sents":["Die Kinder {der|den|des} Nachbarn spielen laut.","Ich danke {euch|eure|euer} allen."]},{"title":"Pronomen: es","de":"„es“ als Subjekt ohne Bedeutung (Wetter, Zeit).","en":"\"es\" as a dummy subject (weather, time).","sents":["{Es|Das|Er} regnet seit Stunden.","Wie spät ist {es|das|er}?"]},{"title":"Pronomen: einer/keiner","de":"Indefinitpronomen: einer, eine, eins (Akk.: einen, eine, eins).","en":"Indefinite pronoun: einer, eine, eins (acc.: einen, eine, eins).","sents":["Hast du einen Stift? – Ja, ich habe {einen|eins|einer}.","Ich habe kein Auto. Hast du {eins|ein|einen}?"]},{"title":"Pronomen: welche","de":"„welche“ ersetzt Nomen im Plural oder ohne Artikel.","en":"\"welche\" replaces plural nouns or uncountables: some.","sents":["Ich brauche Eier. Hast du {welche|welcher|einige von}?","Möchtest du Kekse? Ich habe {welche|eins|einen} gekauft."]},{"title":"Possessivpronomen","de":"Ohne Nomen: meiner, meine, meins.","en":"Without a noun: meiner, meine, meins (mine).","sents":["Ist das dein Schlüssel? – Ja, das ist {meiner|mein|meinen}.","Das ist nicht mein Handy, sondern {deins|dein|deiner}."]},{"title":"Wiederholung Relativsätze","de":"Akkusativ neutral: das; mit + Dativ Plural: denen.","en":"Accusative neuter: das; mit + dative plural: denen.","sents":["Das Buch, {das|dem|den} du mir gegeben hast, ist toll.","Die Freunde, mit {denen|den|die} ich wohne, sind Studenten."]},{"title":"Wiederholung Adjektive","de":"Akk. maskulin -en; Dativ Plural ohne Artikel -en.","en":"Accusative masc. -en; dative plural without article -en.","sents":["Ich wünsche dir einen {schönen|schöne|schöner} Tag!","Mit {freundlichen|freundliche|freundlicher} Grüßen"]},{"title":"Briefschluss & Anrede","de":"Nominativ ohne Artikel: geehrter Herr, geehrte Frau.","en":"Nominative without article: geehrter Herr, geehrte Frau.","sents":["Sehr {geehrter|geehrte|geehrten} Herr Meier,","Sehr {geehrte|geehrter|geehrten} Frau Kaya,"]},{"title":"irgend-","de":"irgend- = unbestimmt: irgendwas, irgendjemand, irgendwo.","en":"irgend- = some...: something, someone, somewhere.","sents":["Hast du {irgendwas|irgendwer|irgendwo} gehört?","{Irgendjemand|Irgendwas|Irgendwann} hat angerufen."]},{"title":"Akkusativ-Präpositionen + Adjektiv","de":"Nach für/ohne: Akkusativ-Endungen.","en":"After für/ohne: accusative endings.","sents":["Das ist für {meinen|meinem|mein} kleinen Bruder.","Er ging ohne {warme|warmen|warmer} Jacke."]},{"title":"Dativ-Präpositionen + Adjektiv","de":"Ohne Artikel Dativ: fem. -er, mask./neutr. -em.","en":"Without article dative: fem. -er, masc./neut. -em.","sents":["Seit {letzter|letzten|letzte} Woche bin ich krank.","Nach {langem|langen|langer} Warten kam der Bus."]},{"title":"Genitiv-Präpositionen + Adjektiv","de":"Genitiv: des …-en …-es; der …-en.","en":"Genitive: des …-en …-es; der …-en.","sents":["Wegen {des|dem|den} starken Windes bleiben wir hier.","Während {der|die|den} langen Fahrt habe ich gelesen."]},{"title":"Ordinalzahlen","de":"Ordinalzahlen werden wie Adjektive dekliniert.","en":"Ordinal numbers decline like adjectives.","sents":["Heute ist der {dritte|dreite|dritter} Mai.","Ich wohne im {zweiten|zweite|zweitem} Stock."]},{"title":"Datum","de":"am + Ordinalzahl + -en; Datum im Brief: den 5.","en":"am + ordinal + -en; date in a letter: den 5.","sents":["Ich habe am {zwölften|zwölfte|zwölf} Juli Geburtstag.","Berlin, den {5.|5|fünf} März 2026"]},{"title":"Mengenangaben","de":"Nach Mengen kein Genitiv: ein Kilo Tomaten, eine Tasse Kaffee.","en":"After quantities no genitive: a kilo of tomatoes.","sents":["Ich kaufe ein Kilo {Tomaten|der Tomaten|Tomate}.","Ich hätte gern eine Tasse {Kaffee|Kaffees|des Kaffees}."]},{"title":"Apposition","de":"Die Apposition steht im gleichen Kasus wie das Bezugswort.","en":"The apposition takes the same case as the noun it refers to.","sents":["Ich treffe Herrn Klein, {meinen|mein|meinem} Lehrer.","Das ist ein Geschenk von Anna, {meiner|meine|meinen} Schwester."]},{"title":"Kasus nach als","de":"Nach „als“ (Rolle) oft ohne Artikel.","en":"After \"als\" (role) usually no article.","sents":["Ich arbeite als {Koch|einen Koch|einem Koch}.","Als {Kind|ein Kind|einem Kind} war ich oft krank."]},{"title":"Deklination: Kurz-Test IV","de":"Genitiv Plural ohne Artikel: vieler; Dativ Plural: -en.","en":"Genitive plural without article: vieler; dative plural: -en.","sents":["Das ist die Meinung {vieler|vielen|viele} Menschen.","Er hilft {älteren|ältere|älterer} Leuten."]},{"title":"Deklination: Kurz-Test V","de":"Genitiv fem.: deren; vertrauen + Dativ.","en":"Genitive fem.: deren; vertrauen + dative.","sents":["Die Frau, {deren|dessen|die} Tochter Ärztin ist, wohnt nebenan.","Ich vertraue {meinem|meinen|mein} besten Freund."]},{"title":"Deklination: Kurz-Test VI","de":"über + Akk (Thema); in + Dativ (Zeit).","en":"über + acc (topic); in + dative (time).","sents":["Wir sprechen über {den|dem|der} nächsten Urlaub.","In {diesem|diesen|dieses} Jahr bleiben wir hier."]},{"title":"Partizip I als Adjektiv","de":"Partizip I (Infinitiv + d) = gleichzeitig, aktiv.","en":"Present participle (infinitive + d) = simultaneous, active.","sents":["Das ist ein {wachsendes|wachsende|gewachsenes} Problem.","Wir suchen {lachende|lachenden|lachender} Kinder für ein Foto."]},{"title":"Partizip II als Adjektiv","de":"Partizip II = abgeschlossen oder passiv.","en":"Past participle = completed or passive.","sents":["Das {gekochte|kochende|gekochten} Ei liegt auf dem Teller.","Wir haben die {geplante|planende|geplant} Reise abgesagt."]},{"title":"Erweitertes Partizipialattribut","de":"B2: Ein Partizip mit Ergänzungen steht vor dem Nomen.","en":"B2: a participle with extra information stands before the noun.","sents":["Der {seit Jahren leerstehende|leerstehend seit Jahren|seit Jahren leerstehenden} Laden wird renoviert.","Die {von vielen Menschen besuchte|besuchte von vielen Menschen|von vielen Menschen besuchten} Ausstellung endet morgen."]},{"title":"Partizipialattribut auflösen","de":"B2: Partizipialattribute lassen sich als Relativsatz umformen.","en":"B2: participial attributes can be rewritten as relative clauses.","sents":["Der im Mai gebaute Turm = der Turm, {der im Mai gebaut wurde|den im Mai gebaut hat|der im Mai baute}.","Die steigenden Preise = die Preise, {die steigen|die gestiegen werden|denen steigen}."]},{"title":"Genitiv in Fachsprache","de":"B2: Nominalstil braucht viele Genitive.","en":"B2: nominal style uses many genitives.","sents":["Die Erhöhung {der|die|den} Steuern wurde beschlossen.","Die Lösung {des|dem|der} Problems ist schwierig."]},{"title":"Nominalisierung","de":"B2: Nebensätze werden zu Präposition + Nomen.","en":"B2: clauses become preposition + noun.","sents":["Wenn man pünktlich ankommt → bei {pünktlicher Ankunft|pünktlichen Ankunft|pünktliche Ankunft}","Weil es regnet → wegen {des Regens|dem Regen|der Regen}"]},{"title":"Kasus bei Verben B2 I","de":"B2: Einige Verben verlangen Genitiv (beschuldigen, gedenken).","en":"B2: some verbs take the genitive (accuse of, commemorate).","sents":["Er wurde {des|dem|den} Diebstahls beschuldigt.","Wir gedenken {der|den|die} Opfer."]},{"title":"Kasus bei Verben B2 II","de":"B2: bedürfen, sich vergewissern, versichern + Genitiv (gehoben).","en":"B2: bedürfen, versichern + genitive (formal).","sents":["Das Kind bedarf {besonderer|besondere|besonderen} Pflege.","Wir versichern Sie {unserer|unsere|unseren} Unterstützung."]},{"title":"Adjektiv + Genitiv","de":"B2: sich bewusst + Gen.; gewachsen + Dativ.","en":"B2: bewusst + genitive; gewachsen (up to) + dative.","sents":["Er ist sich {seines|seinem|seinen} Fehlers bewusst.","Sie ist {der|die|den} Aufgabe nicht gewachsen."]},{"title":"Relativpronomen: welch-","de":"B2: „welcher“ als Relativpronomen (schriftlich, selten).","en":"B2: \"welcher\" as a relative pronoun (written, rare).","sents":["Das Hotel, in {welchem|welchen|welches} wir wohnten, war teuer.","Die Regel, {welche|welcher|welchen} hier gilt, ist neu."]},{"title":"Relativsatz mit wer","de":"B2: „wer … (der)“ = jede Person, die.","en":"B2: \"wer … (der)\" = whoever.","sents":["{Wer|Der|Wen} zu spät kommt, muss warten.","{Wem|Wer|Wen} das nicht gefällt, der kann gehen."]},{"title":"Kasus-Mix B2 I","de":"angesichts + Genitiv; sich unterziehen + Dativ.","en":"angesichts + genitive; undergo (sich unterziehen) + dative.","sents":["Angesichts {der|die|den} steigenden Mieten ziehen viele aufs Land.","Er hat sich {einer|eine|einen} schweren Operation unterzogen."]},{"title":"Kasus-Mix B2 II","de":"Genitiv-Attribut; sich widmen + Dativ.","en":"Genitive attribute; devote oneself (sich widmen) + dative.","sents":["Die Kosten {des|dem|den} geplanten Neubaus sind hoch.","Sie widmet sich {ihrer|ihre|ihren} Forschung."]},{"title":"Funktionsverbgefüge","de":"B2: Nomen-Verb-Verbindungen haben feste Präpositionen und Verben.","en":"B2: noun-verb combinations have fixed prepositions and verbs.","sents":["Das Gesetz tritt {in|zur|auf} Kraft.","Wir müssen eine Entscheidung {treffen|machen|tun}."]},{"title":"Kasus-Mix B2 III","de":"B2: mächtig + Genitiv (gehoben); ungeachtet + Genitiv.","en":"B2: mächtig (in command of) + genitive; ungeachtet + genitive.","sents":["Er ist {des|dem|den} Englischen mächtig.","Ungeachtet {aller|allen|alle} Bedenken wurde gebaut."]},{"title":"Kasus-Mix B2 IV","de":"B2: Genitiv Plural; „jeglich-“ wie „dieser“.","en":"B2: genitive plural; \"jeglich-\" (any) declines like \"dieser\".","sents":["Die Zahl {der|den|die} Teilnehmenden ist gestiegen.","Er hat {jeglichen|jeglicher|jegliches} Kontakt abgebrochen."]}]},{"id":"verben","name":"Verben","en":"Verbs","kind":"gap","levels":[{"title":"Präsens: regelmäßig","de":"Endungen: ich -e, du -st, er -t, wir -en, ihr -t, sie -en; nach -t/-d: -et/-est.","en":"Endings: -e, -st, -t, -en, -t, -en; after -t/-d add -e-.","sents":["Du {wohnst|wohnt|wohnen} in Berlin.","Ihr {arbeitet|arbeitest|arbeiten} viel."]},{"title":"Präsens: e → i","de":"Bei manchen Verben: e → i(e) bei du und er/sie/es.","en":"Some verbs change e → i(e) for du and er/sie/es.","sents":["Er {spricht|sprecht|sprichst} drei Sprachen.","{Nimmst|Nehmst|Nimmt} du Milch?"]},{"title":"Präsens: a → ä","de":"Bei manchen Verben: a → ä bei du und er/sie/es.","en":"Some verbs change a → ä for du and er/sie/es.","sents":["Sie {fährt|fahrt|fährst} mit dem Zug.","{Schläfst|Schlafst|Schläft} du schon?"]},{"title":"sein und haben","de":"sein: bin, bist, ist, sind, seid, sind. haben: habe, hast, hat …","en":"sein and haben are irregular.","sents":["Wir {sind|seid|haben} müde.","{Hast|Habst|Bist} du Zeit?"]},{"title":"Modalverb können","de":"können: ich kann, du kannst, er kann; Infinitiv am Ende.","en":"können: ich kann, du kannst, er kann; infinitive at the end.","sents":["{Kannst|Könnst|Kann} du mir helfen?","Ich {kann|könne|kannst} gut schwimmen."]},{"title":"Modalverb müssen / wollen","de":"ich/er muss, ich/er will – ohne Endung.","en":"ich/er muss, will – no ending in 1st/3rd person singular.","sents":["Er {muss|müsst|musst} heute arbeiten.","Wir {wollen|willen|wollt} ins Kino gehen."]},{"title":"Modalverb dürfen / sollen","de":"dürfen = Erlaubnis; sollen = Auftrag/Rat von anderen.","en":"dürfen = permission; sollen = instruction/advice from others.","sents":["Hier {darf|dürft|darfst} man nicht parken.","Du {sollst|sollt|soll} mehr Wasser trinken."]},{"title":"möchte","de":"„möchte“ = höflicher Wunsch: ich möchte, du möchtest.","en":"\"möchte\" = polite wish: I would like.","sents":["Ich {möchte|möchten|mag} einen Kaffee.","Was {möchtest|möchtet|möchte} du essen?"]},{"title":"Trennbare Verben","de":"Trennbare Präfixe stehen am Satzende.","en":"Separable prefixes go to the end of the clause.","sents":["Der Zug {fährt um 8 Uhr ab|abfährt um 8 Uhr|fährt ab um 8 Uhr}.","Ich {rufe dich morgen an|anrufe dich morgen|rufe an dich morgen}."]},{"title":"Trennbar oder nicht?","de":"be-, ver-, er-, ent-, zer-, ge-, miss- sind untrennbar.","en":"be-, ver-, er-, ent-, zer-, ge-, miss- are inseparable.","sents":["Ich {verstehe|stehe ver|verstehen} dich nicht.","Wann {stehst du auf|aufstehst du|stehst auf du}?"]},{"title":"Imperativ du","de":"Imperativ du: Verbstamm ohne -st; e→i bleibt.","en":"du-imperative: stem without -st; e→i change stays.","sents":["{Komm|Kommst|Komme du} bitte her!","{Gib|Gebe|Gibst} mir das Salz!"]},{"title":"Imperativ Sie / ihr","de":"Sie: Verb + Sie; ihr: wie Präsens ohne „ihr“. sein: sei, seid, seien Sie.","en":"Sie: verb + Sie; ihr: present form without \"ihr\".","sents":["{Kommen Sie|Sie kommen|Kommt Sie} bitte herein!","Kinder, {seid|seien|sind} leise!"]},{"title":"Perfekt mit haben","de":"Perfekt: haben/sein + Partizip II am Ende.","en":"Perfect tense: haben/sein + past participle at the end.","sents":["Ich {habe|bin|hat} gestern Pizza gegessen.","Wir haben lange {geschlafen|geschlaft|schliefen}."]},{"title":"Perfekt mit sein","de":"sein bei Bewegung (A→B) und Zustandsänderung.","en":"sein for movement (A→B) and change of state.","sents":["Ich {bin|habe|ist} nach Berlin gefahren.","Er {ist|hat|sind} spät aufgestanden."]},{"title":"Partizip II regelmäßig","de":"Regelmäßig: ge- + Stamm + -t.","en":"Regular: ge- + stem + -t.","sents":["Ich habe ein Buch {gekauft|gekaufen|kaufte}.","Wir haben Fußball {gespielt|gespielen|spielten}."]},{"title":"Partizip II unregelmäßig","de":"Unregelmäßig: ge- + (oft neuer Vokal) + -en.","en":"Irregular: ge- + (often new vowel) + -en.","sents":["Ich habe einen Brief {geschrieben|geschreibt|schriebt}.","Hast du den Film {gesehen|gesiehen|gesaht}?"]},{"title":"Partizip II trennbar","de":"Trennbar: Präfix + ge + Stamm.","en":"Separable: prefix + ge + stem.","sents":["Ich habe dich {angerufen|geanrufen|anrufen}.","Der Zug ist schon {abgefahren|geabfahren|abfahrt}."]},{"title":"Partizip II ohne ge-","de":"Kein ge- bei untrennbaren Präfixen und bei -ieren.","en":"No ge- with inseparable prefixes and -ieren verbs.","sents":["Ich habe das nicht {verstanden|geverstanden|verstehen}.","Er hat in Rom {studiert|gestudiert|studieren}."]},{"title":"Präteritum sein / haben","de":"Präteritum: war, hatte – auch im Gespräch üblich.","en":"Simple past war, hatte – common in speech too.","sents":["Gestern {war|ist|wäre} ich krank.","Wir {hatten|hätten|habten} keine Zeit."]},{"title":"Präteritum Modalverben","de":"Modalverben im Präteritum: ohne Umlaut: konnte, musste, durfte.","en":"Modal verbs in simple past: no umlaut: konnte, musste.","sents":["Ich {musste|müsste|muss} lange warten.","Als Kind {konnte|könnte|kannte} ich nicht schwimmen."]},{"title":"Reflexive Verben","de":"Reflexivpronomen: mich, dich, sich, uns, euch, sich.","en":"Reflexive pronouns: mich, dich, sich, uns, euch, sich.","sents":["Ich {freue mich|freue mir|freue} auf das Wochenende.","Er {zieht sich|zieht ihm|zieht} schnell an."]},{"title":"werden","de":"„werden“ = Veränderung: ich werde, du wirst, er wird.","en":"\"werden\" = to become: ich werde, du wirst, er wird.","sents":["Ich {werde|wird|wirst} Arzt.","Es {wird|werdet|werde} kalt."]},{"title":"Futur I","de":"Futur: werden + Infinitiv am Ende.","en":"Future: werden + infinitive at the end.","sents":["Morgen {wird|ist|werdet} es regnen.","Ich werde dich {anrufen|angerufen|rufe an}."]},{"title":"wissen / kennen","de":"wissen = Information; kennen = Person/Ort/Sache.","en":"wissen = know a fact; kennen = be familiar with.","sents":["{Weißt|Kennst|Wisst} du, wo der Bahnhof ist?","{Kennst|Weißt|Kannst} du meinen Bruder?"]},{"title":"legen / liegen","de":"legen (Aktion, + Akk); liegen (Zustand).","en":"legen (put, action); liegen (lie, state).","sents":["Ich {lege|liege|lieg} das Handy auf den Tisch.","Das Handy {liegt|legt|lagt} auf dem Tisch."]},{"title":"stellen / stehen","de":"stellen (Aktion); stehen (Zustand).","en":"stellen (put upright); stehen (stand).","sents":["Ich {stelle|stehe|stelle mich} die Vase auf den Tisch.","Die Vase {steht|stellt|ständ} auf dem Tisch."]},{"title":"Verben mit Dativ","de":"helfen, schmecken, gefallen, danken + Dativ.","en":"helfen, schmecken, gefallen, danken + dative.","sents":["Kannst du {mir|mich|ich} helfen?","Das Essen schmeckt {ihm|ihn|er} nicht."]},{"title":"gern / lieber","de":"gern + Verb = mögen; lieber = Vorliebe.","en":"gern + verb = like doing; lieber = prefer.","sents":["Ich {spiele gern|gern spiele|spiele gerne zu} Gitarre.","Ich trinke {lieber|gerner|mehr gern} Tee."]},{"title":"Perfekt Modalverben","de":"Mit Infinitiv: Ersatzinfinitiv; ohne: gekonnt/gewollt.","en":"With another infinitive: double infinitive; alone: gekonnt/gewollt.","sents":["Ich habe nicht kommen {können|gekonnt|konnte}.","Er hat das {gewollt|wollen|wollte}."]},{"title":"Perfekt: sein / bleiben","de":"sein und bleiben bilden das Perfekt mit sein.","en":"sein and bleiben form the perfect with sein.","sents":["Ich {bin|habe|war} zu Hause geblieben.","Wo {bist|hast|warst} du gewesen?"]},{"title":"Perfekt: Wiederholung","de":"öffnen (+Akk) → haben; einschlafen (Zustandsänderung) → sein.","en":"öffnen → haben; einschlafen (change of state) → sein.","sents":["Er {hat|ist|wird} das Fenster geöffnet.","Sie {ist|hat|wurde} schnell eingeschlafen."]},{"title":"Präteritum regelmäßig","de":"Präteritum regelmäßig: Stamm + -te.","en":"Regular simple past: stem + -te.","sents":["Früher {wohnte|wohnt|wohnten} er in Paris.","Wir {spielten|spielen|spieltet} jeden Tag draußen."]},{"title":"Präteritum unregelmäßig","de":"Unregelmäßig: neuer Vokal, 1./3. Person ohne Endung.","en":"Irregular: vowel change, no ending in 1st/3rd person.","sents":["Er {ging|gang|gehte} nach Hause.","Sie {kam|kommte|kamm} zu spät."]},{"title":"lassen","de":"lassen + Infinitiv = von jemand anderem machen lassen.","en":"lassen + infinitive = have something done.","sents":["Ich {lasse|lässt|lass} mein Auto reparieren.","{Lass|Lässt|Lasse} mich in Ruhe!"]},{"title":"brauchen … zu","de":"„nicht/nur brauchen + zu + Infinitiv“ = nicht müssen / nur müssen.","en":"\"brauchen nicht zu\" = don't need to.","sents":["Du {brauchst nicht zu|musst nicht zu|brauchst nicht} kommen.","Sie braucht {nur zu|nur|zu nur} anrufen."]},{"title":"Konjunktiv II: würde","de":"Konjunktiv II: würde + Infinitiv = Wunsch, Höflichkeit.","en":"Subjunctive II: würde + infinitive = wish, politeness.","sents":["Ich {würde|werde|wurde} gern nach Japan reisen.","{Würdest|Wirst|Wurdest} du mir helfen?"]},{"title":"Konjunktiv II: hätte / wäre","de":"hätte, wäre, könnte – ohne würde.","en":"hätte, wäre, könnte – used without würde.","sents":["Ich {hätte|hatte|habe} gern ein Glas Wasser.","Das {wäre|war|ist} schön!"]},{"title":"Konjunktiv II: könnte","de":"könnte = höfliche Bitte oder Vorschlag.","en":"könnte = polite request or suggestion.","sents":["{Könnten|Konnten|Können} Sie das bitte wiederholen?","Du {könntest|konntest|kannst} mal anrufen."]},{"title":"Ratschläge: sollte","de":"sollte = Ratschlag.","en":"sollte = should (advice).","sents":["Du {solltest|sollst|solltet} mehr schlafen.","Sie {sollten|sollen|sollte} zum Arzt gehen."]},{"title":"Wiederholung A2","de":"gehen → sein; helfen → haben.","en":"gehen → sein; helfen → haben.","sents":["Gestern {bin|habe|war} ich ins Kino gegangen.","Er {hat|ist|wird} mir nicht geholfen."]},{"title":"Plusquamperfekt","de":"Plusquamperfekt: hatte/war + Partizip II = vor der Vergangenheit.","en":"Past perfect: hatte/war + participle = before another past event.","sents":["Nachdem ich gegessen {hatte|habe|hätte}, ging ich spazieren.","Er war schon gegangen, als ich {ankam|ankomme|angekommen}."]},{"title":"Passiv Präsens","de":"Passiv: werden + Partizip II.","en":"Passive: werden + past participle.","sents":["Das Haus {wird|ist|werdet} renoviert.","Hier {werden|wird|werdet} Autos repariert."]},{"title":"Passiv Präteritum","de":"Passiv Präteritum: wurde + Partizip II.","en":"Passive simple past: wurde + participle.","sents":["Das Auto {wurde|wird|würde} gestern gestohlen.","Die Briefe {wurden|wurde|würden} verschickt."]},{"title":"Passiv Perfekt","de":"Passiv Perfekt: sein + Partizip II + worden.","en":"Passive perfect: sein + participle + worden.","sents":["Der Täter ist gefunden {worden|geworden|wurde}.","Die Rechnung {ist|hat|wird} bezahlt worden."]},{"title":"Passiv mit Modalverb","de":"Modalverb + Partizip II + werden.","en":"Modal + participle + werden.","sents":["Das Formular muss {ausgefüllt werden|ausfüllen werden|ausgefüllt worden}.","Der Müll {kann|wird|ist} morgen abgeholt werden."]},{"title":"Passiv mit von","de":"von = Person/Täter; durch = Mittel/Ursache.","en":"von = agent (person); durch = means/cause.","sents":["Das Bild wurde {von|durch|mit} Picasso gemalt.","Die Brücke wurde {durch|von|mit} ein Erdbeben zerstört."]},{"title":"Zustandspassiv","de":"sein + Partizip II = Ergebnis/Zustand.","en":"sein + participle = resulting state.","sents":["Die Tür {ist|wird|wurde} geschlossen. (Sie ist zu.)","Der Laden ist schon {geschlossen|schließen|geschlossen worden}."]},{"title":"Konjunktiv II Vergangenheit","de":"hätte/wäre + Partizip II = irreale Vergangenheit.","en":"hätte/wäre + participle = unreal past.","sents":["Wenn ich Zeit gehabt {hätte|habe|hatte}, wäre ich gekommen.","Ich {wäre|hätte|würde} gern mitgefahren."]},{"title":"Irreale Wünsche","de":"Konjunktiv II für irreale Wünsche.","en":"Subjunctive II for unreal wishes.","sents":["Wenn ich doch mehr Zeit {hätte|habe|hatte}!","Ich wünschte, ich {wäre|bin|war} jetzt am Strand."]},{"title":"Verben mit Präp. I","de":"Feste Präpositionen lernen: warten auf, denken an.","en":"Learn the fixed prepositions.","sents":["Ich warte {auf|für|an} den Bus.","Er denkt {an|auf|über} seine Familie."]},{"title":"Verben mit Präp. II","de":"sich interessieren für, träumen von.","en":"interested in, dream of.","sents":["Ich interessiere mich {für|an|über} Kunst.","Sie träumt {von|über|an} einer Weltreise."]},{"title":"Verben mit Präp. III","de":"sprechen über + Akk; telefonieren mit + Dativ.","en":"talk about; phone someone.","sents":["Wir müssen {über|von|an} das Problem sprechen.","Ich habe {mit|bei|zu} ihr telefoniert."]},{"title":"Verben mit Präp. IV","de":"es geht um = Thema; halten von = Meinung.","en":"it's about; think of (opinion).","sents":["Es geht {um|über|von} Geld.","Ich halte nicht viel {von|über|an} der Idee."]},{"title":"Verben mit Präp. V","de":"sich entscheiden für; an der Uni studieren.","en":"decide on; study at university.","sents":["Ich habe mich {für|zu|über} das rote Kleid entschieden.","Sie hat {an|auf|zu} der Uni studiert."]},{"title":"sich + Dativ","de":"sich wünschen, sich vorstellen (= imagine) + Dativ-Reflexiv.","en":"wish for, imagine: reflexive dative.","sents":["Ich {wünsche mir|wünsche mich|wünsche} ein Fahrrad.","Kannst du {dir|dich|du} das vorstellen?"]},{"title":"sich setzen / sitzen","de":"sich setzen (Aktion); sitzen (Zustand).","en":"sich setzen (sit down); sitzen (be sitting).","sents":["Bitte {setzen Sie sich|sitzen Sie sich|setzen Sie}!","Er {sitzt|setzt|sitzt sich} am Fenster."]},{"title":"Verben mit zu-Infinitiv","de":"Bei trennbaren Verben steht zu zwischen Präfix und Stamm.","en":"With separable verbs zu goes between prefix and stem.","sents":["Ich habe vergessen, {dich anzurufen|dich zu anrufen|zu dich anrufen}.","Es ist wichtig, pünktlich {zu sein|sein zu|zu sind}."]},{"title":"anfangen / aufhören zu","de":"anfangen/aufhören + zu + Infinitiv.","en":"start/stop + zu + infinitive.","sents":["Es hat {angefangen zu regnen|angefangen regnen|zu angefangen regnen}.","Hör {auf zu rauchen|auf rauchen|zu aufrauchen}!"]},{"title":"Präteritum: Mischverben","de":"Mischverben: denken – dachte, bringen – brachte, wissen – wusste.","en":"Mixed verbs: dachte, brachte, wusste.","sents":["Ich {dachte|denkte|dacht} an dich.","Er {brachte|bringte|brang} Blumen mit."]},{"title":"Präteritum: wichtige Verben","de":"stehen – stand, finden – fand, sitzen – saß.","en":"stehen – stand, finden – fand, sitzen – saß.","sents":["Sie {stand|stehte|stund} früh auf.","Wir {fanden|findeten|fandten} den Weg nicht."]},{"title":"Präteritum: Erzählung","de":"Geschriebene Texte nutzen das Präteritum.","en":"Written stories use the simple past.","sents":["Es {war|ist|wäre} einmal ein König.","Er {lebte|lebt|gelebt} in einem Schloss."]},{"title":"Futur I: Vermutung","de":"Futur I + wohl = Vermutung über die Gegenwart.","en":"Future I + wohl = assumption about the present.","sents":["Er {wird|würde|wurde} wohl krank sein.","Sie werden jetzt zu Hause {sein|gewesen|ist}."]},{"title":"Modalverben: Bedeutung","de":"nicht müssen = nicht nötig; nicht dürfen = verboten.","en":"nicht müssen = don't have to; nicht dürfen = must not.","sents":["Du {musst nicht|darfst nicht|sollst nicht zu} kommen, wenn du keine Zeit hast.","Hier {darf|muss|kann nicht} man nicht rauchen. Das ist verboten."]},{"title":"mögen / möchten","de":"mögen = allgemein gern; möchte = Wunsch jetzt.","en":"mögen = like in general; möchte = would like now.","sents":["Ich {mag|möchte|mögen} Schokolade. (immer)","Ich {möchte|mag|mochte} jetzt ein Stück. (jetzt)"]},{"title":"werden: drei Funktionen","de":"werden: Vollverb, Passiv, Futur.","en":"werden: become, passive, future.","sents":["Er {wird|ist|würde} Lehrer. (Beruf)","Das Paket {wird|würde|ist} morgen geliefert. (Passiv)"]},{"title":"lassen: Bedeutungen","de":"lassen + Infinitiv; Perfe
