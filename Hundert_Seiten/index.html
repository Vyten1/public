ankkeit}","schön → die {Schönheit|Schönkeit|Schönung}"]},{"title":"Kurzwörter","de":"Gesprochen benutzt man oft Kurzwörter.","en":"In speech, short forms are common.","sents":["das Automobil → das {Auto|Mobil|Autom}","die Universität → die {Uni|Univ|Versi}"]},{"title":"Abkürzungen","de":"Abkürzungen: Anfangsbuchstaben.","en":"Abbreviations: initial letters.","sents":["der Lastkraftwagen → der {Lkw|LkW|Lwk}","der Personenkraftwagen → der {Pkw|PKw|Pwk}"]},{"title":"Wortfamilie fahren","de":"Wortfamilie: fahren, der Fahrer, die Fahrt, das Fahrzeug.","en":"Word family of fahren.","sents":["Wer fährt? → der {Fahrer|Fahrt|Fahrzeug}","Die Reise mit dem Auto → die {Fahrt|Fahrer|Fähre}"]},{"title":"Wortfamilie arbeiten","de":"arbeiten → Arbeit, Arbeiter, arbeitslos, Arbeitsplatz.","en":"Word family of arbeiten.","sents":["Man arbeitet dort → der {Arbeitsplatz|Arbeitsort zeit|Arbeiter platz}","ohne Job → {arbeitslos|arbeitsfrei|unarbeitsam}"]},{"title":"Wortfamilie sprechen","de":"sprechen → Sprache, Gespräch, Aussprache, Sprecher.","en":"Word family of sprechen.","sents":["die Art zu sprechen → die {Aussprache|Absprache|Ansprache}","ein Gespräch zu zweit → das {Gespräch|Sprachen|Sprecher}"]},{"title":"Wortfamilie kaufen","de":"kaufen, verkaufen, einkaufen, der Käufer, der Verkäufer.","en":"Word family of kaufen.","sents":["Er verkauft Dinge → der {Verkäufer|Käufer|Kaufmann zu}","Einkaufen gehen → der {Einkauf|Verkauf|Ankauf}"]},{"title":"Wortfamilie schreiben","de":"schreiben → Schrift, Schreibtisch, Beschreibung.","en":"Word family of schreiben.","sents":["Was man schreibt → die {Schrift|Schreibe|Schreibung}","ein Blatt mit Tisch → der {Schreibtisch|Schrifttisch|Schreibertisch}"]},{"title":"-ieren","de":"Fremdverben auf -ieren: Partizip ohne ge-.","en":"Verbs in -ieren: participle without ge-.","sents":["Er hat in Wien … → {studiert|gestudiert|studieret}","Wir … die Wohnung. → {renovieren|renovierieren|renovaten}"]},{"title":"Wiederholung A2","de":"Fugen-s nach Arbeit; -los = ohne.","en":"Linking -s after Arbeit; -los = without.","sents":["arbeiten + die Zeit = die {Arbeitszeit|Arbeitzeit|Arbeitenzeit}","ohne Fehler = {fehlerlos|fehlervoll|unfehler}"]},{"title":"be-","de":"be- macht Verben transitiv (+ Akkusativ).","en":"be- makes verbs transitive (+ accusative).","sents":["etwas antworten → einen Brief {beantworten|antworten an|verantworten}","auf etwas zahlen → die Rechnung {bezahlen|zahlen an|verzahlen}"]},{"title":"ver-: falsch","de":"ver- + sich = einen Fehler machen.","en":"ver- + sich = to do something wrongly.","sents":["falsch schreiben → sich {verschreiben|beschreiben|abschreiben}","falsch fahren → sich {verfahren|befahren|abfahren}"]},{"title":"ver-: Veränderung","de":"ver- + Komparativ = so machen.","en":"ver- + comparative = make more ….","sents":["besser machen → {verbessern|bebessern|ausbessern zu}","größer machen → {vergrößern|begrößern|zugrößern}"]},{"title":"ent-","de":"ent- = weg, heraus, beginnen.","en":"ent- = away, out, origin.","sents":["etwas wegnehmen → {entfernen|befernen|verfernen}","jemanden aus der Firma schicken → {entlassen|belassen|verlassen}"]},{"title":"er-","de":"er- = Ergebnis erreichen.","en":"er- = achieving a result.","sents":["etwas zu Ende bringen → {erledigen|beledigen|verledigen}","ein Ziel schaffen → {erreichen|bereichen|verreichen}"]},{"title":"zer-","de":"zer- = kaputt machen.","en":"zer- = into pieces.","sents":["in Stücke brechen → {zerbrechen|verbrechen|abbrechen}","in Stücke reißen → {zerreißen|verreißen|bereißen}"]},{"title":"miss-","de":"miss- = falsch, schlecht.","en":"miss- = wrongly (mis-).","sents":["falsch verstehen → {missverstehen|unverstehen|fehlverstehen}","nicht gelingen → {misslingen|unlingen|verlingen}"]},{"title":"-schaft","de":"-schaft = Gruppe oder Beziehung.","en":"-schaft = group or relationship (-ship).","sents":["der Freund → die {Freundschaft|Freundheit|Freundung}","der Mann → die {Mannschaft|Mannheit|Mannung}"]},{"title":"-tum","de":"-tum = Zustand, Gesamtheit.","en":"-tum = state, totality (-dom).","sents":["reich → der {Reichtum|Reichheit|Reichung}","wachsen → das {Wachstum|Wachsheit|Wachsung}"]},{"title":"-nis","de":"-nis bildet Nomen aus Verben.","en":"-nis forms nouns from verbs.","sents":["erleben → das {Erlebnis|Erlebung|Erlebheit}","erlauben → die {Erlaubnis|Erlaubung|Erlaubheit}"]},{"title":"-ei / -erei","de":"-ei/-erei = Ort oder Tätigkeit.","en":"-ei/-erei = place or activity.","sents":["backen → die {Bäckerei|Backung|Bäckheit}","Polizist → die {Polizei|Polizerei|Polizung}"]},{"title":"-ler / -ner","de":"-ler/-ner = Person.","en":"-ler/-ner = person.","sents":["die Kunst → der {Künstler|Kunster|Kunstner}","der Garten → der {Gärtner|Gartener|Gärtler}"]},{"title":"-sam","de":"-sam = mit dieser Eigenschaft.","en":"-sam = having this quality.","sents":["Er spart. → Er ist {sparsam|sparlich|sparbar}.","Er schweigt viel. → Er ist {schweigsam|schweiglich|schweigig}."]},{"title":"-haft","de":"-haft = wie, mit dieser Art.","en":"-haft = like, -ish.","sents":["mit Fehlern → {fehlerhaft|fehlersam|fehlerbar}","das Märchen → {märchenhaft|märchenlich|märchensam}"]},{"title":"-isch","de":"-isch bei Fremdwörtern.","en":"-isch with foreign words (-ic, -ical).","sents":["die Logik → {logisch|logiklich|logikig}","die Praxis → {praktisch|praxislich|praxisig}"]},{"title":"-mäßig","de":"-mäßig = nach, entsprechend.","en":"-mäßig = according to.","sents":["nach der Regel → {regelmäßig|regellich|regelbar}","nach dem Zweck → {zweckmäßig|zwecklich|zweckig}"]},{"title":"-weise","de":"-weise bildet Adverbien.","en":"-weise forms adverbs (-ly, by …).","sents":["zum Glück → {glücklicherweise|glücklichweise|glückweise}","Schritt für Schritt → {schrittweise|schrittlich|schrittig}"]},{"title":"-wert / -würdig","de":"-wert/-würdig = es verdient.","en":"-wert/-würdig = worth (doing).","sents":["Das muss man sehen. → {sehenswert|sehenswürdig ist|sehbar}","Das kann man glauben. → {glaubwürdig|glaubwert|glaubbar}"]},{"title":"-frei","de":"-frei = ohne (oft positiv).","en":"-frei = free of.","sents":["ohne Alkohol → {alkoholfrei|alkohollos|unalkohol}","ohne Steuer → {steuerfrei|steuerlos|unsteuer}"]},{"title":"-arm / -reich","de":"-arm = wenig; -reich = viel.","en":"-arm = low in; -reich = rich in.","sents":["wenig Fett → {fettarm|fettlos|fettfrei arm}","viele Vitamine → {vitaminreich|vitaminvoll|vitaminhaft}"]},{"title":"-fähig","de":"-fähig = kann.","en":"-fähig = able to.","sents":["Er kann arbeiten. → Er ist {arbeitsfähig|arbeitbar|arbeitsam fähig}.","Es kann konkurrieren. → Es ist {konkurrenzfähig|konkurrenzbar|konkurrierlich}."]},{"title":"nicht- / un-","de":"Nomen: Nicht-; Adjektiv: un-.","en":"Nouns: Nicht-; adjectives: un-.","sents":["nicht rauchend → der {Nichtraucher|Unraucher|Kein-Raucher}","nicht bekannt → {unbekannt|nichtbekannt|missbekannt}"]},{"title":"Partizip als Adjektiv","de":"Partizip I = aktiv; Partizip II = passiv/fertig.","en":"Present participle = active; past participle = passive/done.","sents":["ein Ei, das gekocht ist → ein {gekochtes|kochendes|gekocht} Ei","ein Kind, das lacht → ein {lachendes|gelachtes|lachend} Kind"]},{"title":"Nomen aus Adjektiven (Personen)","de":"Adjektive werden Personen-Nomen.","en":"Adjectives become nouns for people.","sents":["eine Person, die krank ist → ein {Kranker|Krankling|Krankheit}","eine Person, die arbeitslos ist → eine {Arbeitslose|Arbeitslosin|Arbeitslosheit}"]},{"title":"Verben aus Nomen","de":"Nomen + -en = Verb.","en":"Noun + -en = verb.","sents":["der Tanz → {tanzen|tanzieren|vertanzen}","das Frühstück → {frühstücken|frühstückieren|befrühstücken}"]},{"title":"Verben aus Adjektiven","de":"Adjektiv + -en = so machen.","en":"Adjective + -en = make (so).","sents":["kurz → {kürzen|kurzen|verkurz}","leer → {leeren|lehren|verleeren}"]},{"title":"-ung vs. -en","de":"Viele Verben bilden ein Nomen auf -ung.","en":"Many verbs form a noun in -ung.","sents":["bewerben → die {Bewerbung|Bewerben|Bewerbheit}","entscheiden → die {Entscheidung|Entscheiden|Entscheidheit}"]},{"title":"Nomen ohne Endung","de":"Verbstamm = maskulines Nomen.","en":"Bare verb stem = masculine noun.","sents":["laufen → der {Lauf|Laufung|Läufheit}","schlafen → der {Schlaf|Schlafung|Schläfheit}"]},{"title":"Gegenteile mit Präfix","de":"Gegenteile oft mit Präfix-Paaren.","en":"Opposites often use prefix pairs.","sents":["der Vorteil ↔ der {Nachteil|Unteil|Gegenteil}","die Einnahme ↔ die {Ausgabe|Ausnahme|Abnahme}"]},{"title":"Wortfamilie Bildung","de":"bilden → Bildung, Ausbildung, Weiterbildung.","en":"Word family of bilden.","sents":["lernen in der Schule → die {Bildung|Bildschaft|Bilderei}","weiter lernen im Beruf → die {Weiterbildung|Fortbilden|Weiterbilderei}"]},{"title":"Wortfamilie stellen","de":"sich vorstellen = präsentieren (oder imagine + Dativ).","en":"sich vorstellen = introduce oneself.","sents":["etwas bemerken, herausfinden → {feststellen|vorstellen|einstellen}","sich beim Interview präsentieren → sich {vorstellen|darstellen|einstellen}"]},{"title":"Wortfamilie nehmen","de":"teilnehmen, abnehmen, zunehmen, übernehmen.","en":"Prefix + nehmen.","sents":["an einem Kurs → {teilnehmen|annehmen|übernehmen}","Gewicht verlieren → {abnehmen|zunehmen|aufnehmen}"]},{"title":"Wortfamilie halten","de":"behalten = keep; erhalten = receive; enthalten = contain.","en":"Prefix + halten.","sents":["eine Regel → sich an etwas {halten|enthalten|behalten}","ein Geheimnis nicht weitersagen → etwas für sich {behalten|erhalten|enthalten}"]},{"title":"Wortfamilie geben","de":"aufgeben = give up; abgeben = hand in; ausgeben = spend.","en":"Prefix + geben.","sents":["aufhören zu versuchen → {aufgeben|abgeben|angeben}","Hausaufgaben dem Lehrer → {abgeben|aufgeben|ausgeben}"]},{"title":"Wortfamilie kommen","de":"vorkommen = happen, occur.","en":"vorkommen = occur.","sents":["am Ziel sein → {ankommen|mitkommen|vorkommen}","ein Ereignis geschieht → etwas {kommt vor|kommt an|kommt mit}"]},{"title":"Wortfamilie setzen","de":"übersetzen = translate; umsetzen = implement.","en":"Prefix + setzen.","sents":["Text in andere Sprache → {übersetzen|umsetzen|absetzen}","einen Plan realisieren → einen Plan {umsetzen|übersetzen|versetzen}"]},{"title":"Wortfamilie schlagen","de":"vorschlagen = suggest; nachschlagen = look up.","en":"Prefix + schlagen.","sents":["eine Idee geben → {vorschlagen|zuschlagen|abschlagen}","in einem Buch suchen → {nachschlagen|aufschlagen|anschlagen}"]},{"title":"Wortfamilie fallen","de":"ausfallen = be cancelled; einfallen = occur to; auffallen = be noticed.","en":"Prefix + fallen.","sents":["etwas nicht stattfinden → {ausfallen|auffallen|einfallen}","eine Idee kommt → mir {fällt etwas ein|fällt etwas aus|fällt etwas auf}"]},{"title":"Komposita mit 3 Teilen","de":"Das letzte Wort bestimmt den Artikel.","en":"The last word decides the article.","sents":["die Haftpflicht + die Versicherung → die {Haftpflichtversicherung|der Haftpflichtversicherung|das Haftpflichtversicherung}","das Kind + der Garten + der Platz → der {Kindergartenplatz|Kindgartenplatz|Kindergartplatz}"]},{"title":"Wiederholung B1 I","de":"-lich/-bar; un- = Gegenteil.","en":"-lich/-bar; un- = opposite.","sents":["Das kann man nicht glauben. → Es ist {unglaublich|unglaubbar|nichtglaublich}.","Das kann man nicht lesen. → Es ist {unleserlich|unlesbarlich|nichtlesbar}."]},{"title":"Wiederholung B1 II","de":"Achtung: kostbar = wertvoll, nicht gratis!","en":"Careful: kostbar = precious, not free!","sents":["Das kostet nichts. → Es ist {kostenlos|kostenvoll|kostbar}.","Das hat viel Wert. → Es ist {wertvoll|wertlos|wertsam}."]},{"title":"Falsche Freunde","de":"bekommen ≠ become; sympathisch = nett, nicht „mitfühlend“.","en":"bekommen ≠ become; sympathisch = likeable, not \"sympathetic\".","sents":["„Ich {bekomme|werde|kriege zu} ein Geschenk.“ (= I get)","„Er ist {sympathisch|sympatisch|sympathetisch}.“ (= likeable)"]},{"title":"Falsche Freunde II","de":"eventuell = vielleicht, nicht „eventually“.","en":"eventuell = possibly, not \"eventually\".","sents":["„Ich {werde|bekomme|kriege} Lehrer.“ (= I become)","Das ist {eventuell|eventual|eventlich} möglich. (= possibly)"]},{"title":"Wiederholung B1 III","de":"Verbstamm + Nomen; manchmal mit -e-.","en":"Verb stem + noun; sometimes with -e-.","sents":["lesen + die Brille = die {Lesebrille|Lesenbrille|Lesbrille}","schwimmen + das Bad = das {Schwimmbad|Schwimmenbad|Schwimmbade}"]},{"title":"Wiederholung B1 IV","de":"Einwohnernamen; Präfixgegensätze.","en":"Inhabitant names; prefix opposites.","sents":["jemand, der aus der Schweiz kommt → ein {Schweizer|Schweizerer|Schweizler}","Gegenteil von zunehmen → {abnehmen|ausnehmen|wegnehmen}"]},{"title":"Falsche Freunde III","de":"aktuell = current; Chef = boss.","en":"aktuell = current (not \"actual\"); Chef = boss (not \"chef\").","sents":["Das Thema ist sehr {aktuell|actual|aktual}. (= current)","Der {Chef|Koch|Kellner} leitet die Firma. (= boss)"]},{"title":"Nominalisierung B2","de":"B2: Nominalstil mit -ung.","en":"B2: nominal style with -ung.","sents":["durchführen → die {Durchführung|Durchführheit|Durchfuhr}","berücksichtigen → die {Berücksichtigung|Berücksichtigheit|Berücksicht}"]},{"title":"Nominalisierung B2 II","de":"B2: -keit nach -lich/-ig.","en":"B2: -keit after -lich/-ig.","sents":["möglich → die {Möglichkeit|Möglichheit|Möglichung}","abhängig → die {Abhängigkeit|Abhängheit|Abhängung}"]},{"title":"Fremdwörter: -ität","de":"B2: Fremdadjektive → -ität.","en":"B2: foreign adjectives → -ität (-ity).","sents":["flexibel → die {Flexibilität|Flexibelheit|Flexibelung}","mobil → die {Mobilität|Mobilheit|Mobilung}"]},{"title":"Fremdwörter: -ismus / -ist","de":"B2: -ismus (Haltung) ↔ -ist (Person).","en":"B2: -ism ↔ -ist.","sents":["der Tourismus → der {Tourist|Tourister|Tourismist}","der Optimismus → der {Optimist|Optimister|Optimer}"]},{"title":"Fremdwörter: -ation","de":"B2: -ieren → -ation.","en":"B2: -ieren → -ation.","sents":["informieren → die {Information|Informierung|Informität}","organisieren → die {Organisation|Organisierung|Organisität}"]},{"title":"Präfix miss- / fehl- B2","de":"B2: Fehl- und Miss- = falsch.","en":"B2: Fehl- and Miss- = wrong.","sents":["falsch entscheiden → die {Fehlentscheidung|Missentscheidung|Unentscheidung}","falsch verstehen → das {Missverständnis|Fehlverständnis|Unverständnis}"]},{"title":"Präfix über- B2","de":"B2: über- = zu viel; unter- = zu wenig.","en":"B2: über- = over-; unter- = under-.","sents":["zu viel arbeiten → sich {überarbeiten|verarbeiten|bearbeiten}","zu hoch bewerten → {überschätzen|unterschätzen|verschätzen}"]},{"title":"Präfix vor- / nach- B2","de":"B2: vor(aus)- = vorher; nach- = später, kontrollierend.","en":"B2: vor- = before; nach- = after, checking.","sents":["vorher planen → {vorausplanen|nachplanen|verplanen}","später prüfen → {nachprüfen|vorprüfen|verprüfen}"]},{"title":"Adjektive: -fähig / -bedürftig B2","de":"B2: -bedürftig = braucht; -fähig = kann.","en":"B2: -bedürftig = in need of; -fähig = capable of.","sents":["braucht Hilfe → {hilfsbedürftig|hilfsfähig|hilfslos bedürft}","kann sich ändern → {wandlungsfähig|wandlungsbedürftig|wandelbarfähig}"]},{"title":"Adjektive: -pflichtig / -berechtigt B2","de":"B2: -pflichtig = muss; -berechtigt = darf.","en":"B2: -pflichtig = obliged; -berechtigt = entitled.","sents":["muss Steuern zahlen → {steuerpflichtig|steuerberechtigt|steuerfähig}","darf wählen → {wahlberechtigt|wahlpflichtig|wahlfähig sein}"]},{"title":"Konversion B2","de":"B2: Adjektiv → neutrales Nomen.","en":"B2: adjective → neuter noun.","sents":["das Gute an der Sache → das {Positive|Positivität|Positivheit}","die Sache, die neu ist → das {Neue|Neuheit an|Neuigkeit das}"]},{"title":"Wortfamilie B2: sicher","de":"B2: sicher, Sicherheit, versichern, sicherstellen.","en":"B2: word family of sicher.","sents":["eine Versicherung abschließen → sich {versichern|besichern|entsichern}","sicher machen → {sicherstellen|sichermachen|versichern stellen}"]},{"title":"Wortfamilie B2: wirken","de":"B2: wirken, Auswirkung, mitwirken, bewirken.","en":"B2: word family of wirken.","sents":["die Folge → die {Auswirkung|Einwirkung|Bewirkung}","aktiv mitmachen → {mitwirken|bewirken|auswirken}"]},{"title":"Wortfamilie B2: ziehen","de":"B2: einbeziehen = involve; erziehen = bring up.","en":"B2: einbeziehen = involve; erziehen = raise.","sents":["jemanden mitnehmen in ein Projekt → jemanden {einbeziehen|beziehen|erziehen}","Kinder großziehen → {erziehen|beziehen|verziehen}"]}]},{"id":"redemittel","name":"Redemittel","en":"Useful phrases","kind":"gap","levels":[{"title":"Begrüßen","de":"Gruß nach Tageszeit; am Telefon nennt man den Namen.","en":"Greet by time of day; on the phone say your name.","sents":["Morgens im Büro: {Guten Morgen!|Gute Nacht!|Mahlzeit, tschüss!}","Formell am Telefon: {Guten Tag, hier spricht Müller.|Hallo, wer ist da, Alter?|Tschüss, Müller hier.}"]},{"title":"Sich vorstellen","de":"ich bin / ich heiße / mein Name ist …","en":"ich bin / ich heiße / mein Name ist …","sents":["Neue Kollegin: {Hallo, ich bin Lena und arbeite im Marketing.|Hallo, ich habe Lena im Marketing.|Hallo, mich heißt Lena.}","Formell: {Darf ich mich vorstellen? Mein Name ist Kaya.|Ich stelle mir vor: Kaya.|Mein Name heißt Kaya.}"]},{"title":"Nach dem Befinden fragen","de":"Wie geht es Ihnen/dir? – Gut, danke. Und Ihnen/dir?","en":"How are you? – Fine, thanks. And you?","sents":["{Wie geht es Ihnen?|Wie gehen Sie?|Wie geht es Sie?}","Antwort: {Danke, gut. Und Ihnen?|Danke, ich bin gut gegangen.|Danke, mir ist gut. Und Sie?}"]},{"title":"Sich verabschieden","de":"Auf Wiederhören nur am Telefon.","en":"Auf Wiederhören is only used on the phone.","sents":["Freunde, abends: {Tschüss, bis morgen!|Auf Wiederhören!|Guten Abend und tschüss Sie!}","Am Telefon, formell: {Auf Wiederhören!|Auf Wiedersehen am Telefon!|Bis bald, Schatz!}"]},{"title":"Bitten und danken","de":"Konjunktiv II macht Bitten höflich. Auf Danke: Bitte / Gern geschehen.","en":"Subjunctive makes requests polite. Reply to thanks: Gern geschehen.","sents":["Höflich bitten: {Könnten Sie mir bitte helfen?|Helfen Sie mir!|Sie helfen mir, bitte?}","Antwort auf „Danke!“: {Gern geschehen!|Bitte sehr, danke!|Kein Danke!}"]},{"title":"Sich entschuldigen","de":"Entschuldigung = Sorry und Excuse me.","en":"Entschuldigung = sorry and excuse me.","sents":["Sie kommen zu spät: {Entschuldigung, ich bin zu spät.|Verzeihung, ich bin späte.|Sorry, ich komme spät gewesen.}","Jemanden ansprechen: {Entschuldigung, wo ist der Bahnhof?|Verzeihen, Bahnhof wo?|Entschuldige mich, Bahnhof?}"]},{"title":"Im Café bestellen","de":"Ich hätte gern … / Ich nehme … / Zahlen, bitte!","en":"I'd like … / I'll take … / The bill, please.","sents":["{Ich hätte gern einen Kaffee.|Ich will Kaffee, schnell.|Ich bekomme Kaffee?}","Zahlen: {Die Rechnung, bitte! / Ich möchte zahlen.|Ich will bezahlen jetzt.|Rechnung geben, bitte!}"]},{"title":"Einkaufen","de":"Ich suche … / Was kostet …?","en":"I'm looking for … / How much is …?","sents":["Verkäuferin: „Kann ich Ihnen helfen?“ → {Ja, ich suche eine Jacke.|Ja, ich helfe Ihnen.|Nein, ich kann.}","Preis fragen: {Was kostet das?|Wie viel kostet es mich?|Was ist der Kosten?}"]},{"title":"Nach dem Weg fragen","de":"Wie komme ich zu …? – Gehen Sie …","en":"How do I get to …? – Go …","sents":["{Entschuldigung, wie komme ich zum Bahnhof?|Wo ist der Weg zum Bahnhof gehen?|Wie gehe ich Bahnhof?}","Antwort: {Gehen Sie geradeaus und dann links.|Gehen Sie gerade und links ab dann.|Sie gehen gerade dann links ist.}"]},{"title":"Termin vereinbaren","de":"einen Termin vereinbaren; Passt es Ihnen …?","en":"make an appointment; does … suit you?","sents":["{Ich möchte gern einen Termin vereinbaren.|Ich will einen Termin machen jetzt.|Ich brauche Termin haben.}","Vorschlag: {Passt es Ihnen am Dienstag um 10 Uhr?|Dienstag ist passend für mich Sie?|Haben Sie Dienstag gepasst?}"]},{"title":"Termin absagen","de":"absagen = cancel; verschieben = postpone.","en":"cancel / postpone.","sents":["{Leider kann ich den Termin nicht wahrnehmen.|Leider kann ich nicht Termin.|Ich komme Termin nicht, sorry.}","{Könnten wir den Termin verschieben?|Können wir den Termin wegschieben?|Termin später machen, ja?}"]},{"title":"Beim Arzt","de":"Ich habe …schmerzen. / Mir ist schlecht (nicht: Ich bin schlecht!).","en":"Mir ist schlecht = I feel sick (Ich bin schlecht = I'm bad).","sents":["Arzt: „Was fehlt Ihnen?“ → {Ich habe seit gestern Kopfschmerzen.|Mir fehlt Kopf.|Ich bin Kopfschmerzen.}","{Mir ist schlecht.|Ich bin schlecht.|Es ist mir schlecht gegangen.} (= I feel sick)"]},{"title":"Telefonieren","de":"Kann ich … sprechen? / eine Nachricht hinterlassen.","en":"Can I speak to …? / leave a message.","sents":["{Kann ich bitte Frau Weber sprechen?|Kann ich Frau Weber reden?|Ist Frau Weber zu sprechen haben?}","{Kann ich eine Nachricht hinterlassen?|Kann ich Nachricht lassen hinter?|Ich lasse Nachricht da?}"]},{"title":"Nicht verstehen","de":"Wie bitte? = höflich nachfragen.","en":"Wie bitte? = Pardon?","sents":["{Können Sie das bitte wiederholen?|Wiederholen Sie!|Noch mal, was?}","{Wie bitte?|Was bitte?|Wie was?}"]},{"title":"Langsamer sprechen","de":"Was bedeutet …? / Wie sagt man … auf Deutsch?","en":"What does … mean?","sents":["{Könnten Sie bitte etwas langsamer sprechen?|Sprechen Sie langsamer mehr!|Sie sprechen zu langsam bitte.}","{Was bedeutet das Wort?|Was meint das Wort?|Wie heißt das Wort bedeuten?}"]},{"title":"Einladen","de":"Hast du Lust, … zu …? – Gern!","en":"Do you fancy …? – I'd love to!","sents":["{Hast du Lust, am Samstag ins Kino zu gehen?|Hast du Lust zu Kino Samstag?|Willst du mit mir Kino?}","Zusagen: {Gern, das ist eine gute Idee!|Gern, ich habe Lust nicht.|Ja, ich bin gerne.}"]},{"title":"Absagen","de":"Tut mir leid, ich kann leider nicht. Vielleicht ein anderes Mal.","en":"Sorry, I can't. Maybe another time.","sents":["{Tut mir leid, am Samstag kann ich leider nicht.|Sorry, Samstag ich nicht kann.|Nein. Keine Zeit, tschüss.}","{Vielleicht ein anderes Mal?|Vielleicht andere Mal gehen?|Andermal vielleicht ist?}"]},{"title":"Gratulieren","de":"Herzlichen Glückwunsch zu …!","en":"Congratulations on …!","sents":["Geburtstag: {Herzlichen Glückwunsch zum Geburtstag!|Herzlich Glück zum Geburtstag!|Gute Geburtstag!}","Prüfung bestanden: {Gratuliere! Das hast du toll gemacht!|Gratuliere dich!|Glück für dich, gut!}"]},{"title":"Wünschen","de":"Viel Glück! / Guten Appetit! / Gute Besserung!","en":"Good luck! / Enjoy your meal!","sents":["Vor einer Prüfung: {Viel Glück!|Gute Glück!|Glück viel!}","Vor dem Essen: {Guten Appetit!|Gutes Essen haben!|Mahlzeit gut!}"]},{"title":"Gute Besserung","de":"Gute Besserung! = Get well soon!","en":"Get well soon!","sents":["Kollege ist krank: {Gute Besserung!|Gutes Besser!|Werde besser!}","{Ich hoffe, es geht dir bald besser.|Ich hoffe, du gehst bald besser.|Ich hoffe, dir besser bald.}"]},{"title":"Meinung (einfach)","de":"Ich finde … / Meiner Meinung nach …","en":"I think … / In my opinion …","sents":["{Ich finde das Buch interessant.|Ich finde das Buch ist interessant.|Ich meine das Buch interessant.}","{Meiner Meinung nach ist das zu teuer.|Nach meiner Meinung nach ist das teuer.|Meine Meinung, das ist teuer ist.}"]},{"title":"Zustimmen","de":"Du hast recht (nicht: Du bist recht).","en":"You're right = Du hast recht.","sents":["{Da hast du recht.|Da hast du richtig.|Du bist recht.}","{Das sehe ich auch so.|Das schaue ich auch so.|Ich sehe auch das.}"]},{"title":"Widersprechen","de":"Das sehe ich anders. / Ich bin nicht deiner Meinung.","en":"I see it differently.","sents":["{Das sehe ich anders.|Ich sehe das andere.|Das ist anders sehen.}","{Da bin ich nicht deiner Meinung.|Ich habe nicht deine Meinung.|Ich bin nicht deine Meinung.}"]},{"title":"Vorschläge machen","de":"Wollen wir …? / Wie wäre es mit …?","en":"Shall we …? / How about …?","sents":["{Wollen wir zusammen kochen?|Wir kochen zusammen wollen?|Wollen kochen wir zusammen?}","{Wie wäre es mit einem Picknick?|Wie ist es mit Picknick wäre?|Was wäre mit Picknick sein?}"]},{"title":"Hilfe anbieten","de":"Kann ich Ihnen helfen? / Soll ich …?","en":"Can I help you? / Shall I …?","sents":["{Kann ich Ihnen helfen?|Kann ich Sie helfen?|Soll ich Ihnen geholfen?}","{Soll ich das Fenster öffnen?|Muss ich das Fenster öffnen für dich?|Darf das Fenster öffnen?}"]},{"title":"Um Erlaubnis bitten","de":"Darf ich …? / Stört es Sie, wenn …?","en":"May I …? / Do you mind if …?","sents":["{Darf ich hier sitzen?|Kann ich hier sitzen dürfen?|Bin ich hier sitzen erlaubt?}","{Stört es Sie, wenn ich das Fenster öffne?|Stört Sie, ich öffne Fenster?|Ist es Sie stören, Fenster?}"]},{"title":"Im Hotel","de":"auf den Namen …; im Preis inbegriffen.","en":"under the name …; included in the price.","sents":["{Ich habe ein Zimmer auf den Namen Schmidt reserviert.|Ich bin reserviert Schmidt.|Ich habe Schmidt Zimmer gebucht auf.}","{Ist das Frühstück im Preis inbegriffen?|Ist Frühstück mit dem Preis?|Kostet Frühstück inklusive dabei?}"]},{"title":"Am Bahnhof","de":"Fahrkarte nach …; Von welchem Gleis …?","en":"ticket to …; Which platform …?","sents":["{Eine Fahrkarte nach Hamburg, bitte.|Ein Ticket zu Hamburg geben.|Ich fahre Hamburg Karte.}","{Von welchem Gleis fährt der Zug ab?|Welche Gleis fährt Zug?|Wo ist Zug Gleis ab?}"]},{"title":"Wohnung mieten","de":"Ist … noch frei? Wie hoch ist/sind …?","en":"Is … still available? How high is …?","sents":["{Ist die Wohnung noch frei?|Ist die Wohnung noch leer frei?|Wohnung ist noch gegeben?}","{Wie hoch sind die Nebenkosten?|Wie viel sind Nebenkosten hoch?|Was kosten die Neben?}"]},{"title":"Kleidung","de":"anprobieren; eine Nummer größer/kleiner.","en":"try on; one size bigger/smaller.","sents":["{Kann ich das anprobieren?|Kann ich das probieren an?|Darf ich anziehen probieren?}","{Haben Sie das eine Nummer größer?|Haben Sie das größer Nummer?|Gibt es großere?}"]},{"title":"Beschweren (einfach)","de":"Höflich: Entschuldigung, … / Könnten Sie …?","en":"Politely: Excuse me, … / Could you …?","sents":["Im Restaurant: {Entschuldigung, die Suppe ist kalt.|Hey, Suppe kalt!|Die Suppe hat Kälte.}","{Könnten Sie mir bitte eine neue bringen?|Bringen Sie neu, schnell!|Sie können neue Suppe?}"]},{"title":"Über Hobbys sprechen","de":"In meiner Freizeit … / Was machst du gern …?","en":"In my free time … / What do you like doing?","sents":["{In meiner Freizeit spiele ich gern Gitarre.|In meiner Freizeit ich spiele gern Gitarre.|Meine Freizeit spielt Gitarre.}","{Was machst du gern in deiner Freizeit?|Was du machst gern Freizeit?|Was ist deine Freizeit machen?}"]},{"title":"Über Vergangenes erzählen","de":"Erzählen im Perfekt; Wie war …?","en":"Narrate in the perfect; How was …?","sents":["{Am Wochenende bin ich nach Köln gefahren.|Am Wochenende ich bin nach Köln gefahren.|Am Wochenende habe ich nach Köln gefahren.}","{Wie war dein Urlaub?|Wie ist dein Urlaub gewesen war?|Wie hast du Urlaub?}"]},{"title":"Pläne","de":"etwas vorhaben = planen.","en":"to have plans.","sents":["{Nächstes Jahr möchte ich nach Kanada reisen.|Nächstes Jahr ich möchte reisen Kanada.|Nächste Jahr möchte nach Kanada.}","{Was hast du am Wochenende vor?|Was machst du vor Wochenende?|Was planst du Wochenende vor?}"]},{"title":"Ratschläge geben","de":"Du solltest … / An deiner Stelle würde ich …","en":"You should … / If I were you, I'd …","sents":["{Du solltest mehr Wasser trinken.|Du sollst mehr Wasser getrunken.|Du würdest Wasser trinken sollen.}","{An deiner Stelle würde ich zum Arzt gehen.|In deiner Stelle ich gehe Arzt.|Auf deiner Stelle würde Arzt gehen.}"]},{"title":"Vorlieben","de":"gern – lieber – am liebsten.","en":"like – prefer – like most.","sents":["{Ich esse lieber Fisch als Fleisch.|Ich esse mehr gern Fisch als Fleisch.|Ich esse lieber Fisch wie Fleisch.}","{Am liebsten trinke ich Tee.|Am meisten gern trinke ich Tee.|Liebsten trinke ich Tee am.}"]},{"title":"Wetter-Smalltalk","de":"Smalltalk mit „oder?“ und „hoffentlich“.","en":"Small talk with \"oder?\" and \"hoffentlich\".","sents":["{Schönes Wetter heute, oder?|Schön Wetter heute ist, ja?|Wetter ist schön heute nicht?}","{Hoffentlich regnet es morgen nicht.|Hoffentlich es regnet nicht morgen.|Ich hoffe nicht Regen morgen.}"]},{"title":"Verstehen sichern","de":"Nachfragen: Habe ich richtig verstanden …? Was meinen Sie damit?","en":"Check understanding.","sents":["{Habe ich Sie richtig verstanden, dass …?|Ich habe Sie richtig verstehen, dass …?|Verstanden ich richtig, dass …?}","{Was meinen Sie damit?|Was meinen Sie davon?|Was ist Sie damit meinen?}"]},{"title":"Bei der Bank","de":"ein Konto eröffnen.","en":"open an account.","sents":["{Ich möchte ein Konto eröffnen.|Ich möchte ein Konto aufmachen öffnen.|Ich will Konto machen.}","{Wie hoch sind die Gebühren?|Wie viel sind die Gebühren hoch?|Was kostet Gebühr?}"]},{"title":"Wiederholung A2","de":"Glückwünsche; höflich nachfragen.","en":"Congratulations; polite questions.","sents":["Kollege hat Geburtstag: {Alles Gute zum Geburtstag!|Alles Gut für Geburtstag!|Viel Geburtstag!}","Sie verstehen nicht: {Können Sie das bitte erklären?|Erklären Sie mir das, schnell!|Ich nicht verstehe das.}"]},{"title":"Meinung äußern (B1)","de":"Ich bin der Meinung, dass … / Ich bin davon überzeugt, dass …","en":"I'm of the opinion that … / I'm convinced that …","sents":["{Ich bin der Meinung, dass wir mehr Radwege brauchen.|Ich bin der Meinung, wir brauchen mehr Radwege brauchen.|Ich habe die Meinung, dass wir brauchen mehr Radwege.}","{Ich bin davon überzeugt, dass …|Ich bin darüber überzeugt, dass …|Ich bin überzeugt davon dass ist …}"]},{"title":"Argumentieren","de":"Dafür/Dagegen spricht, dass … / Ein Vorteil/Nachteil ist, dass …","en":"Pros and cons.","sents":["{Dafür spricht, dass es billiger ist.|Dafür sagt, dass es billiger ist.|Dafür spricht, dass ist es billiger.}","{Ein Nachteil ist, dass man viel Zeit braucht.|Ein Nachteil, man braucht viel Zeit ist.|Nachteil ist, dass braucht man viel Zeit.}"]},{"title":"Beispiele geben","de":"Zum Beispiel + Inversion; ein Beispiel dafür ist …","en":"For example …","sents":["{Zum Beispiel kann man mit dem Rad fahren.|Zum Beispiel man kann mit dem Rad fahren.|Für Beispiel kann man Rad fahren.}","{Ein gutes Beispiel dafür ist Kopenhagen.|Ein gutes Beispiel davon ist Kopenhagen.|Ein gutes Beispiel für das ist Kopenhagen ist.}"]},{"title":"Zusammenfassen","de":"Zusammenfassend lässt sich sagen … / Kurz gesagt …","en":"In summary … / In short …","sents":["{Zusammenfassend lässt sich sagen, dass …|Zusammengefasst kann man sagen lassen …|Zum Zusammenfassen man sagt …}","{Kurz gesagt: Es lohnt sich.|Kurz sagend: Es lohnt sich.|Kurz gesagt: Es lohnt.}"]},{"title":"Formeller Brief: Anfang","de":"Sehr geehrte Damen und Herren / Sehr geehrter Herr … / Sehr geehrte Frau …","en":"Dear Sir or Madam / Dear Mr … / Dear Ms …","sents":["An eine Firma, Name unbekannt: {Sehr geehrte Damen und Herren,|Liebe Damen und Herren,|Hallo Firma,}","{Sehr geehrter Herr Braun,|Sehr geehrte Herr Braun,|Lieber geehrter Herr Braun,}"]},{"title":"Formeller Brief: Schluss","de":"Mit freundlichen Grüßen; Ich freue mich auf Ihre Antwort.","en":"Yours sincerely; I look forward to your reply.","sents":["{Mit freundlichen Grüßen|Mit freundliche Grüße|Liebe Grüße und tschüss}","{Ich freue mich auf Ihre Antwort.|Ich freue mich über Ihre Antwort bald.|Ich warte auf Antwort schnell.}"]},{"title":"Bezug nehmen","de":"sich beziehen auf; danken für.","en":"referring to; thanks for.","sents":["{Ich beziehe mich auf Ihre Anzeige vom 3. Mai.|Ich beziehe mich zu Ihrer Anzeige.|Ich beziehe auf Ihre Anzeige mich.}","{Vielen Dank für Ihre E-Mail.|Vielen Dank zu Ihrer E-Mail.|Danke um Ihre E-Mail.}"]},{"title":"Bewerbung","de":"Hiermit bewerbe ich mich um … / Über eine Einladung … würde ich mich freuen.","en":"Standard application phrases.","sents":["{Hiermit bewerbe ich mich um die Stelle als Krankenpfleger.|Hiermit bewerbe ich mich für die Stelle als Krankenpfleger zu.|Hiermit ich bewerbe mich um die Stelle.}","{Über eine Einladung zu einem Vorstellungsgespräch würde ich mich sehr freuen.|Auf eine Einladung würde ich mich freuen gewesen.|Für eine Einladung freue ich mich sehr würde.}"]},{"title":"Beschwerde (formell)","de":"sich beschweren über; Ich erwarte … / Ich bitte Sie, …","en":"Complain about; I expect …","sents":["{Leider muss ich mich über den Service beschweren.|Leider muss ich mich für den Service beschweren.|Leider ich muss beschweren den Service.}","{Ich erwarte eine baldige Lösung.|Ich warte auf eine bald Lösung.|Ich erwarte eine baldig Lösung.}"]},{"title":"Reklamation","de":"Gerät reklamieren: beschreiben + Forderung.","en":"Return a product: describe + request.","sents":["{Das Gerät, das ich bei Ihnen gekauft habe, funktioniert nicht.|Das Gerät, das ich bei Ihnen gekauft habe, funktioniert nicht mehr gehen.|Ihr Gerät ist kaputt gemacht.}","{Ich möchte es umtauschen oder mein Geld zurück.|Ich möchte es tauschen um oder Geld zurück.|Ich will Geld zurück, sofort!}"]},{"title":"Telefon: Nachricht","de":"jemandem etwas ausrichten = Nachricht weitergeben.","en":"pass on a message.","sents":["{Könnten Sie ihm ausrichten, dass ich angerufen habe?|Könnten Sie ihm einrichten, dass ich angerufen habe?|Sagen Sie ihn, ich rief an?}","{Er möchte mich bitte zurückrufen.|Er soll mich zurück rufen machen.|Er ruft mich zurück, bitte, ja?}"]},{"title":"Diskussion leiten","de":"Lassen Sie uns … / Was meinen Sie dazu?","en":"Let's … / What do you think about it?","sents":["{Lassen Sie uns zum nächsten Punkt kommen.|Lass uns kommen nächster Punkt.|Wir kommen nächsten Punkt jetzt.}","{Was meinen Sie dazu, Frau Lee?|Was meinen Sie davon, Frau Lee?|Wie denken Sie dazu, Frau Lee?}"]},{"title":"Unterbrechen","de":"Höflich unterbrechen.","en":"Interrupt politely.","sents":["{Entschuldigung, darf ich kurz unterbrechen?|Entschuldigung, ich unterbreche kurz Sie.|Stopp, ich rede jetzt!}","{Darf ich dazu etwas sagen?|Darf ich dafür etwas sagen?|Ich sage jetzt dazu was.}"]},{"title":"Zweifel äußern","de":"Ich bin mir nicht sicher, ob … / Ich bezweifle, dass …","en":"I'm not sure whether … / I doubt that …","sents":["{Ich bin mir nicht sicher, ob das funktioniert.|Ich bin nicht sicher mir, ob das funktioniert.|Ich bin mir nicht sicher, dass ob das funktioniert.}","{Ich bezweifle, dass das stimmt.|Ich bezweifle, ob das stimmt nicht.|Ich zweifle, dass stimmt das.}"]},{"title":"Vermutungen","de":"Ich vermute, dass … / Wahrscheinlich … / Er wird wohl …","en":"I suspect … / Probably …","sents":["{Ich vermute, dass er krank ist.|Ich vermute, er ist krank ist.|Ich vermute, dass ist er krank.}","{Wahrscheinlich hat er den Bus verpasst.|Wahrscheinlich er hat den Bus verpasst.|Wahrscheinlich hat verpasst er den Bus.}"]},{"title":"Gefühle ausdrücken","de":"Ich freue mich, dass … / Es ärgert mich, dass …","en":"I'm glad that … / It annoys me that …","sents":["{Ich freue mich sehr, dass du kommst.|Ich freue mich sehr, dass du kommst bist.|Ich bin sehr freue, dass du kommst.}","{Es ärgert mich, dass er nie pünktlich ist.|Es ärgert mich, dass er ist nie pünktlich.|Mich ärgert es, er nie pünktlich ist.}"]},{"title":"Verständnis zeigen","de":"Das kann ich verstehen. / Das tut mir leid.","en":"I understand. / I'm sorry.","sents":["{Das kann ich gut verstehen.|Das kann ich gut verstanden.|Das verstehe ich können.}","{Das tut mir wirklich leid für dich.|Das tut mich wirklich leid.|Das ist mir leid für dich.}"]},{"title":"Vor- und Nachteile","de":"Einerseits … andererseits …","en":"On the one hand … on the other …","sents":["{Einerseits ist das Leben in der Stadt spannend, andererseits ist es teuer.|Einerseits das Leben ist spannend, andererseits teuer ist.|Auf einer Seite ist es spannend, auf anderer Seite teuer.}","{Ein großer Vorteil ist die Flexibilität.|Ein großer Vorteil ist die Flexibel.|Großer Vorteil ist flexibel sein.}"]},{"title":"Grafik beschreiben","de":"Die Grafik zeigt …; steigen von … auf …","en":"The chart shows …; rise from … to …","sents":["{Die Grafik zeigt, wie viele Menschen Rad fahren.|Die Grafik zeigt, wie viele Menschen fahren Rad.|Die Grafik sagt, wie viele Menschen Rad fahren sind.}","{Die Zahl ist von 20 auf 35 Prozent gestiegen.|Die Zahl ist von 20 zu 35 Prozent gestiegen.|Die Zahl hat 20 bis 35 Prozent gestiegen.}"]},{"title":"Vergleichen","de":"Im Vergleich zu … / Bei uns ist das ähnlich/anders.","en":"Compared to … / It's similar where I'm from.","sents":["{Im Vergleich zu Deutschland ist Spanien wärmer.|Im Vergleich mit Deutschland ist Spanien wärmer als.|Vergleichen zu Deutschland Spanien ist wärmer.}","{In meinem Heimatland ist das ähnlich.|In meinem Heimatland ist das gleich ähnlich wie.|In meiner Heimatland ist es ähnlich.}"]},{"title":"Präsentation beginnen","de":"Es geht um …; Zuerst … dann … zum Schluss …","en":"It's about …; first … then … finally …","sents":["{In meiner Präsentation geht es um erneuerbare Energien.|In meiner Präsentation geht es über erneuerbare Energien.|Meine Präsentation geht um erneuerbare Energien.}","{Zuerst möchte ich kurz die Situation erklären.|Erstens möchte ich kurz Situation erkläre.|Zuerst ich möchte die Situation erklären.}"]},{"title":"Präsentation beenden","de":"Vielen Dank für Ihre Aufmerksamkeit. Haben Sie noch Fragen?","en":"Thank you for your attention. Any questions?","sents":["{Vielen Dank für Ihre Aufmerksamkeit.|Vielen Dank für Ihre Aufmerksam.|Danke zu Ihrer Aufmerksamkeit.}","{Haben Sie noch Fragen?|Gibt es Fragen gehabt?|Haben Sie Fragen noch gestellt?}"]},{"title":"Kompromiss finden","de":"Wie wäre es, wenn …? / Damit bin ich einverstanden.","en":"How about …? / I agree with that.","sents":["{Wie wäre es, wenn wir uns in der Mitte treffen?|Wie ist es, wenn wir uns treffen Mitte?|Wäre es, wir treffen Mitte?}","{Damit wäre ich einverstanden.|Damit bin ich einverstanden gewesen wäre.|Dafür wäre ich einverstanden.}"]},{"title":"Etwas planen (gemeinsam)","de":"sich kümmern um; Ich schlage vor, dass …","en":"take care of; I suggest that …","sents":["{Wer kümmert sich um die Getränke?|Wer kümmert sich für die Getränke?|Wer kümmert die Getränke sich?}","{Ich schlage vor, dass wir am Freitag feiern.|Ich schlage vor, dass wir feiern am Freitag.|Ich vorschlage, wir feiern Freitag.}"]},{"title":"Bedauern","de":"Leider …; Konjunktiv II für Bedauern.","en":"Unfortunately …; subjunctive for regret.","sents":["{Leider konnte ich nicht kommen.|Leider ich konnte nicht kommen.|Leider konnte ich nicht gekommen.}","{Hätte ich das nur früher gewusst!|Hätte ich das nur früher wissen!|Hatte ich nur früher gewusst!}"]},{"title":"Hoffnung","de":"Ich hoffe, dass … / Hoffentlich …","en":"I hope that … / Hopefully …","sents":["{Ich hoffe, dass alles klappt.|Ich hoffe, dass alles klappt ist.|Ich hoffe, alles dass klappt.}","{Hoffentlich sehen wir uns bald.|Hoffentlich wir sehen uns bald.|Hoffentlich sehen uns wir bald.}"]},{"title":"Überraschung","de":"Das gibt's doch nicht! / Das hätte ich nicht gedacht!","en":"No way! / I wouldn't have thought so!","sents":["{Das gibt's doch nicht!|Das gibt nicht doch!|Das ist nicht gibt!}","{Das hätte ich nicht gedacht!|Das habe ich nicht gedacht hätte!|Das würde ich nicht gedacht!}"]},{"title":"Beim Amt","de":"Ich möchte … anmelden / beantragen. Welche Unterlagen …?","en":"I'd like to register … Which documents …?","sents":["{Ich möchte meinen Wohnsitz anmelden.|Ich möchte mich Wohnsitz anmelden.|Ich will anmelden mein Wohnsitz.}","{Welche Unterlagen muss ich mitbringen?|Welche Unterlagen muss ich bringen mit?|Was Unterlagen mitbringen muss?}"]},{"title":"Am Arbeitsplatz","de":"Bitten mit Frist; Ich kümmere mich darum.","en":"Requests with a deadline; I'll take care of it.","sents":["{Könnten Sie mir das bitte bis Freitag schicken?|Sie schicken mir bis Freitag, bitte?|Schicken Sie bis Freitag mir!}","{Ich kümmere mich darum.|Ich kümmere mich davon.|Ich kümmere darum.}"]},{"title":"Krankmeldung","de":"sich krankmelden; die Krankschreibung.","en":"call in sick; sick note.","sents":["{Ich muss mich leider krankmelden.|Ich muss mich leider krank melden lassen machen.|Ich bin leider krank gemeldet worden.}","{Ich schicke Ihnen die Krankschreibung morgen.|Ich schicke Ihnen die Krank morgen.|Ich schicke Ihnen krankgeschrieben.}"]},{"title":"Small Talk Arbeit","de":"Woran arbeitest du? / Wie läuft …?","en":"What are you working on? / How is … going?","sents":["{Woran arbeitest du gerade?|An was du arbeitest gerade?|Worauf arbeitest du gerade?}","{Wie läuft das Projekt?|Wie geht das Projekt laufen?|Wie läuft es dem Projekt?}"]},{"title":"Ablehnen (höflich)","de":"Freundlich ablehnen.","en":"Decline politely.","sents":["{Das ist nett, aber ich muss leider ablehnen.|Das ist nett, aber ich muss ablehnen leider.|Nett, aber nein, nie.}","{Vielleicht klappt es nächstes Mal.|Vielleicht klappt nächstes Mal es.|Vielleicht klappen nächstes Mal.}"]},{"title":"Bitte um Rat","de":"Was würdest du an meiner Stelle tun?","en":"What would you do in my place?","sents":["{Was würdest du an meiner Stelle machen?|Was würdest du in meiner Stelle machen?|Was machst du meine Stelle?}","{Hast du einen Tipp für mich?|Hast du einen Tipp zu mir?|Gibst du mir Tipp?}"]},{"title":"Reklamation am Telefon","de":"Ich rufe wegen … an.","en":"I'm calling about …","sents":["{Ich rufe wegen meiner Bestellung an.|Ich rufe an wegen meine Bestellung.|Ich rufe um meine Bestellung an.}","{Die Lieferung ist immer noch nicht angekommen.|Die Lieferung ist immer noch nicht gekommen an.|Die Lieferung hat noch nicht angekommen.}"]},{"title":"E-Mail an Kollegen","de":"Anbei … (= attached); Melde dich, wenn …","en":"Attached …; Get in touch if …","sents":["{Anbei schicke ich dir die Unterlagen.|Anbei schicke ich dir die Unterlagen mit an.|Bei an schicke ich Unterlagen.}","{Melde dich, wenn du Fragen hast.|Melde dich, wenn du hast Fragen.|Melde, wenn Fragen du hast.}"]},{"title":"Wiederholung B1 I","de":"widersprechen + Dativ; sich freuen über.","en":"contradict + dative; be glad about.","sents":["Diskussion: {Da muss ich Ihnen widersprechen.|Da muss ich Sie widersprechen.|Da muss ich widersprechen Ihnen.}","Brief: {Ich würde mich über eine baldige Antwort freuen.|Ich würde mich auf eine baldige Antwort gefreut.|Ich freue mich für baldige Antwort.}"]},{"title":"Wiederholung B1 II","de":"Fragen mit Modalverb; Konjunktiv II höflich.","en":"Questions with modal; polite subjunctive.","sents":["Arzt: {Wie oft muss ich die Tabletten nehmen?|Wie oft muss ich nehmen die Tabletten?|Wie viel mal Tabletten ich nehmen?}","Wohnung: {Wann wäre eine Besichtigung möglich?|Wann ist Besichtigung möglich wäre?|Wann kann ich besichtigen gehen?}"]},{"title":"Wiederholung B1 III","de":"Höfliche indirekte Fragen.","en":"Polite indirect questions.","sents":["{Ich hätte gern gewusst, ob es noch Plätze gibt.|Ich hätte gern wissen, ob gibt es noch Plätze.|Ich habe gern gewusst, ob noch Plätze.}","{Könnten Sie mir sagen, wo das Büro ist?|Könnten Sie mir sagen, wo ist das Büro?|Können Sie sagen mir, wo das Büro?}"]},{"title":"Wiederholung B1 IV","de":"Meinung + Gegenargument.","en":"Opinion + counter-argument.","sents":["{Meiner Meinung nach sollte man weniger fliegen.|Meiner Meinung nach man sollte weniger fliegen.|Nach meiner Meinung sollte weniger fliegen.}","{Dagegen spricht, dass Bahnfahren teuer ist.|Dagegen sagt, dass Bahnfahren teuer ist.|Dagegen spricht, dass ist Bahnfahren teuer.}"]},{"title":"Wiederholung B1 V","de":"sich entschuldigen für; Es tut mir leid, dass …","en":"apologise for; I'm sorry that …","sents":["{Ich möchte mich für die Verspätung entschuldigen.|Ich möchte mich über die Verspätung entschuldigen.|Ich möchte entschuldigen die Verspätung.}","{Es tut mir leid, dass ich Sie warten ließ.|Es tut mir leid, dass ich ließ Sie warten.|Es tut mich leid, Sie warten.}"]},{"title":"Wiederholung B1 VI","de":"halten von (Meinung fragen); halten für (bewerten).","en":"What do you think of …? / I consider it …","sents":["{Was halten Sie von dem Vorschlag?|Was halten Sie über den Vorschlag?|Wie halten Sie von dem Vorschlag?}","{Ich halte das für eine gute Idee.|Ich halte das als eine gute Idee.|Ich halte das zu einer guten Idee.}"]},{"title":"Wiederholung B1 VII","de":"Es kommt darauf an …; abhängen von.","en":"It depends on …","sents":["{Es kommt darauf an, wie viel es kostet.|Es kommt davon an, wie viel es kostet.|Es kommt darauf an, wie viel kostet es.}","{Das hängt vom Wetter ab.|Das hängt am Wetter ab.|Das hängt zum Wetter ab.}"]},{"title":"Wiederholung B1 VIII","de":"Indirekte Frage; sich interessieren für.","en":"Indirect question; be interested in.","sents":["{Ich würde gern wissen, wann der Kurs beginnt.|Ich würde gern wissen, wann beginnt der Kurs.|Ich will wissen, wann Kurs.}","{Ich interessiere mich für Ihr Angebot.|Ich interessiere mich an Ihrem Angebot.|Ich interessiere für Ihr Angebot mich.}"]},{"title":"Wiederholung B1 IX","de":"Danke im Voraus; Ich wäre Ihnen dankbar, wenn …","en":"Thanks in advance; I'd be grateful if …","sents":["{Vielen Dank im Voraus!|Vielen Dank im Voraus gedankt!|Danke zu Vorne!}","{Ich wäre Ihnen sehr dankbar, wenn Sie mir helfen könnten.|Ich wäre Ihnen sehr dankbar, wenn Sie könnten mir helfen.|Ich bin Sie dankbar, wenn Sie helfen.}"]},{"title":"Wiederholung B1 X","de":"selbstverständlich = of course.","en":"of course / no problem.","sents":["{Das ist doch selbstverständlich!|Das ist doch selbstständlich!|Das ist doch selbst verstanden!}","{Kein Problem, das mache ich gern.|Kein Problem, das mache gern ich.|Nicht Problem, ich mache gern.}"]},{"title":"Wiederholung B1 XII","de":"davon ausgehen = annehmen; vorkommen = scheinen.","en":"assume; seem familiar.","sents":["{Ich gehe davon aus, dass alles klappt.|Ich gehe darauf aus, dass alles klappt.|Ich gehe davon aus, dass klappt alles.}","{Das kommt mir bekannt vor.|Das kommt mich bekannt vor.|Das kommt mir bekannt an.}"]},{"title":"Wiederholung B1 XI","de":"auf der Suche nach; verfügen über.","en":"looking for; have (experience).","sents":["{Ich bin auf der Suche nach einer neuen Stelle.|Ich bin auf Suche nach einer neue Stelle.|Ich bin für Suche nach Stelle.}","{Ich verfüge über fünf Jahre Berufserfahrung.|Ich verfüge mit fünf Jahre Berufserfahrung.|Ich verfüge fünf Jahre Berufserfahrung über.}"]},{"title":"Stellung nehmen (B2)","de":"B2: Ich vertrete die Auffassung … / Aus meiner Sicht …","en":"B2: I hold the view … / From my perspective …","sents":["{Ich vertrete die Auffassung, dass …|Ich vertrete die Auffassung von dass …|Ich trete die Auffassung, dass …}","{Aus meiner Sicht überwiegen die Vorteile.|Aus meiner Sicht überwiegen die Vorteile über.|Von meiner Sicht überwiegt Vorteil.}"]},{"title":"Einwände (B2)","de":"B2: einschränken: nur bedingt, allerdings.","en":"B2: qualify: only partly, however.","sents":["{Man muss allerdings bedenken, dass …|Man muss allerdings denken, dass …|Man muss bedenken allerdings, dass …}","{Dem kann ich nur bedingt zustimmen.|Dem kann ich nur bedingt zugestimmt.|Das kann ich nur bedingt zustimmen.}"]},{"title":"Relativieren (B2)","de":"B2: zutreffen; im Großen und Ganzen.","en":"B2: apply; by and large.","sents":["{Das trifft nicht in allen Fällen zu.|Das trifft nicht in allen Fällen an.|Das trifft nicht alle Fälle zu.}","{Im Großen und Ganzen stimme ich zu.|Im Großen und Ganz stimme ich zu.|Im Groß und Ganzen stimme zu ich.}"]},{"title":"Hervorheben (B2)","de":"B2: hervorzuheben ist …; entscheidend ist …","en":"B2: it should be emphasised …; what's crucial is …","sents":["{Besonders hervorzuheben ist, dass …|Besonders hervorheben ist, dass …|Hervorzuheben besonders, dass …}","{Entscheidend ist vor allem die Finanzierung.|Entscheidend ist vor allen die Finanzierung.|Entscheiden ist vor allem die Finanzierung.}"]},{"title":"Schlussfolgern (B2)","de":"B2: Daraus folgt …; Abschließend lässt sich festhalten …","en":"B2: It follows that …; In conclusion …","sents":["{Daraus folgt, dass wir handeln müssen.|Daraus folgt, dass wir müssen handeln.|Davon folgt, dass wir handeln müssen.}","{Abschließend lässt sich festhalten, dass …|Abschließend lässt sich festhalten, das …|Schließlich lässt festhalten sich, dass …}"]},{"title":"Formelle Bitte (B2)","de":"B2: zukommen lassen; zur Verfügung stehen.","en":"B2: send; be available.","sents":["{Ich möchte Sie bitten, mir die Unterlagen zukommen zu lassen.|Ich möchte Sie bitten, mir die Unterlagen kommen zu lassen zu.|Ich bitte Sie, Unterlagen mir zukommen lassen.}","{Für Rückfragen stehe ich Ihnen gern zur Verfügung.|Für Rückfragen stehe ich Sie gern zur Verfügung.|Bei Rückfragen stehe ich zur Verfügung Ihnen.}"]},{"title":"Kritik üben (B2)","de":"B2: kritisch anzumerken ist …; es wäre wünschenswert …","en":"B2: it should be noted critically …; it would be desirable …","sents":["{Kritisch anzumerken ist, dass die Kosten zu hoch sind.|Kritisch anmerken ist, dass die Kosten zu hoch sind.|Kritisch anzumerken, die Kosten sind zu hoch ist.}","{Es wäre wünschenswert, wenn mehr investiert würde.|Es wäre wünschenswert, wenn mehr würde investiert.|Es ist wünschenswert, wenn mehr investiert wäre.}"]},{"title":"Diplomatisch formulieren (B2)","de":"B2: indirekte Kritik als Frage.","en":"B2: indirect criticism as a question.","sents":["{Ich frage mich, ob das wirklich die beste Lösung ist.|Ich frage mich, ob ist das wirklich die beste Lösung.|Ich frage mir, ob das die beste Lösung.}","{Wäre es nicht sinnvoller, zuerst zu planen?|Wäre es nicht sinnvoller, zuerst planen?|Ist es nicht sinnvoller wäre, zuerst zu planen?}"]},{"title":"Zitieren (B2)","de":"B2: Laut …; Wie X betont, …","en":"B2: According to …; As X emphasises …","sents":["{Laut einer Studie schlafen viele Menschen zu wenig.|Laut einer Studie viele Menschen schlafen zu wenig.|Nach einer Studie laut schlafen viele zu wenig.}","{Wie der Autor betont, ist Bildung entscheidend.|Wie der Autor betont, Bildung ist entscheidend.|Wie betont der Autor, ist Bildung entscheidend.}"]},{"title":"Überleiten (B2)","de":"B2: auf etwas eingehen; im Folgenden.","en":"B2: go into; in the following.","sents":["{Damit komme ich zum nächsten Punkt.|Damit komme ich auf den nächsten Punkt zu.|Damit ich komme zum nächsten Punkt.}","{Im Folgenden möchte ich auf die Kosten eingehen.|Im Folgenden möchte ich über die Kosten eingehen.|Folgend möchte ich auf Kosten eingehen.}"]},{"title":"Verhandeln (B2)","de":"B2: jemandem entgegenkommen; unter der Bedingung.","en":"B2: meet someone halfway; on condition that.","sents":["{Wir wären bereit, Ihnen entgegenzukommen.|Wir wären bereit, Ihnen entgegen zu kommen machen.|Wir sind bereit, Sie entgegenzukommen.}","{Unter der Bedingung, dass …|Unter die Bedingung, dass …|Mit der Bedingung, dass …}"]},{"title":"Akademisch (B2)","de":"B2: im Rahmen; es ist festzustellen.","en":"B2: within the scope; it can be observed.","sents":["{Im Rahmen dieser Arbeit wird untersucht, …|Im Rahmen von dieser Arbeit untersucht wird, …|In dem Rahmen dieser Arbeit wird untersuchen, …}","{Es ist festzustellen, dass die Zahlen steigen.|Es ist festzustellen, dass die Zahlen steigen werden worden.|Es ist feststellen, dass die Zahlen steigen.}"]},{"title":"Interview (B2)","de":"B2: bezeichnen als; es gewohnt sein, … zu …","en":"B2: describe as; be used to doing.","sents":["{Was würden Sie als Ihre größte Stärke bezeichnen?|Was würden Sie als Ihre größte Stärke bezeichnet?|Was bezeichnen Sie Ihre größte Stärke als?}","{Ich bin es gewohnt, unter Zeitdruck zu arbeiten.|Ich bin es gewöhnt, unter Zeitdruck arbeiten.|Ich bin gewohnt es, unter Zeitdruck zu arbeiten.}"]}]},{"id":"lesen","name":"Lesen","en":"Reading","kind":"gap","levels":[{"title":"Vorstellung","de":"heißen: ich heiße; Herkunft: aus.","en":"heißen: ich heiße; origin: aus.","sents":["Hallo! Ich {heiße|heißt|heißen} Marta und komme {aus|von|in} Polen. Ich wohne seit drei Jahren in Leipzig."]},{"title":"SMS an Freundin","de":"sein + krank; Zukunft: morgen.","en":"sein + krank; future: tomorrow.","sents":["Hi Jana, ich {bin|habe|werde} heute leider krank. Können wir uns {morgen|gestern|vorgestern} treffen? LG Tim"]},{"title":"Einkaufszette
