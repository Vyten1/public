/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const band = l => l < 40 ? "A2" : l < 85 ? "B1" : "B2";   // l is 0-based
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 86400000); };
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const GAP = /\{([^{}]*)\}/g;
const fillAll = s => s.replace(GAP, (_, g) => g.split("|")[0]);

/* ---------- state ---------- */
function fresh(){ return { v:1, upd:0, lv:{}, sr:{}, xp:{}, streak:{last:-1,count:0}, auto:0, seen:{}, settings:{goal:100, tts:true, theme:"dark"} }; }
function loadLocal(){ try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.v === 1) return Object.assign(fresh(), s); } catch(e){} return fresh(); }
let S = loadLocal();
function applyTheme(){
  const th = S.settings.theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", th);
}
applyTheme();
const remote = { ref:null, on:false, timer:null, busy:false, again:false };
function save(){
  S.upd = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  if (remote.ref){ clearTimeout(remote.timer); remote.timer = setTimeout(pushRemote, 1500); }
}
async function pushRemote(){
  if (!remote.ref) return;
  if (remote.busy){ remote.again = true; return; }
  remote.busy = true;
  try { await remote.ref.set({ json: JSON.stringify(S), upd: S.upd }); remote.on = true; }
  catch(e){ remote.on = false; }
  remote.busy = false; updateSync();
  if (remote.again){ remote.again = false; pushRemote(); }
}
async function connectRemote(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    remote.ref = ref; remote.on = true;
    if (snap.exists){
      const d = snap.data(); let rs = null;
      try { rs = JSON.parse(d.json); } catch(e){}
      if (rs && rs.v === 1 && (rs.upd||0) > (S.upd||0)){
        S = Object.assign(fresh(), rs); S.settings = Object.assign(fresh().settings, S.settings); applyTheme();
        try { localStorage.setItem(LS_KEY, d.json); } catch(e){}
        if (view.name === "home" || view.name === "track") render();
      } else if ((S.upd||0) > ((rs && rs.upd)||0)) pushRemote();
    } else if (S.upd) pushRemote();
  } catch(e){ remote.on = false; }
  updateSync();
}
function updateSync(){
  const el = document.getElementById("sync"); if (!el) return;
  el.innerHTML = remote.on ? '<i class="dot on"></i>In deinem Konto gespeichert' : '<i class="dot"></i>Auf diesem Gerät gespeichert';
}

/* ---------- progress ---------- */
const lvKey = (t,l) => t + "." + l;
const lvRec = (t,l) => S.lv[lvKey(t,l)];
const passed = (t,l) => !!(lvRec(t,l) && lvRec(t,l).s >= 1);
const unlocked = (t,l) => l === 0 || passed(t, l-1);
function nextLevel(t){ for (let l=0;l<100;l++) if (!passed(t,l)) return l; return -1; }
function trackDone(t){ let n=0; for (let l=0;l<100;l++) if (passed(t,l)) n++; return n; }
function dueKeys(){ const d = today(); return Object.keys(S.sr).filter(k => S.sr[k][1] <= d); }
function addXP(n){
  const d = today(); S.xp[d] = (S.xp[d]||0) + n;
  if (S.streak.last !== d){ S.streak.count = (S.streak.last === d-1) ? S.streak.count + 1 : 1; S.streak.last = d; }
  const keep = Object.keys(S.xp).map(Number).sort((a,b)=>b-a).slice(0,60);
  for (const k of Object.keys(S.xp)) if (!keep.includes(Number(k))) delete S.xp[k];
}
function streakNow(){ const d = today(); return (S.streak.last === d || S.streak.last === d-1) ? S.streak.count : 0; }
function srUpdate(key, ok){
  const d = today(); const r = S.sr[key] || [0, d, 0, 1];
  if (ok){ r[0] = Math.min(r[0]+1, INT.length-1); r[1] = d + INT[r[0]]; r[3] = 1; }
  else { r[0] = 0; r[1] = d; r[2] += 1; r[3] = 0; }
  S.sr[key] = r;
}

/* ---------- question units ---------- */
function units(t, l){
  const T = DATA[t], L = T.levels[l], out = [];
  if (T.kind === "vocab") L.items.forEach((w,i) => { out.push(`${t}.${l}.${i}.m`); if (w.art) out.push(`${t}.${l}.${i}.a`); });
  else if (T.kind === "art") L.items.forEach((w,i) => out.push(`${t}.${l}.${i}.a`));
  else if (T.kind === "syn") L.items.forEach((w,i) => { out.push(`${t}.${l}.${i}.f`); out.push(`${t}.${l}.${i}.b`); });
  else { let g = 0; L.sents.forEach(s => { (s.match(GAP)||[]).forEach(() => out.push(`${t}.${l}.${g++}.g`)); }); }
  return out;
}
function gapList(L){
  const list = [];
  L.sents.forEach((s, si) => { let gi = 0; s.replace(GAP, (m, g) => { list.push({ si, gi: gi++, opts: g.split("|") }); return m; }); });
  return list;
}
function renderSentence(s, gi, mark){
  let i = 0;
  return esc(s).replace(/\{([^{}]*)\}/g, (_, g) => {
    const cur = i++; const correct = g.split("|")[0];
    if (cur === gi) return mark;
    return '<span class="de">' + correct + '</span>';
  });
}
function vocabPool(t, l, field, wantNoun, exclude){
  const T = DATA[t], pool = [];
  for (let d = 0; d < 100 && pool.length < 24; d++){
    for (const ll of [l-d, l+d]) {
      if (ll < 0 || ll > 99 || (d === 0 && ll !== l) ) continue;
      if (d > 0 && ll === l) continue;
      for (const w of T.levels[ll].items){
        const v = w[field];
        if (exclude.includes(v) || pool.includes(v)) continue;
        if (wantNoun !== null && !!w.art !== wantNoun) continue;
        pool.push(v);
      }
    }
  }
  return pool;
}
function makeQ(key, allowType){
  const [ts, ls, us, kind] = key.split("."); const t = +ts, l = +ls, u = +us;
  const T = DATA[t], L = T.levels[l];
  const seen = S.seen[key] || 0;
  const r = rng(hash(key + "#" + seen));
  const q = { key, t, l, kind, type: "mc" };
  if (T.kind === "vocab"){
    const w = L.items[u];
    const label = w.de + (w.pl ? " " + w.pl : "");
    q.explainDe = `<b>${esc(label)}</b> = ${esc(w.en)}`; q.explainEn = null;
    q.speak = w.de;
    if (kind === "a"){
      const noun = w.de.split(" ").slice(1).join(" ");
      q.label = "Artikel"; q.html = `<span class="blank"></span> ${esc(noun)}`; q.hint = w.en;
      q.correct = w.art; q.options = ["der","die","das"]; q.arts = true;
      q.fill = w.art;
      return q;
    }
    const reverse = r() < 0.5;
    if (reverse){
      q.label = "Auf Deutsch"; q.html = esc(w.en); q.hint = "Wie heißt das auf Deutsch?";
      q.correct = w.de;
      const pool = vocabPool(t, l, "de", !!w.art, [w.de]);
      q.options = shuffle([w.de, ...shuffle(pool.slice(0,10), r).slice(0,3)], r);
      if (allowType && !w.de.includes(",") && r() < 0.6){ q.type = "type"; q.accept = [w.de, w.art ? w.de.split(" ").slice(1).join(" ") : w.de]; }
    } else {
      q.label = "Bedeutung"; q.html = esc(w.de); q.hint = "Was bedeutet das?";
      q.correct = w.en;
      const pool = vocabPool(t, l, "en", null, [w.en]);
      q.options = shuffle([w.en, ...shuffle(pool.slice(0,10), r).slice(0,3)], r);
    }
    return q;
  }
  if (T.kind === "art"){
    const w = L.items[u];
    q.label = "Artikel"; q.html = `<span class="blank"></span> ${esc(w.w)}`; q.hint = w.en;
    q.correct = w.art; q.options = ["der","die","das"]; q.arts = true; q.fill = w.art;
    q.explainDe = `<b>${esc(w.art + " " + w.w)}</b> = ${esc(w.en)}<br>${esc(L.de)}`; q.explainEn = esc(L.en);
    q.speak = w.art + " " + w.w;
    return q;
  }
  if (T.kind === "syn"){
    const p = L.items[u];
    const from = kind === "f" ? p.a : p.b, to = kind === "f" ? p.b : p.a;
    q.label = p.k === "syn" ? "Synonym" : "Gegenteil";
    q.html = esc(from);
    q.hint = p.k === "syn" ? "Welches Wort bedeutet dasselbe?" : "Was ist das Gegenteil?";
    q.correct = to;
    const pool = [];
    for (let d = 0; d < 100 && pool.length < 12; d++) for (const ll of new Set([l-d, l+d])) {
      if (ll < 0 || ll > 99) continue;
      for (const pp of T.levels[ll].items) for (const v of [pp.a, pp.b]) if (v !== p.a && v !== p.b && !pool.includes(v)) pool.push(v);
    }
    q.options = shuffle([to, ...shuffle(pool, r).slice(0,3)], r);
    q.explainDe = `<b>${esc(p.a)}</b> ${p.k === "syn" ? "=" : "↔"} <b>${esc(p.b)}</b>`;
    q.explainEn = `${esc(p.en)} (${p.k === "syn" ? "synonyms" : "opposites"})`;
    q.speak = p.a + ", " + p.b;
    return q;
  }
  // gap tracks
  const gl = gapList(L)[u];
  const sent = L.sents[gl.si];
  const correct = gl.opts[0];
  const whole = sent.replace(GAP, "").replace(/\([^)]*\)/g, "").trim() === "" && (sent.match(GAP)||[]).length === 1;
  q.correct = correct;
  q.options = shuffle(gl.opts, r);
  q.label = L.title;
  if (whole){
    q.whole = true; q.html = ""; q.hint = "Welcher Satz ist richtig?" + (sent.replace(GAP, "").trim() ? " " + sent.replace(GAP, "").trim() : "");
  } else {
    q.html = renderSentence(sent, gl.gi, '<span class="blank"></span>');
    q.hint = "Ergänze die Lücke.";
    q.sentence = sent; q.gi = gl.gi;
  }
  q.explainDe = esc(L.de); q.explainEn = esc(L.en);
  q.full = fillAll(sent);
  q.speak = q.full;
  if (allowType && !whole && /^[A-Za-zÄÖÜäöüß-]{3,16}$/.test(correct) && r() < 0.5){ q.type = "type"; q.accept = [correct]; }
  return q;
}

/* ---------- sessions ---------- */
let view = { name: "home" };
let sess = null;

function buildLevelSession(t, l, mode){
  let own = units(t, l);
  if (own.length > 8){ const m = own.filter(k => !k.endsWith(".a")), a = own.filter(k => k.endsWith(".a")); own = m.concat(a.slice(0, Math.max(0, 8 - m.length))); }
  const r = rng(hash("lvl" + t + "." + l + "#" + (S.seen["L" + t + "." + l] || 0)));
  let review = [];
  if (l > 0){
    const d = today(), cands = [];
    for (let ll = 0; ll < l; ll++) for (const k of units(t, ll)) cands.push(k);
    const scored = cands.map(k => { const s = S.sr[k]; const due = s ? (s[1] <= d ? 0 : 1) : 2; const box = s ? s[0] : 0; return { k, sc: due*10 + box + r()*0.9 + (k.split(".")[1] >= l-5 ? -0.5 : 0) }; });
    scored.sort((a,b) => a.sc - b.sc);
    const want = Math.max(2, 8 - own.length);
    review = scored.slice(0, want).map(x => x.k);
  }
  const qs = own.map(k => ({ k, rev: false })).concat(review.map(k => ({ k, rev: true })));
  for (let j = 0; qs.length < 5 && own.length; j++) qs.push({ k: own[j % own.length], rev: false });
  return { kind: "level", mode, t, l, items: qs, i: 0, results: [], answered: false };
}
function buildReviewSession(keys, title){
  return { kind: "review", title, items: keys.map(k => ({ k, rev: true })), i: 0, results: [], answered: false };
}
function buildPlacement(t){
  const keys = [];
  for (let l = 1; l < 40; l += 3){ const u = units(t, l); keys.push(u[hash("pl" + t + l) % u.length]); }
  return { kind: "placement", t, items: keys.slice(0, 13).map(k => ({ k, rev: false })), i: 0, results: [], answered: false };
}
function currentQ(){
  const it = sess.items[sess.i];
  if (!it.q) it.q = makeQ(it.k, it.rev);
  return it.q;
}

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /^de(-|_)DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null; } catch(e){} }
const canSpeak = () => S.settings.tts && "speechSynthesis" in window;
if ("speechSynthesis" in window){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){} }
function speak(text){
  if (!canSpeak()) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 0.92; speechSynthesis.speak(u); } catch(e){}
}
const speakBtn = (text) => canSpeak() ? `<button class="icon-btn" data-speak="${esc(text)}" aria-label="Vorlesen">${ICON.speak}</button>` : "";

/* ---------- views ---------- */
const app = document.getElementById("app");
function go(v){ view = v; render(); window.scrollTo(0, 0); }

function render(){
  if (view.name === "home") return renderHome();
  if (view.name === "track") return renderTrack();
  if (view.name === "lesson") return renderLesson();
  if (view.name === "quiz") return renderQuiz();
  if (view.name === "result") return renderResult();
  if (view.name === "mistakes") return renderMistakes();
}

function themeBtn(style){
  const dark = S.settings.theme !== "light";
  return `<button class="icon-btn" data-act="theme" aria-label="${dark ? "Hellen Modus einschalten" : "Dunklen Modus einschalten"}" title="${dark ? "Hell" : "Dunkel"}" style="${style}">${dark ? ICON.sun : ICON.moon}</button>`;
}
function topbar(title, back){
  return `<div class="topbar"><div class="wrap"><button class="icon-btn" data-act="${back}" aria-label="Zurück">${ICON.back}</button><div class="t">${title}</div>${themeBtn("")}<button class="icon-btn" data-act="settings" aria-label="Einstellungen">${ICON.gear}</button></div></div>`;
}

function totalPassed(){ let n = 0; for (let t=0;t<DATA.length;t++) n += trackDone(t); return n; }
function overallBand(){
  const nx = DATA.map((_, t) => nextLevel(t)).filter(x => x >= 0);
  if (!nx.length) return "B2";
  return band(Math.min(...nx));
}

function renderHome(){
  const d = today(); const xp = S.xp[d] || 0; const goal = S.settings.goal;
  const due = dueKeys().length;
  const wrong = Object.keys(S.sr).filter(k => S.sr[k][3] === 0).length;
  const done = totalPassed();
  let h = `<div class="cover"><div class="wrap">
    <div class="row between"><div class="eyebrow">Deutsch · A2 → B1 → B2</div><div class="row" style="gap:8px">${themeBtn("background:transparent;border-color:rgba(27,22,0,.35)")}<button class="icon-btn" data-act="settings" aria-label="Einstellungen" style="background:transparent;border-color:rgba(27,22,0,.35)">${ICON.gear}</button></div></div>
    <h1 style="margin-top:6px">Hundert Stufen</h1>
    <div class="de" style="margin-top:4px;font-style:italic">Zehn Hefte, je hundert Stufen. Heute eine mehr.</div>
    <div class="stats tnum">
      <div class="stat"><b>${xp}</b><span>XP heute · Ziel ${goal}</span><div class="goalbar"><i style="width:${Math.min(100, xp/goal*100)}%"></i></div></div>
      <div class="stat"><b>${streakNow()}</b><span>${streakNow() === 1 ? "Tag" : "Tage"} in Folge</span></div>
      <div class="stat"><b>${done}</b><span>von 1000 Stufen</span></div>
    </div>
  </div></div>
  <div class="wrap">
    <div class="actions">
      <button class="btn btn-primary wide" data-act="auto">Auto-Modus <small>· nächste Stufe, Heft für Heft</small></button>
      <button class="btn btn-ghost" data-act="review" ${due ? "" : "disabled"}>Wiederholen <small class="tnum">${due}</small></button>
      <button class="btn btn-ghost" data-act="mistakes">Fehlerheft <small class="tnum">${wrong}</small></button>
    </div>
    <div class="sec">
      <div class="sec-h"><h3>Deine Hefte</h3><span class="chip c-${overallBand()}">${overallBand()}</span></div>
      <div class="tracks">`;
  DATA.forEach((T, t) => {
    const n = trackDone(t), nx = nextLevel(t);
    const a2 = Math.min(n, 40), b1 = Math.max(0, Math.min(n, 85) - 40), b2 = Math.max(0, n - 85);
    h += `<button class="track" data-act="track" data-t="${t}">
      <div class="heft tnum">${String(t+1).padStart(2,"0")}</div>
      <div style="min-width:0"><div class="track-name">${esc(T.name)}</div>
        <div class="track-sub tnum">${esc(T.en)} · ${nx < 0 ? "fertig" : "Stufe " + (nx+1)}</div>
        <div class="bar"><i class="bg-A2" style="width:${a2}%"></i><i class="bg-B1" style="width:${b1}%"></i><i class="bg-B2" style="width:${b2}%"></i></div></div>
      <span class="chip c-${nx < 0 ? "B2" : band(nx)}">${nx < 0 ? "✓" : band(nx)}</span>
    </button>`;
  });
  h += `</div></div>
    <div class="sec sync" id="sync"></div>
  </div>`;
  app.innerHTML = h; updateSync();
}

function renderTrack(){
  const t = view.t, T = DATA[t], nx = nextLevel(t);
  let h = topbar(`Heft ${t+1} · ${esc(T.name)}`, "home") + `<div class="wrap">
    <div class="row between" style="margin-top:16px;align-items:flex-end">
      <div><div class="eyebrow muted">${esc(T.en)}</div><h2>${trackDone(t)} / 100</h2></div>
      ${nx >= 0 ? `<button class="btn btn-yellow" data-act="open" data-t="${t}" data-l="${nx}" style="min-height:44px;padding:10px 14px">Stufe ${nx+1} lernen</button>` : `<span class="chip c-B2">Heft fertig</span>`}
    </div>
    <div class="legend"><span><i class="bg-A2"></i>A2 · 1–40</span><span><i class="bg-B1"></i>B1 · 41–85</span><span><i class="bg-B2"></i>B2 · 86–100</span></div>
    <div class="map">`;
  for (let l = 0; l < 100; l++){
    if (l === 0) h += `<div class="band-label c-A2">A2</div>`;
    if (l === 40) h += `<div class="band-label c-B1">B1</div>`;
    if (l === 85) h += `<div class="band-label c-B2">B2 – öffnet sich, wenn B1 komplett ist</div>`;
    const rec = lvRec(t, l), un = unlocked(t, l), ps = passed(t, l);
    const cls = ps ? "done" : (l === nx ? "next" : (un ? "" : "locked"));
    const st = ps ? "●".repeat(rec.s) : "";
    h += `<button class="tile ${cls} tnum" data-band="${band(l)}" data-act="${un ? "open" : "locked"}" data-t="${t}" data-l="${l}" aria-label="Stufe ${l+1}${ps ? ", " + rec.s + " Sterne" : un ? "" : ", gesperrt"}">${l+1}${st ? `<span class="st">${st}</span>` : ""}</button>`;
  }
  h += `</div>`;
  if (nx >= 0 && nx < 40) h += `<div class="card sec"><h3>Schon weiter als A2?</h3><p class="muted" style="margin:6px 0 12px">Einstufungstest: 13 Fragen aus den A2-Stufen. Ab 80 % öffnet sich direkt B1 (Stufe 41).</p><button class="btn btn-ghost" data-act="placement" data-t="${t}" style="width:100%">Einstufungstest starten</button></div>`;
  h += `</div>`;
  app.innerHTML = h;
}

function lessonBody(t, l){
  const T = DATA[t], L = T.levels[l];
  let h = "";
  if (T.kind === "vocab"){
    h += `<div class="card">${L.items.map(w => `<div class="ex"><div class="de">${w.art ? `<span class="art-${w.art}">${w.art}</span> ${esc(w.de.split(" ").slice(1).join(" "))}` : esc(w.de)} <span class="muted" style="font-size:14px">${esc(w.pl)}</span><div class="en">${esc(w.en)}</div></div>${speakBtn(w.de)}</div>`).join("")}</div>`;
  } else if (T.kind === "art"){
    h += `<div class="card"><div class="explain">${esc(L.de)}</div>${enToggle(L.en)}</div>
      <div class="card" style="margin-top:10px">${L.items.map(w => `<div class="ex"><div class="de"><span class="art-${w.art}"><b>${w.art}</b></span> ${esc(w.w)}<div class="en">${esc(w.en)}</div></div>${speakBtn(w.art + " " + w.w)}</div>`).join("")}</div>`;
  } else if (T.kind === "syn"){
    h += `<div class="card">${L.items.map(p => `<div class="ex"><div class="de"><b>${esc(p.a)}</b> ${p.k === "syn" ? "=" : "↔"} <b>${esc(p.b)}</b><div class="en">${p.k === "syn" ? "Synonym" : "Gegenteil"} · ${esc(p.en)}</div></div>${speakBtn(p.a + ", " + p.b)}</div>`).join("")}</div>`;
  } else {
    h += `<div class="card"><div class="explain">${esc(L.de)}</div>${enToggle(L.en)}</div>
      <div class="card" style="margin-top:10px"><div class="eyebrow muted" style="margin-bottom:4px">Beispiele</div>${L.sents.map(s => `<div class="ex"><div class="de">${esc(s).replace(/\{([^{}]*)\}/g, (_, g) => "<mark>" + g.split("|")[0] + "</mark>")}</div>${speakBtn(fillAll(s))}</div>`).join("")}</div>`;
  }
  return h;
}
function enToggle(en){ return `<button class="linkbtn" data-act="en">Auf Englisch anzeigen</button><div class="explain-en" hidden>${esc(en)}</div>`; }

function renderLesson(){
  const { t, l, mode } = view, T = DATA[t], L = T.levels[l];
  const title = T.kind === "syn" ? "Wortpaare" : (T.kind === "vocab" ? "Thema: " + L.title : L.title);
  app.innerHTML = topbar(`Heft ${t+1} · Stufe ${l+1}`, mode === "auto" ? "home" : "track") + `<div class="wrap">
    <div class="row" style="margin-top:18px;gap:8px"><span class="chip c-${band(l)}">${band(l)}</span><span class="muted" style="font-size:14px">${esc(T.name)}${mode === "auto" ? " · Auto-Modus" : ""}</span></div>
    <h2 class="lesson-title">${esc(title)}</h2>
    <p class="muted" style="margin:0 0 14px">Lies die Lernkarte, dann geht's los.</p>
    ${lessonBody(t, l)}
    <div class="sticky-next"><button class="btn btn-primary" style="width:100%" data-act="start">Los geht's</button></div>
  </div>`;
}

function renderQuiz(){
  const q = currentQ(), it = sess.items[sess.i];
  let head;
  if (sess.kind === "level") head = `Heft ${sess.t+1} · Stufe ${sess.l+1}`;
  else if (sess.kind === "placement") head = `Einstufungstest · Heft ${sess.t+1}`;
  else head = sess.title;
  const prog = sess.items.map((_, i) => `<i class="${i < sess.results.length ? (sess.results[i] ? "ok" : "bad") : (i === sess.i ? "cur" : "")}"></i>`).join("");
  const tag = it.rev && sess.kind === "level" ? " · Wiederholung" : (sess.kind !== "level" ? ` · ${esc(DATA[q.t].name)} ${q.l+1}` : "");
  let body = `<div class="qkind">${esc(q.label)}${tag}</div>`;
  if (!q.whole) body += `<div class="row" style="align-items:flex-start"><div class="qtext" id="qtext" style="flex:1">${q.html}</div></div>`;
  body += `<div class="qhint">${esc(q.hint)}</div>`;
  if (q.type === "type"){
    body += `<form class="typebox" id="typeform" autocomplete="off"><input id="typein" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eintippen" aria-label="Antwort"><div class="umlauts">${["ä","ö","ü","ß"].map(c => `<button type="button" data-ins="${c}">${c}</button>`).join("")}</div><button class="btn btn-primary" type="submit">Prüfen</button></form>`;
  } else {
    body += `<div class="opts ${q.arts ? "arts" : ""}">${q.options.map((o, i) => `<button class="opt" data-opt="${i}">${q.arts ? "" : `<span class="k">${i+1}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  body += `<div id="fb"></div>`;
  app.innerHTML = topbar(head, "quit") + `<div class="wrap"><div class="qprog">${prog}</div>${body}</div>`;
  const inp = document.getElementById("typein"); if (inp) inp.focus();
}

function norm(s){ return s.trim().toLowerCase().replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü").replace(/ss/g,"ß").replace(/\s+/g," ").replace(/[.!?]$/,""); }

function answer(given){
  if (sess.answered) return;
  const q = currentQ();
  if (q.type === "type" && !String(given).trim()) return;
  let ok;
  if (q.type === "type") ok = q.accept.some(a => norm(a) === norm(given)) || norm(given) === norm(q.correct);
  else ok = given === q.correct;
  sess.answered = true; sess.results.push(ok);
  S.seen[q.key] = (S.seen[q.key] || 0) + 1;
  srUpdate(q.key, ok);
  if (ok) addXP(10);
  save();
  // mark options
  if (q.type !== "type"){
    document.querySelectorAll(".opt").forEach(b => {
      const o = q.options[+b.dataset.opt]; b.disabled = true;
      if (o === q.correct) b.classList.add("ok"); else if (o === given) b.classList.add("bad");
    });
  } else {
    const f = document.getElementById("typeform"); if (f) f.querySelectorAll("input,button").forEach(x => x.disabled = true);
  }
  const qt = document.getElementById("qtext");
  if (qt && !q.whole && (q.sentence || q.arts)){
    const fillTxt = q.arts ? q.correct : q.correct;
    qt.innerHTML = q.arts ? `<span class="filled ${ok ? "" : "bad"}">${esc(fillTxt)}</span> ${esc(q.html.replace(/<span class="blank"><\/span>\s*/, "").replace(/&amp;/g,"&"))}` : renderSentence(q.sentence, q.gi, `<span class="filled ${ok ? "" : "bad"}">${esc(q.correct)}</span>`);
  }
  const last = sess.i === sess.items.length - 1;
  let fb = `<div class="fb ${ok ? "ok" : "bad"} pop"><div class="verdict">${ok ? ICON.check + " Richtig!" : ICON.x + " Leider falsch"}</div>`;
  if (!ok) fb += `<div class="ans">Richtig ist: <b>${esc(q.correct)}</b>${q.type === "type" && given ? ` <span class="muted">(du: ${esc(given)})</span>` : ""}</div>`;
  if (q.full && !q.whole) fb += `<div class="ans de">${esc(q.full)}</div>`;
  fb += `<div class="why">${q.explainDe}</div>`;
  if (q.explainEn) fb += `<button class="linkbtn" data-act="en">Auf Englisch anzeigen</button><div class="explain-en" hidden>${q.explainEn}</div>`;
  fb += `<div class="row" style="margin-top:10px">${speakBtn(q.speak)}</div></div>
    <div class="sticky-next"><button class="btn btn-primary" style="width:100%" data-act="next" id="nextbtn">${last ? "Ergebnis ansehen" : "Weiter"}</button></div>`;
  document.getElementById("fb").innerHTML = fb;
  const nb = document.getElementById("nextbtn"); if (nb) nb.focus({ preventScroll: true });
  document.getElementById("fb").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function nextQ(){
  if (sess.i < sess.items.length - 1){ sess.i++; sess.answered = false; render(); window.scrollTo(0,0); return; }
  finish();
}
function finish(){
  const n = sess.results.length, c = sess.results.filter(Boolean).length, pct = n ? c / n : 0;
  const stars = pct >= 0.999 ? 3 : pct >= 0.85 ? 2 : pct >= 0.7 ? 1 : 0;
  sess.pct = pct; sess.stars = stars;
  if (sess.kind === "level"){
    const k = lvKey(sess.t, sess.l), rec = S.lv[k] || { s: 0, b: 0 };
    sess.wasPassed = rec.s >= 1;
    rec.s = Math.max(rec.s, stars); rec.b = Math.max(rec.b, Math.round(pct * 100));
    S.lv[k] = rec;
    S.seen["L" + sess.t + "." + sess.l] = (S.seen["L" + sess.t + "." + sess.l] || 0) + 1;
    if (stars >= 1) addXP(20);
  }
  if (sess.kind === "placement" && pct >= 0.8){
    for (let l = 0; l < 40; l++){ const k = lvKey(sess.t, l); if (!S.lv[k] || S.lv[k].s < 1) S.lv[k] = { s: 1, b: 0, p: 1 }; }
  }
  save();
  go({ name: "result" });
}

function renderResult(){
  const pct = Math.round(sess.pct * 100), st = sess.stars;
  let msg, actions = "";
  if (sess.kind === "level"){
    const T = DATA[sess.t];
    if (st >= 1){
      msg = sess.l === 99 ? "Heft komplett. Glückwunsch!" : (sess.l === 84 ? "B1 in diesem Heft geschafft. B2 ist jetzt offen." : (sess.l === 39 ? "A2 geschafft. Weiter mit B1!" : "Stufe geschafft."));
    } else msg = "Noch nicht ganz. Ab 70 % geht es weiter.";
    if (sess.mode === "auto") actions += `<button class="btn btn-primary wide" data-act="auto-next">Weiter im Auto-Modus</button>`;
    else if (st >= 1 && sess.l < 99) actions += `<button class="btn btn-primary wide" data-act="open" data-t="${sess.t}" data-l="${sess.l+1}">Nächste Stufe (${sess.l+2})</button>`;
    actions += `<button class="btn btn-ghost" data-act="open" data-t="${sess.t}" data-l="${sess.l}" data-mode="${sess.mode || ""}">Nochmal</button>
      <button class="btn btn-ghost" data-act="${sess.mode === "auto" ? "home" : "track"}">${sess.mode === "auto" ? "Übersicht" : "Zum Heft"}</button>`;
    app.innerHTML = topbar(`Heft ${sess.t+1} · Stufe ${sess.l+1}`, sess.mode === "auto" ? "home" : "track") + `<div class="wrap result">
      <div class="eyebrow muted">${esc(T.name)} · ${band(sess.l)}</div>
      <div class="big tnum" style="margin-top:10px">${pct}%</div>
      <div class="stars" aria-label="${st} von 3 Sternen">${[0,1,2].map(i => `<span class="${i < st ? "" : "off"}">●</span>`).join("")}</div>
      <p class="de" style="font-size:19px">${msg}</p>
      <p class="muted tnum">${sess.results.filter(Boolean).length} von ${sess.results.length} richtig</p>
      <div class="actions">${actions}</div></div>`;
    return;
  }
  if (sess.kind === "placement"){
    msg = sess.pct >= 0.8 ? "Super! A2 ist übersprungen, du startest bei Stufe 41." : "Noch nicht ganz – starte mit den A2-Stufen. Du schaffst das!";
    actions = `<button class="btn btn-primary wide" data-act="track">Zum Heft</button>`;
  } else {
    msg = pct >= 70 ? "Gut wiederholt." : "Diese Wörter kommen bald wieder.";
    actions = `<button class="btn btn-primary wide" data-act="home">Übersicht</button>`;
  }
  app.innerHTML = topbar(sess.kind === "placement" ? "Einstufungstest" : esc(sess.title), "home") + `<div class="wrap result">
    <div class="big tnum">${pct}%</div><p class="de" style="font-size:19px">${msg}</p>
    <p class="muted tnum">${sess.results.filter(Boolean).length} von ${sess.results.length} richtig</p>
    <div class="actions">${actions}</div></div>`;
}

function renderMistakes(){
  const keys = Object.keys(S.sr).filter(k => S.sr[k][3] === 0).sort((a,b) => S.sr[b][2] - S.sr[a][2]);
  let h = topbar("Fehlerheft", "home") + `<div class="wrap"><p class="muted" style="margin:16px 0">Alles, was du zuletzt falsch hattest. Richtig beantwortet verschwindet es von hier.</p>`;
  if (!keys.length) h += `<div class="empty card"><h3>Keine offenen Fehler</h3><p>Fehler aus Stufen und Wiederholungen landen automatisch hier.</p></div>`;
  else {
    h += `<button class="btn btn-yellow" style="width:100%" data-act="practice-mistakes">${Math.min(12, keys.length)} Fehler jetzt üben</button><div class="card sec">`;
    for (const k of keys.slice(0, 80)){
      const q = makeQ(k, false);
      const prompt = q.whole ? "Satzbau" : (q.full || q.html.replace(/<[^>]+>/g, "").replace(/&amp;/g,"&"));
      h += `<div class="mistake"><div class="eyebrow muted">${esc(DATA[q.t].name)} · Stufe ${q.l+1} · ${S.sr[k][2]}× falsch</div><div class="de" style="margin-top:4px">${q.whole ? "" : esc(prompt) + " → "}<b>${esc(q.correct)}</b></div></div>`;
    }
    h += `</div>`;
  }
  app.innerHTML = h + `</div>`;
}

function openLockedSheet(t, l){

  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet stack" role="dialog" aria-label="Gesperrte Stufe">
    <h2>Stufe ${l+1} ist noch gesperrt</h2>
    <p class="muted" style="margin:0">Bist du sicher? Du kannst sie trotzdem öffnen. Wenn du sie bestehst, zählt sie wie jede andere Stufe.</p>
    <div class="row"><button class="btn btn-ghost" style="flex:1" data-act="close-sheet">Abbrechen</button><button class="btn btn-primary" style="flex:1" data-act="open" data-t="${t}" data-l="${l}">Trotzdem öffnen</button></div>
  </div>`;
  document.body.appendChild(bg);
}
function closeSheet(){ const s = document.getElementById("sheet"); if (s) s.remove(); }

/* ---------- actions ---------- */
function startLevel(t, l, mode){ sess = buildLevelSession(t, l, mode); go({ name: "lesson", t, l, mode }); }
function autoStart(advance){
  if (advance) S.auto = (S.auto + 1) % DATA.length;
  for (let i = 0; i < DATA.length; i++){
    const t = (S.auto + i) % DATA.length, l = nextLevel(t);
    if (l >= 0){ S.auto = t; save(); return startLevel(t, l, "auto"); }
  }
  go({ name: "home" });
}

document.addEventListener("click", e => {
  const sp = e.target.closest("[data-speak]"); if (sp){ speak(sp.dataset.speak); return; }
  const ins = e.target.closest("[data-ins]"); if (ins){ const i = document.getElementById("typein"); if (i){ const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0,p) + ins.dataset.ins + i.value.slice(i.selectionEnd ?? p); i.focus(); i.setSelectionRange(p+1, p+1); } return; }
  const opt = e.target.closest("[data-opt]"); if (opt && !opt.disabled){ const q = currentQ(); answer(q.options[+opt.dataset.opt]); return; }
  if (e.target.classList.contains("sheet-bg")){ closeSheet(); return; }
  const ts = e.target.closest("[data-themeset]"); if (ts){ S.settings.theme = ts.dataset.themeset; applyTheme(); save(); openSettings(); if (view.name !== "quiz") render(); return; }
  const g = e.target.closest("[data-goal]"); if (g){ S.settings.goal = +g.dataset.goal; save(); openSettings(); if (view.name === "home") render(); return; }
  const tt = e.target.closest("[data-tts]"); if (tt){ S.settings.tts = tt.dataset.tts === "1"; save(); openSettings(); if (view.name !== "quiz") render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "theme"){
    S.settings.theme = S.settings.theme === "light" ? "dark" : "light"; applyTheme(); save();
    const nb = themeBtn(b.getAttribute("style") || ""); b.outerHTML = nb; return;
  }
  if (a === "home") return go({ name: "home" });
  if (a === "track"){ const t = b.dataset.t !== undefined ? +b.dataset.t : (sess ? sess.t : view.t); return go({ name: "track", t }); }
  if (a === "open"){ closeSheet(); return startLevel(+b.dataset.t, +b.dataset.l, b.dataset.mode || ""); }
  if (a === "locked") return openLockedSheet(+b.dataset.t, +b.dataset.l);
  if (a === "start"){ go({ name: "quiz" }); return; }
  if (a === "next") return nextQ();
  if (a === "quit"){ if (sess && sess.kind === "level" && sess.mode !== "auto") return go({ name: "track", t: sess.t }); if (sess && sess.kind === "placement") return go({ name: "track", t: sess.t }); return go({ name: "home" }); }
  if (a === "auto") return autoStart(false);
  if (a === "auto-next") return autoStart(true);
  if (a === "review"){
    const d = today(); const keys = dueKeys().sort((x, y) => S.sr[x][0] - S.sr[y][0] || S.sr[x][1] - S.sr[y][1]).slice(0, 12);
    if (!keys.length) return;
    sess = buildReviewSession(shuffle(keys, rng(hash("rev" + d + keys.length))), "Wiederholung"); return go({ name: "quiz" });
  }
  if (a === "mistakes") return go({ name: "mistakes" });
  if (a === "practice-mistakes"){
    const keys = Object.keys(S.sr).filter(k => S.sr[k][3] === 0).sort((x, y) => S.sr[y][2] - S.sr[x][2]).slice(0, 12);
    sess = buildReviewSession(keys, "Fehlerheft"); return go({ name: "quiz" });
  }
  if (a === "placement"){ sess = buildPlacement(+b.dataset.t); return go({ name: "quiz" }); }
  if (a === "settings") return openSettings();
  if (a === "close-sheet") return closeSheet();
  if (a === "en"){ const box = b.nextElementSibling; if (box){ box.hidden = !box.hidden; b.textContent = box.hidden ? "Auf Englisch anzeigen" : "Englisch ausblenden"; } return; }
  if (a === "export"){
    const code = JSON.stringify(S); const msg = document.getElementById("expmsg");
    const fallback = () => { const box = document.getElementById("impbox"); box.hidden = false; const ta = document.getElementById("imptext"); ta.value = code; ta.select(); msg.textContent = "Code markiert – jetzt kopieren und sicher aufbewahren."; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "Code kopiert. Bewahre ihn gut auf."; }, fallback); } catch(err){ fallback(); }
    return;
  }
  if (a === "import-show"){ const box = document.getElementById("impbox"); box.hidden = false; document.getElementById("imptext").value = ""; document.getElementById("imptext").focus(); return; }
  if (a === "import"){
    const msg = document.getElementById("expmsg");
    try { const s = JSON.parse(document.getElementById("imptext").value); if (!s || s.v !== 1) throw 0; S = Object.assign(fresh(), s); S.settings = Object.assign(fresh().settings, S.settings); applyTheme(); save(); closeSheet(); go({ name: "home" }); }
    catch(err){ msg.textContent = "Dieser Code passt nicht. Kopiere den ganzen Text aus „Code kopieren“."; }
    return;
  }
  if (a === "reset1"){ document.getElementById("reset2").hidden = false; return; }
  if (a === "reset"){ S = fresh(); applyTheme(); save(); closeSheet(); go({ name: "home" }); return; }
});
document.addEventListener("submit", e => { if (e.target.id === "typeform"){ e.preventDefault(); answer(document.getElementById("typein").value); } });
document.addEventListener("keydown", e => {
  if (document.getElementById("sheet")){ if (e.key === "Escape") closeSheet(); return; }
  if (view.name !== "quiz" || !sess) return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (sess.answered && e.key === "Enter"){ e.preventDefault(); nextQ(); return; }
  const n = parseInt(e.key, 10);
  if (!sess.answered && n >= 1 && n <= 4){ const q = currentQ(); if (q.type !== "type" && q.options[n-1] !== undefined) answer(q.options[n-1]); }
});

render();
connectRemote();
</script>

</body></html>
