kt: Ersatzinfinitiv.","en":"lassen + infinitive; perfect: double infinitive.","sents":["Ich {lasse|lasst|lässt} mir die Haare schneiden.","Ich habe meinen Schirm im Bus {liegen lassen|liegen gelassen zu|lassen liegen}."]},{"title":"gehen / fahren / fliegen","de":"gehen = zu Fuß; fahren = mit Fahrzeug; fliegen = mit Flugzeug.","en":"gehen = walk; fahren = travel by vehicle; fliegen = fly.","sents":["Ich {fliege|fahre|gehe} nach New York.","Wir {fahren|gehen|fliegen} mit dem Auto in die Alpen."]},{"title":"sich lohnen / sich handeln","de":"sich lohnen = worth it; es handelt sich um = es geht um.","en":"to be worth it; it is a matter of.","sents":["Die Reise {lohnt sich|lohnt|lohnt es}.","Es {handelt sich|handelt|geht sich} um ein Missverständnis."]},{"title":"Nomen-Verb-Verbindungen I","de":"Feste Verbindungen: einen Gefallen tun, eine Pause machen.","en":"Fixed: do someone a favour, take a break.","sents":["Kannst du mir einen Gefallen {tun|machen|geben}?","Wir müssen eine Pause {machen|tun|nehmen zu}."]},{"title":"Nomen-Verb-Verbindungen II","de":"eine Entscheidung treffen, eine Frage stellen.","en":"make a decision, ask a question.","sents":["Ich muss eine Entscheidung {treffen|machen|tun}.","Darf ich Ihnen eine Frage {stellen|machen|fragen}?"]},{"title":"Nomen-Verb-Verbindungen III","de":"sich Mühe geben, Platz nehmen.","en":"make an effort, take a seat.","sents":["Er hat sich große Mühe {gegeben|gemacht|getan}.","Bitte {nehmen|machen|haben} Sie Platz!"]},{"title":"Partizip als Adjektiv","de":"Partizip I = aktiv, gleichzeitig; Partizip II = passiv, abgeschlossen.","en":"Present participle = active, ongoing; past participle = passive, completed.","sents":["Das ist ein {schlafendes|geschlafenes|schlafend} Kind.","Ich esse ein {gekochtes|kochendes|gekocht} Ei."]},{"title":"Passiv: Ersatzformen","de":"sich lassen + Inf. / sein + zu + Inf. = kann gemacht werden.","en":"sich lassen + inf. / sein + zu + inf. = can be done.","sents":["Das Problem {lässt sich|lässt|wird sich} lösen.","Die Aufgabe {ist|wird|hat} leicht zu machen."]},{"title":"unpersönliches Passiv","de":"Passiv ohne Subjekt: es/–, werden in 3. Person Sg.","en":"Passive without subject: werden in 3rd person singular.","sents":["Hier {wird|werden|ist} nicht geraucht.","Am Sonntag wird nicht {gearbeitet|arbeiten|gearbeitet worden}."]},{"title":"Konjunktiv II: Modalverben Vergangenheit","de":"hätte + Infinitiv + Modalverb-Infinitiv.","en":"hätte + infinitive + modal infinitive.","sents":["Du {hättest|hattest|würdest} früher kommen sollen.","Wir hätten das nicht machen {dürfen|gedurft|durften}."]},{"title":"als ob + Konjunktiv II","de":"als ob/als + Konjunktiv II = irrealer Vergleich.","en":"als ob + subjunctive II = as if.","sents":["Er tut so, als ob er krank {wäre|ist|war}.","Sie sieht aus, als {hätte|hat|habe} sie nicht geschlafen."]},{"title":"Doppelter Infinitiv im Nebensatz","de":"Im Nebensatz steht „hat“ vor den zwei Infinitiven.","en":"In a subordinate clause \"hat\" goes before the double infinitive.","sents":["Ich weiß, dass er nicht {hat kommen können|kommen können hat|kommen hat können}.","Sie sagt, dass sie {hat arbeiten müssen|arbeiten müssen hat|müssen arbeiten hat}."]},{"title":"Verb + Akkusativ + Infinitiv","de":"hören, sehen, lassen + Infinitiv ohne zu.","en":"hear, see, let + infinitive without zu.","sents":["Ich höre {ihn singen|ihn zu singen|ihm singen}.","Wir sehen die Kinder {spielen|zu spielen|gespielt}."]},{"title":"scheinen / pflegen zu","de":"scheinen + zu + Infinitiv = wirken.","en":"scheinen + zu = seem to.","sents":["Er scheint müde {zu sein|sein|ist}.","Sie {scheint|scheinen|scheint zu} das zu wissen."]},{"title":"haben / sein + zu","de":"haben + zu = müssen (aktiv); sein + zu = müssen (passiv).","en":"haben + zu = must (active); sein + zu = must be (passive).","sents":["Sie {haben|sind|werden} das Formular auszufüllen.","Die Regeln {sind|haben|werden} einzuhalten."]},{"title":"sich + Verb: unpersönlich","de":"„sich lesen/leben lassen“: unpersönliche Reflexivformen.","en":"Impersonal reflexive: reads easily, life is good here.","sents":["Das Buch {liest sich|liest|wird sich} leicht.","Hier {lebt es sich|lebt sich|lebt es} gut."]},{"title":"Verben mit Genitiv","de":"gedenken, anklagen + Genitiv (gehoben).","en":"commemorate, accuse of + genitive (formal).","sents":["Wir gedenken {der|den|die} Opfer.","Er wurde {des|dem|den} Mordes angeklagt."]},{"title":"Verben mit Präp. VI","de":"sich bedanken für (Sache) + Akk, bei (Person) + Dativ.","en":"thank for (für + acc), thank someone (bei + dative).","sents":["Ich bedanke mich {für|über|an} die Einladung.","Er hat sich {bei|an|für} mir bedankt."]},{"title":"reflexiv oder nicht?","de":"Viele Verben gibt es reflexiv und nicht reflexiv.","en":"Many verbs exist both reflexive and non-reflexive.","sents":["Ich {ärgere mich|ärgere|ärgere mir} über den Stau.","Der Lärm {ärgert mich|ärgert sich|ärgert mir}."]},{"title":"Wiederholung B1","de":"Passiv Präteritum; Konjunktiv II.","en":"Passive simple past; subjunctive II.","sents":["Der Brief {wurde|wird|würde} gestern abgeschickt.","Wenn ich reich {wäre|bin|war}, würde ich reisen."]},{"title":"Konjunktiv I: indirekte Rede","de":"B2: Konjunktiv I in der indirekten Rede (Presse).","en":"B2: subjunctive I for reported speech (news).","sents":["Er sagt, er {sei|ist|wäre} krank.","Sie sagte, sie {habe|hat|hatte} keine Zeit."]},{"title":"Konjunktiv I: Formen","de":"B2: Konjunktiv I = Stamm + e: er habe, er wisse, er sei.","en":"B2: subjunctive I = stem + e.","sents":["Der Minister erklärte, die Lage {sei|ist|seie} stabil.","Er behauptet, er {wisse|weiß|wüsste} nichts."]},{"title":"Konjunktiv I → II","de":"B2: Ist Konj. I = Indikativ, nimmt man Konj. II.","en":"B2: if subjunctive I equals indicative, use subjunctive II.","sents":["Sie sagen, sie {hätten|haben|habe} keine Zeit.","Die Kinder sagten, sie {kämen|kommen|komme} später."]},{"title":"Indirekte Rede: Vergangenheit","de":"B2: Vergangenheit: sei/habe + Partizip II.","en":"B2: past in reported speech: sei/habe + participle.","sents":["Er sagte, er {sei|habe|wäre} gestern gekommen.","Sie behauptet, sie {habe|sei|hätte gehabt} das nicht gewusst."]},{"title":"Indirekte Rede: Befehle","de":"B2: Befehl → sollen; Bitte → mögen / zu-Infinitiv.","en":"B2: commands → sollen; requests → zu-infinitive.","sents":["Er sagte, ich {solle|soll|sollte zu} pünktlich sein.","Sie bat mich, ihr {zu helfen|helfen|geholfen}."]},{"title":"Partizipialkonstruktionen","de":"B2: Partizip am Satzanfang ersetzt einen Nebensatz.","en":"B2: a participle clause at the start replaces a subordinate clause.","sents":["{In Berlin angekommen|In Berlin ankommend war|Angekommen in Berlin hat}, rief er sofort an.","{Von der Arbeit erschöpft|Von der Arbeit erschöpfen|Erschöpft von die Arbeit} schlief sie ein."]},{"title":"Futur II","de":"B2: Futur II = Vermutung über Vergangenes oder abgeschlossen in der Zukunft.","en":"B2: future perfect = assumption about the past or completed in the future.","sents":["Bis morgen {werde|würde|wurde} ich die Arbeit beendet haben.","Er wird den Zug verpasst {haben|sein|werden}."]},{"title":"Modalverben subjektiv","de":"B2: müssen = sicher (Vermutung); sollen = man sagt.","en":"B2: müssen = must be (inference); sollen = is said to be.","sents":["Er {muss|soll|darf} krank sein – er sieht schlecht aus.","Sie {soll|muss|will} sehr reich sein, sagt man."]},{"title":"wollen / sollen: Behauptung","de":"B2: wollen = er behauptet selbst; sollen = andere sagen.","en":"B2: wollen = claims himself; sollen = others say.","sents":["Er {will|soll|muss} das allein geschafft haben – glaube ich nicht!","Der Täter {soll|will|kann} geflohen sein, berichten die Medien."]},{"title":"Passiv: Vorgang vs. Zustand B2","de":"B2: seit + Zustandspassiv; gerade + Vorgangspassiv.","en":"B2: seit + stative passive; gerade + process passive.","sents":["Die Straße {ist|wird|wurde} seit Montag gesperrt.","Die Straße {wird|ist|sei} gerade gesperrt."]},{"title":"Funktionsverbgefüge","de":"B2: auf Kritik stoßen, zum Abschluss kommen.","en":"B2: meet with criticism, come to an end.","sents":["Der Vorschlag {stieß|traf|kam} auf Kritik.","Das Projekt wird bald {zum Abschluss kommen|zum Abschluss machen|zum Abschluss tun}."]},{"title":"Verben mit festen Präp. B2","de":"B2: sich halten an; sich zusammensetzen aus.","en":"B2: stick to; consist of.","sents":["Wir müssen uns {an|auf|nach} die Regeln halten.","Das Team setzt sich {aus|von|zu} fünf Personen zusammen."]},{"title":"Verben mit festen Präp. B2 II","de":"B2: verzichten auf; führen zu.","en":"B2: do without; lead to.","sents":["Er verzichtet {auf|an|von} Zucker.","Das führt {zu|an|auf} Problemen."]},{"title":"Gerundiv (zu + Partizip I)","de":"B2: zu + Partizip I = muss/kann gemacht werden.","en":"B2: zu + present participle = that must/can be done.","sents":["Die {zu erledigenden|erledigenden zu|zu erledigende} Aufgaben liegen auf dem Tisch.","Das ist ein nicht {zu unterschätzendes|unterschätzendes zu|zu unterschätzende} Risiko."]},{"title":"über- trennbar / untrennbar","de":"B2: über-, unter-, um-, durch- können trennbar (Betonung auf Präfix) oder untrennbar sein.","en":"B2: über-, unter-, um-, durch- can be separable (stressed prefix) or inseparable.","sents":["Er hat den Text ins Deutsche {übersetzt|übergesetzt|geübersetzt}.","Wir {setzen|übersetzen|setzten über} mit der Fähre über."]}]},{"id":"satzbau","name":"Satzbau","en":"Word order","kind":"gap","levels":[{"title":"Verb auf Position 2","de":"Im Aussagesatz steht das Verb immer auf Position 2.","en":"In a statement the verb is always in position 2.","sents":["{Ich wohne in Hamburg.|Ich in Hamburg wohne.|Wohne ich in Hamburg.}","{Heute gehe ich ins Kino.|Heute ich gehe ins Kino.|Heute ins Kino ich gehe.}"]},{"title":"Inversion","de":"Steht etwas anderes auf Position 1, kommt das Subjekt nach dem Verb.","en":"If something else is in position 1, the subject follows the verb.","sents":["{Morgen fahre ich nach Köln.|Morgen ich fahre nach Köln.|Ich morgen fahre nach Köln.}","{Am Wochenende spielen wir Fußball.|Am Wochenende wir spielen Fußball.|Am Wochenende Fußball wir spielen.}"]},{"title":"W-Fragen","de":"W-Frage: Fragewort – Verb – Subjekt.","en":"W-question: question word – verb – subject.","sents":["{Wo wohnst du?|Wo du wohnst?|Du wohnst wo?}","{Wann beginnt der Kurs?|Wann der Kurs beginnt?|Wann der Kurs beginnen?}"]},{"title":"Ja/Nein-Fragen","de":"Ja/Nein-Frage: Das Verb steht auf Position 1.","en":"Yes/no question: the verb is in position 1.","sents":["{Hast du Zeit?|Du hast Zeit?|Zeit du hast?}","{Kommst du morgen?|Morgen du kommst?|Du morgen kommst?}"]},{"title":"Satzklammer: Modalverb","de":"Modalverb auf Position 2, Infinitiv am Ende.","en":"Modal verb in position 2, infinitive at the end.","sents":["{Ich muss heute arbeiten.|Ich muss arbeiten heute.|Ich heute muss arbeiten.}","{Kannst du mir helfen?|Kannst du helfen mir?|Du kannst mir helfen?}"]},{"title":"Satzklammer: trennbare Verben","de":"Trennbares Präfix steht am Ende.","en":"Separable prefix goes to the end.","sents":["{Ich stehe um 7 Uhr auf.|Ich aufstehe um 7 Uhr.|Ich stehe auf um 7 Uhr.}","{Kaufst du heute ein?|Einkaufst du heute?|Kaufst ein du heute?}"]},{"title":"Satzklammer: Perfekt","de":"Hilfsverb auf Position 2, Partizip II am Ende.","en":"Auxiliary in position 2, participle at the end.","sents":["{Ich habe gestern Fußball gespielt.|Ich habe gespielt gestern Fußball.|Ich gestern habe Fußball gespielt.}","{Wir sind nach Hause gegangen.|Wir sind gegangen nach Hause.|Wir nach Hause sind gegangen.}"]},{"title":"nicht: Position","de":"„nicht“ steht meist am Ende oder vor dem verneinten Teil.","en":"\"nicht\" usually goes at the end or before the negated element.","sents":["{Ich komme heute nicht.|Ich nicht komme heute.|Ich komme nicht heute.}","{Das ist nicht mein Auto.|Das ist mein nicht Auto.|Das nicht ist mein Auto.}"]},{"title":"nicht oder kein?","de":"kein verneint Nomen (mit ein/ohne Artikel); nicht verneint Verben, Adjektive.","en":"kein negates nouns; nicht negates verbs, adjectives.","sents":["Ich habe {kein|nicht|nichts} Auto.","Ich spiele {nicht|kein|keine} gern Tennis."]},{"title":"und, aber, oder","de":"und, aber, oder, denn, sondern: Position 0 – danach normale Wortstellung.","en":"und, aber, oder, denn, sondern take position 0 – normal word order follows.","sents":["{Ich bin müde, aber ich gehe nicht schlafen.|Ich bin müde, aber ich nicht gehe schlafen.|Ich bin müde, aber gehe ich nicht schlafen.}","{Er kommt heute oder er kommt morgen.|Er kommt heute oder kommt er morgen.|Er kommt heute oder er morgen kommt.}"]},{"title":"denn","de":"denn = weil, aber mit Hauptsatz-Wortstellung.","en":"denn = because, but with main-clause word order.","sents":["{Ich bleibe zu Hause, denn ich bin krank.|Ich bleibe zu Hause, denn bin ich krank.|Ich bleibe zu Hause, denn ich krank bin.}","{Er lernt Deutsch, denn er will in Wien arbeiten.|Er lernt Deutsch, denn will er in Wien arbeiten.|Er lernt Deutsch, denn er in Wien arbeiten will.}"]},{"title":"sondern","de":"Nach Verneinung: sondern = Korrektur.","en":"After a negation: sondern = but rather.","sents":["Das ist nicht rot, {sondern|aber|oder} blau.","Ich fahre nicht mit dem Auto, {sondern|aber|denn} mit dem Rad."]},{"title":"weil","de":"Nebensatz mit weil: Verb am Ende.","en":"Clause with weil: verb at the end.","sents":["{Ich lerne, weil ich eine Prüfung habe.|Ich lerne, weil ich habe eine Prüfung.|Ich lerne, weil habe ich eine Prüfung.}","{Sie ist froh, weil sie Urlaub hat.|Sie ist froh, weil sie hat Urlaub.|Sie ist froh, weil hat sie Urlaub.}"]},{"title":"dass","de":"Nebensatz mit dass: Verb am Ende.","en":"Clause with dass: verb at the end.","sents":["{Ich glaube, dass er recht hat.|Ich glaube, dass er hat recht.|Ich glaube, dass hat er recht.}","{Ich weiß, dass du müde bist.|Ich weiß, dass du bist müde.|Ich weiß, dass bist du müde.}"]},{"title":"wenn","de":"Nebensatz zuerst → danach Verb – Subjekt.","en":"Subordinate clause first → then verb – subject.","sents":["{Wenn es regnet, bleibe ich zu Hause.|Wenn es regnet, ich bleibe zu Hause.|Wenn regnet es, bleibe ich zu Hause.}","{Ich rufe dich an, wenn ich Zeit habe.|Ich rufe dich an, wenn ich habe Zeit.|Ich rufe dich an, wenn habe ich Zeit.}"]},{"title":"Nebensatz + Modalverb","de":"Im Nebensatz steht das Modalverb ganz am Ende.","en":"In a subordinate clause the modal verb goes at the very end.","sents":["{Ich weiß, dass ich mehr lernen muss.|Ich weiß, dass ich muss mehr lernen.|Ich weiß, dass ich mehr muss lernen.}","{Er sagt, dass er nicht kommen kann.|Er sagt, dass er kann nicht kommen.|Er sagt, dass er nicht kann kommen.}"]},{"title":"Nebensatz + Perfekt","de":"Nebensatz: Partizip II, dann Hilfsverb am Ende.","en":"Subordinate clause: participle, then auxiliary at the end.","sents":["{Ich bin froh, dass du gekommen bist.|Ich bin froh, dass du bist gekommen.|Ich bin froh, dass bist du gekommen.}","{Weißt du, ob er angerufen hat?|Weißt du, ob er hat angerufen?|Weißt du, ob hat er angerufen?}"]},{"title":"Nebensatz + trennbares Verb","de":"Im Nebensatz bleibt das trennbare Verb zusammen.","en":"In a subordinate clause the separable verb stays together.","sents":["{Ich weiß nicht, wann der Film anfängt.|Ich weiß nicht, wann der Film fängt an.|Ich weiß nicht, wann fängt der Film an.}","{Ruf mich an, wenn du ankommst.|Ruf mich an, wenn du kommst an.|Ruf mich an, wenn kommst du an.}"]},{"title":"ob","de":"Indirekte Ja/Nein-Frage → ob.","en":"Indirect yes/no question → ob (whether).","sents":["Ich weiß nicht, {ob|wenn|dass} er kommt.","Kannst du mir sagen, {ob|wann ob|wenn} der Laden offen ist?"]},{"title":"Indirekte W-Frage","de":"Indirekte Frage: Fragewort + Verb am Ende.","en":"Indirect question: question word + verb at the end.","sents":["{Weißt du, wo er wohnt?|Weißt du, wo wohnt er?|Weißt du, er wohnt wo?}","{Ich frage, wie viel das kostet.|Ich frage, wie viel kostet das.|Ich frage, wie viel das kosten.}"]},{"title":"deshalb","de":"deshalb/darum/deswegen besetzen Position 1 → Verb folgt.","en":"deshalb/darum take position 1 → the verb follows.","sents":["{Ich bin krank, deshalb bleibe ich im Bett.|Ich bin krank, deshalb ich bleibe im Bett.|Ich bin krank, deshalb ich im Bett bleibe.}","{Es regnet, deshalb nehme ich den Bus.|Es regnet, deshalb ich nehme den Bus.|Es regnet, deshalb ich den Bus nehme.}"]},{"title":"trotzdem","de":"trotzdem = Position 1 → Verb – Subjekt.","en":"trotzdem takes position 1 → verb – subject.","sents":["{Es ist kalt, trotzdem gehe ich schwimmen.|Es ist kalt, trotzdem ich gehe schwimmen.|Es ist kalt, trotzdem ich schwimmen gehe.}","{Er ist müde, trotzdem arbeitet er weiter.|Er ist müde, trotzdem er arbeitet weiter.|Er ist müde, trotzdem er weiterarbeitet.}"]},{"title":"Zeit – Grund – Art – Ort","de":"Mittelfeld-Regel: Te-Ka-Mo-Lo (Zeit, Grund, Art, Ort).","en":"Middle field rule: time – cause – manner – place.","sents":["{Ich fahre morgen wegen der Arbeit mit dem Zug nach Bonn.|Ich fahre nach Bonn mit dem Zug morgen wegen der Arbeit.|Ich fahre mit dem Zug nach Bonn morgen wegen der Arbeit.}","{Wir gehen heute zusammen ins Kino.|Wir gehen ins Kino heute zusammen.|Wir gehen zusammen ins Kino heute.}"]},{"title":"Dativ vor Akkusativ","de":"Zwei Nomen: Dativ vor Akkusativ.","en":"Two nouns: dative before accusative.","sents":["{Ich gebe dem Kind einen Apfel.|Ich gebe einen Apfel dem Kind.|Ich dem Kind gebe einen Apfel.}","{Ich zeige meiner Freundin die Stadt.|Ich zeige die Stadt meiner Freundin.|Ich meiner Freundin zeige die Stadt.}"]},{"title":"Pronomen zuerst","de":"Pronomen stehen vor Nomen; Akk-Pronomen vor Dat-Pronomen.","en":"Pronouns before nouns; accusative pronoun before dative pronoun.","sents":["{Ich gebe ihn dir morgen.|Ich gebe dir ihn morgen.|Ich gebe morgen dir ihn.}","{Ich schenke es meiner Mutter.|Ich schenke meiner Mutter es.|Ich es schenke meiner Mutter.}"]},{"title":"Reflexivpronomen","de":"Reflexivpronomen steht direkt nach dem Verb (oder nach dem Subjekt-Pronomen).","en":"The reflexive pronoun comes right after the verb (or the subject pronoun).","sents":["{Ich freue mich sehr.|Ich mich freue sehr.|Ich freue sehr mich.}","{Gestern hat er sich verletzt.|Gestern hat sich er verletzt.|Gestern er hat sich verletzt.}"]},{"title":"Imperativsatz","de":"Imperativ: Verb auf Position 1, Präfix am Ende.","en":"Imperative: verb first, prefix at the end.","sents":["{Mach bitte die Tür zu!|Mach zu bitte die Tür!|Bitte zumach die Tür!}","{Ruf mich morgen an!|Anruf mich morgen!|Ruf an mich morgen!}"]},{"title":"Fragewort + Präposition","de":"Präposition steht vor dem Fragewort.","en":"Preposition comes before the question word.","sents":["{Mit wem gehst du ins Kino?|Wem mit gehst du ins Kino?|Mit wem du gehst ins Kino?}","{Woher kommst du?|Wo kommst du her aus?|Woher du kommst?}"]},{"title":"Infinitiv mit zu","de":"zu + Infinitiv steht am Ende.","en":"zu + infinitive goes at the end.","sents":["{Ich habe keine Lust, heute zu kochen.|Ich habe keine Lust, zu heute kochen.|Ich habe keine Lust, heute kochen zu.}","{Es ist schwer, Deutsch zu lernen.|Es ist schwer, zu Deutsch lernen.|Es ist schwer, Deutsch lernen zu.}"]},{"title":"um … zu","de":"um … zu = Ziel (gleiches Subjekt).","en":"um … zu = in order to (same subject).","sents":["{Ich lerne Deutsch, um in Berlin zu arbeiten.|Ich lerne Deutsch, um zu arbeiten in Berlin.|Ich lerne Deutsch, um in Berlin arbeiten.}","{Er spart, um ein Auto zu kaufen.|Er spart, um zu kaufen ein Auto.|Er spart, um ein Auto kaufen.}"]},{"title":"als (Vergangenheit)","de":"als = einmalig in der Vergangenheit; wenn = wiederholt/Gegenwart.","en":"als = once in the past; wenn = repeated or present.","sents":["{Als ich Kind war, wohnte ich in Polen.|Als ich war Kind, wohnte ich in Polen.|Als ich Kind war, ich wohnte in Polen.}","Ich war sehr glücklich, {als|wenn|wann} ich den Job bekam."]},{"title":"wann / wenn / als","de":"wann = Frage; wenn = Bedingung/wiederholt; als = einmalig Vergangenheit.","en":"wann = question; wenn = if/whenever; als = when (once, past).","sents":["{Wann|Wenn|Als} kommst du?","{Wenn|Als|Wann} ich Zeit habe, lese ich."]},{"title":"Satzanfang mit Nebensatz","de":"Nebensatz = Position 1 → Verb direkt danach.","en":"Subordinate clause = position 1 → verb right after it.","sents":["{Weil ich krank bin, kann ich nicht kommen.|Weil ich krank bin, ich kann nicht kommen.|Weil bin ich krank, kann ich nicht kommen.}","{Dass du kommst, freut mich.|Dass du kommst, mich freut.|Dass kommst du, freut mich.}"]},{"title":"Frage mit Modalverb","de":"Modalverb vorne, Infinitiv am Ende.","en":"Modal verb first, infinitive at the end.","sents":["{Darf ich hier rauchen?|Darf ich rauchen hier?|Ich darf hier rauchen?}","{Was willst du heute machen?|Was du willst heute machen?|Was willst du machen heute?}"]},{"title":"gern / lieber / am liebsten","de":"gern steht nach dem Verb; am liebsten auf Position 1 → Inversion.","en":"gern follows the verb; am liebsten in position 1 → inversion.","sents":["{Ich esse gern Pizza.|Ich gern esse Pizza.|Gern ich esse Pizza.}","{Am liebsten trinke ich Tee.|Am liebsten ich trinke Tee.|Am liebsten Tee ich trinke.}"]},{"title":"Zeitangaben am Anfang","de":"Zeitangabe auf Position 1 → Verb – Subjekt.","en":"Time expression in position 1 → verb – subject.","sents":["{Letzte Woche war ich in Rom.|Letzte Woche ich war in Rom.|Letzte Woche in Rom ich war.}","{Seit zwei Jahren lerne ich Deutsch.|Seit zwei Jahren ich lerne Deutsch.|Seit zwei Jahren Deutsch ich lerne.}"]},{"title":"Akkusativ-Pronomen Position","de":"Pronomen stehen früh im Mittelfeld.","en":"Pronouns come early in the middle field.","sents":["{Ich habe ihn gestern gesehen.|Ich habe gestern ihn gesehen.|Ich ihn habe gestern gesehen.}","{Kennst du sie schon lange?|Kennst du schon lange sie?|Sie kennst du schon lange?}"]},{"title":"nicht + Modalverb","de":"nicht steht vor dem Infinitiv am Ende.","en":"nicht goes before the final infinitive.","sents":["{Ich kann heute nicht kommen.|Ich kann nicht heute kommen.|Ich nicht kann heute kommen.}","{Du musst das nicht machen.|Du musst nicht das machen.|Du nicht musst das machen.}"]},{"title":"Wiederholung A2 I","de":"Verb Position 2; Nebensatz: Verb am Ende.","en":"Verb second; subordinate clause: verb last.","sents":["{Morgen kann ich nicht kommen, weil ich arbeiten muss.|Morgen ich kann nicht kommen, weil ich muss arbeiten.|Morgen kann ich nicht kommen, weil muss ich arbeiten.}","{Gestern bin ich früh aufgestanden.|Gestern ich bin früh aufgestanden.|Gestern bin ich aufgestanden früh.}"]},{"title":"Wiederholung A2 II","de":"ob → Verb am Ende; deshalb → Inversion.","en":"ob → verb last; deshalb → inversion.","sents":["{Ich weiß nicht, ob ich Zeit habe.|Ich weiß nicht, ob habe ich Zeit.|Ich weiß nicht, ob ich habe Zeit.}","{Deshalb fahre ich mit dem Rad.|Deshalb ich fahre mit dem Rad.|Deshalb mit dem Rad ich fahre.}"]},{"title":"obwohl","de":"obwohl = Gegengrund, Verb am Ende.","en":"obwohl = although, verb at the end.","sents":["{Obwohl es regnet, gehe ich spazieren.|Obwohl es regnet, ich gehe spazieren.|Obwohl regnet es, gehe ich spazieren.}","{Er kommt, obwohl er krank ist.|Er kommt, obwohl er ist krank.|Er kommt, obwohl ist er krank.}"]},{"title":"obwohl oder trotzdem?","de":"obwohl = Nebensatz (Verb Ende); trotzdem = Hauptsatz (Inversion).","en":"obwohl = subordinate; trotzdem = main clause with inversion.","sents":["Ich bin müde. {Trotzdem|Obwohl|Deshalb} gehe ich aus.","Ich gehe aus, {obwohl|trotzdem|deshalb} ich müde bin."]},{"title":"damit","de":"damit = Ziel bei verschiedenen Subjekten.","en":"damit = so that (different subjects).","sents":["{Ich spreche langsam, damit du mich verstehst.|Ich spreche langsam, damit du verstehst mich.|Ich spreche langsam, damit verstehst du mich.}","Sie gibt ihm Geld, {damit|um|dass um} er ein Ticket kaufen kann."]},{"title":"um … zu oder damit?","de":"Gleiches Subjekt: um … zu; verschiedenes Subjekt: damit.","en":"Same subject: um … zu; different subjects: damit.","sents":["Ich lerne viel, {um|damit|dass} die Prüfung zu bestehen.","Ich erkläre es dir, {damit|um|zu} du es verstehst."]},{"title":"während / bevor / nachdem","de":"Temporale Nebensätze: Verb am Ende.","en":"Temporal clauses: verb at the end.","sents":["{Bevor ich frühstücke, dusche ich.|Bevor frühstücke ich, dusche ich.|Bevor ich frühstücke, ich dusche.}","{Nachdem er gegessen hatte, ging er.|Nachdem er hatte gegessen, ging er.|Nachdem hatte er gegessen, ging er.}"]},{"title":"seitdem / bis","de":"seitdem/bis: Verb am Ende.","en":"seitdem/bis: verb at the end.","sents":["{Seitdem ich hier wohne, bin ich glücklich.|Seitdem ich wohne hier, bin ich glücklich.|Seitdem wohne ich hier, ich bin glücklich.}","{Warte, bis ich zurückkomme!|Warte, bis ich komme zurück!|Warte, bis komme ich zurück!}"]},{"title":"sobald / solange","de":"sobald = direkt danach; solange = während der ganzen Zeit.","en":"sobald = as soon as; solange = as long as.","sents":["{Sobald ich ankomme, rufe ich dich an.|Sobald ich ankomme, ich rufe dich an.|Sobald komme ich an, rufe ich dich an.}","{Solange du Fieber hast, bleibst du im Bett.|Solange du hast Fieber, bleibst du im Bett.|Solange hast du Fieber, du bleibst im Bett.}"]},{"title":"Relativsatz","de":"Relativsatz: Verb am Ende; er kann den Hauptsatz teilen.","en":"Relative clause: verb at the end; it can split the main clause.","sents":["{Das ist der Mann, der neben mir wohnt.|Das ist der Mann, der wohnt neben mir.|Das ist der Mann, wohnt der neben mir.}","{Die Stadt, in der ich lebe, ist schön.|Die Stadt, in der ich lebe, schön ist.|Die Stadt, in der lebe ich, ist schön.}"]},{"title":"Relativsatz: Stellung","de":"Der Relativsatz kann nach dem Partizip im Nachfeld stehen.","en":"The relative clause can go after the final participle.","sents":["{Ich habe das Buch gelesen, das du mir empfohlen hast.|Ich habe das Buch, das du mir empfohlen hast gelesen.|Ich habe das Buch gelesen, das du hast mir empfohlen.}","{Der Kollege, der krank ist, kommt morgen.|Der Kollege, krank der ist, kommt morgen.|Der Kollege, der ist krank, kommt morgen.}"]},{"title":"je … desto","de":"je + Nebensatz (Verb Ende), desto + Inversion.","en":"je + clause (verb last), desto + inversion.","sents":["{Je mehr ich übe, desto besser spreche ich.|Je mehr ich übe, desto besser ich spreche.|Je mehr übe ich, desto besser spreche ich.}","Je früher wir losfahren, {desto|als|so dass} weniger Stau gibt es."]},{"title":"sowohl … als auch","de":"sowohl … als auch = beides.","en":"both … and.","sents":["Ich spreche {sowohl|weder|entweder} Deutsch als auch Englisch.","Er ist sowohl Lehrer {als auch|noch|oder} Musiker."]},{"title":"weder … noch","de":"weder … noch = keins von beiden.","en":"neither … nor.","sents":["Ich habe {weder|sowohl|entweder} Zeit noch Geld.","Sie trinkt weder Kaffee {noch|oder|als auch} Tee."]},{"title":"entweder … oder","de":"entweder … oder = nur eins von beiden.","en":"either … or.","sents":["{Entweder|Weder|Sowohl} wir fahren mit dem Bus oder wir laufen.","Du kannst entweder Tee {oder|noch|als auch} Kaffee haben."]},{"title":"nicht nur … sondern auch","de":"nicht nur … sondern auch = zusätzlich.","en":"not only … but also.","sents":["Sie ist nicht nur klug, {sondern auch|aber auch|und auch nicht} witzig.","{Nicht nur|Nur nicht|Nicht sondern} das Essen, sondern auch der Service war gut."]},{"title":"zwar … aber","de":"zwar … aber = Einschränkung.","en":"admittedly … but.","sents":["Das Hotel war {zwar|zwischen|trotz} teuer, aber sehr schön.","Ich habe zwar wenig Zeit, {aber|sondern|denn} ich helfe dir."]},{"title":"falls","de":"falls = wenn (Möglichkeit), Verb am Ende.","en":"falls = in case, verb at the end.","sents":["{Falls es regnet, nehmen wir den Schirm mit.|Falls es regnet, wir nehmen den Schirm mit.|Falls regnet es, nehmen wir den Schirm mit.}","Ruf mich an, {falls|ob|als} du Hilfe brauchst."]},{"title":"indem","de":"indem = Art und Weise (wie?).","en":"indem = by (doing).","sents":["{Man lernt eine Sprache, indem man viel spricht.|Man lernt eine Sprache, indem man spricht viel.|Man lernt eine Sprache, indem spricht man viel.}","Er hat abgenommen, {indem|damit|um} er jeden Tag läuft."]},{"title":"sodass","de":"sodass / so … dass = Folge.","en":"so that (result).","sents":["Es regnete stark, {sodass|damit|obwohl} wir zu Hause blieben.","{Er war so müde, dass er sofort einschlief.|Er war so müde, dass er schlief sofort ein.|Er war so müde, dass schlief er sofort ein.}"]},{"title":"statt … zu / ohne … zu","de":"ohne/statt … zu + Infinitiv am Ende.","en":"without/instead of + zu-infinitive at the end.","sents":["{Er ging, ohne Tschüss zu sagen.|Er ging, ohne zu sagen Tschüss.|Er ging, ohne Tschüss sagen.}","{Statt zu lernen, sieht er fern.|Statt lernen zu, sieht er fern.|Statt zu lernen, er sieht fern.}"]},{"title":"Indirekte Fragen B1","de":"Höfliche Fragen als indirekte Frage: Verb am Ende.","en":"Polite questions as indirect questions: verb last.","sents":["{Können Sie mir sagen, wann der Zug abfährt?|Können Sie mir sagen, wann fährt der Zug ab?|Können Sie mir sagen, wann der Zug fährt ab?}","{Ich frage mich, warum er nicht angerufen hat.|Ich frage mich, warum hat er nicht angerufen.|Ich frage mich, warum er hat nicht angerufen.}"]},{"title":"Konnektor-Adverbien","de":"deswegen, trotzdem, außerdem, dann: Position 1 → Inversion.","en":"Connecting adverbs take position 1 → inversion.","sents":["Ich habe verschlafen. {Deswegen|Weil|Obwohl} bin ich zu spät.","Er hat viel gelernt. {Trotzdem|Obwohl|Weil} hat er die Prüfung nicht bestanden."]},{"title":"außerdem / dann / danach","de":"außerdem/danach auf Position 1 → Verb – Subjekt.","en":"außerdem/danach in position 1 → verb – subject.","sents":["{Außerdem habe ich keine Zeit.|Außerdem ich habe keine Zeit.|Außerdem keine Zeit ich habe.}","{Zuerst koche ich, danach esse ich.|Zuerst koche ich, danach ich esse.|Zuerst ich koche, danach esse ich.}"]},{"title":"Nebensatz im Nebensatz","de":"Jeder Nebensatz hat sein Verb am Ende.","en":"Every subordinate clause has its verb at the end.","sents":["{Ich glaube, dass er sagt, dass er kommt.|Ich glaube, dass er sagt, dass er kommt hat.|Ich glaube, dass sagt er, dass er kommt.}","{Ich weiß, dass sie ein Auto hat, das sehr alt ist.|Ich weiß, dass sie hat ein Auto, das sehr alt ist.|Ich weiß, dass sie ein Auto hat, das ist sehr alt.}"]},{"title":"Passiv im Satz","de":"Passiv: werden Position 2, Partizip am Ende; im Nebensatz werden ganz am Ende.","en":"Passive: werden 2nd, participle last; in subordinate clause werden at the very end.","sents":["{Die Briefe werden morgen verschickt.|Die Briefe morgen werden verschickt.|Die Briefe werden verschickt morgen.}","{Ich weiß, dass das Haus renoviert wird.|Ich weiß, dass das Haus wird renoviert.|Ich weiß, dass wird das Haus renoviert.}"]},{"title":"Konjunktiv II im Satz","de":"Bedingung auch ohne wenn: Verb auf Position 1.","en":"Condition without wenn: verb in position 1.","sents":["{Wenn ich Zeit hätte, würde ich kommen.|Wenn ich hätte Zeit, würde ich kommen.|Wenn ich Zeit hätte, ich würde kommen.}","{Hätte ich Geld, würde ich reisen.|Ich hätte Geld, würde ich reisen.|Hätte ich Geld, ich würde reisen.}"]},{"title":"Infinitivsatz vs. dass-Satz","de":"Gleiches Subjekt: zu-Infinitiv möglich; verschiedenes: dass.","en":"Same subject: zu-infinitive possible; different subject: dass.","sents":["{Ich hoffe, dich bald zu sehen.|Ich hoffe, dass ich dich bald zu sehen.|Ich hoffe, zu dich bald sehen.}","{Ich hoffe, dass du bald kommst.|Ich hoffe, du bald zu kommen.|Ich hoffe, dass du kommst bald.}"]},{"title":"es als Platzhalter","de":"„es“ als Platzhalter fällt weg, wenn der Nebensatz vorne steht.","en":"Placeholder \"es\" disappears when the clause comes first.","sents":["{Es ist schön, dass du da bist.|Ist schön, dass du da bist es.|Es ist schön, dass du bist da.}","{Dass du da bist, ist schön.|Dass du da bist, es ist schön.|Dass bist du da, ist schön.}"]},{"title":"wo-/da- im Satz","de":"da(r)- kündigt Nebensatz/Infinitiv an.","en":"da(r)- anticipates a clause or infinitive.","sents":["{Ich weiß nicht, worüber er spricht.|Ich weiß nicht, über was spricht er.|Ich weiß nicht, worüber spricht er.}","{Ich freue mich darauf, dich zu sehen.|Ich freue mich, darauf dich zu sehen.|Ich freue darauf mich, dich zu sehen.}"]},{"title":"Satzanfang: Objekt","de":"Auch Objekte können auf Position 1 stehen (Betonung).","en":"Objects can also go in position 1 (emphasis).","sents":["{Den Film habe ich schon gesehen.|Den Film ich habe schon gesehen.|Den Film schon ich habe gesehen.}","{Ihm gebe ich das Geld nicht.|Ihm ich gebe das Geld nicht.|Ihm das Geld gebe ich nicht.}"]},{"title":"nicht: Satznegation vs. Teilnegation","de":"Satznegation: nicht vor dem Partizip; Teilnegation: nicht vor dem Teil + sondern.","en":"Sentence negation: nicht before participle; partial: nicht before the element + sondern.","sents":["{Ich habe das Buch nicht gelesen.|Ich habe nicht das Buch gelesen.|Ich nicht habe das Buch gelesen.} (Satznegation)","Ich habe nicht das Buch, {sondern|aber|denn} die Zeitung gelesen."]},{"title":"während (Gegensatz)","de":"während = gleichzeitig oder Gegensatz.","en":"während = while (time) or whereas.","sents":["{Während er gern liest, sieht sie lieber fern.|Während er liest gern, sieht sie lieber fern.|Während er gern liest, sie sieht lieber fern.}","Ich arbeite, {während|wenn|als} du schläfst."]},{"title":"seit / seitdem","de":"seit = Präposition; seitdem = Konjunktion (Verb am Ende).","en":"seit = preposition; seitdem = conjunction.","sents":["{Seit|Seitdem|Seither} drei Jahren lebe ich hier.","{Seitdem|Seit|Seither} ich Sport mache, geht es mir besser."]},{"title":"wegen / weil","de":"wegen + Nomen; weil + Nebensatz.","en":"wegen + noun; weil + clause.","sents":["{Wegen|Weil|Deshalb} des Regens bleiben wir hier.","{Weil|Wegen|Deshalb} es regnet, bleiben wir hier."]},{"title":"trotz / obwohl","de":"trotz + Nomen; obwohl + Nebensatz.","en":"trotz + noun; obwohl + clause.","sents":["{Trotz|Obwohl|Trotzdem} der Kälte gehen wir raus.","{Obwohl|Trotz|Trotzdem} es kalt ist, gehen wir raus."]},{"title":"Wiederholung B1 I","de":"je … desto; indirekte Frage mit ob.","en":"je … desto; indirect question with ob.","sents":["{Je länger ich warte, desto nervöser werde ich.|Je länger ich warte, desto ich werde nervöser.|Je länger warte ich, desto nervöser werde ich.}","{Ich weiß nicht, ob er schon angekommen ist.|Ich weiß nicht, ob er ist schon angekommen.|Ich weiß nicht, ob ist er schon angekommen.}"]},{"title":"Wiederholung B1 II","de":"obwohl/damit: Verb am Ende; Nebensatz vorn → Inversion.","en":"obwohl/damit: verb last; clause first → inversion.","sents":["{Er hat mir geholfen, obwohl er keine Zeit hatte.|Er hat mir geholfen, obwohl er hatte keine Zeit.|Er hat geholfen mir, obwohl er keine Zeit hatte.}","{Damit wir pünktlich sind, fahren wir früh los.|Damit wir pünktlich sind, wir fahren früh los.|Damit sind wir pünktlich, fahren wir früh los.}"]},{"title":"Wiederholung B1 III","de":"Nebensatz: Verb am Ende.","en":"Subordinate clause: verb last.","sents":["{Nachdem ich die E-Mail geschrieben hatte, schickte ich sie ab.|Nachdem ich hatte die E-Mail geschrieben, schickte ich sie ab.|Nachdem ich die E-Mail geschrieben hatte, ich schickte sie ab.}","{Ich habe keine Ahnung, was er meint.|Ich habe keine Ahnung, was meint er.|Ich habe keine Ahnung, er meint was.}"]},{"title":"Wiederholung B1 IV","de":"bis: Verb am Ende; sowohl … als auch verbindet Satzteile.","en":"bis: verb last; sowohl … als auch joins parts.","sents":["{Ich bleibe hier, bis der Regen aufhört.|Ich bleibe hier, bis der Regen hört auf.|Ich bleibe hier, bis hört der Regen auf.}","{Sowohl mein Bruder als auch meine Schwester wohnen in Köln.|Sowohl mein Bruder als auch meine Schwester in Köln wohnen.|Mein Bruder sowohl als auch meine Schwester wohnen in Köln.}"]},{"title":"Wiederholung B1 V","de":"indirekte Frage; zu bei trennbaren Verben: anzurufen.","en":"Indirect question; zu with separable verbs: anzurufen.","sents":["{Kannst du mir sagen, wie spät es ist?|Kannst du mir sagen, wie spät ist es?|Kannst du sagen mir, wie spät es ist?}","{Statt mich anzurufen, hat er geschrieben.|Statt mich zu anrufen, hat er geschrieben.|Statt anzurufen mich, hat er geschrieben.}"]},{"title":"Wiederholung B1 VI","de":"falls: Verb am Ende; zu-Infinitiv am Ende.","en":"falls: verb last; zu-infinitive at the end.","sents":["{Falls du Fragen hast, melde dich.|Falls du hast Fragen, melde dich.|Falls du Fragen hast, du meldest dich.}","{Es ist wichtig, regelmäßig zu üben.|Es ist wichtig, zu regelmäßig üben.|Es ist wichtig, regelmäßig üben zu.}"]},{"title":"Wiederholung B1 VII","de":"dass/indem: Verb am Ende; trennbare Verben bleiben zusammen.","en":"dass/indem: verb last; separable verbs stay together.","sents":["{Es hat so viel geschneit, dass die Schule geschlossen wurde.|Es hat so viel geschneit, dass die Schule wurde geschlossen.|Es hat so viel geschneit, dass wurde die Schule geschlossen.}","{Er spart Geld, indem er weniger ausgeht.|Er spart Geld, indem er geht weniger aus.|Er spart Geld, indem geht er weniger aus.}"]},{"title":"Wiederholung B1 VIII","de":"weder … noch / entweder … oder.","en":"neither … nor / either … or.","sents":["{Weder er noch sie hat angerufen.|Weder er hat noch sie angerufen.|Er weder noch sie hat angerufen.}","{Entweder du kommst mit oder du bleibst hier.|Entweder kommst du mit oder du bleibst hier.|Entweder du mitkommst oder du bleibst hier.}"]},{"title":"Wiederholung B1 IX","de":"als = einmal (Vergangenheit); wenn = immer wenn / Gegenwart.","en":"als = once (past); wenn = whenever / present.","sents":["{Als ich ankam, war der Zug schon weg.|Als ich ankam, der Zug war schon weg.|Wenn ich ankam, war der Zug schon weg.}","{Wenn ich nervös bin, esse ich Schokolade.|Als ich nervös bin, esse ich Schokolade.|Wenn ich bin nervös, esse ich Schokolade.}"]},{"title":"Wiederholung B1 X","de":"Relativsatz mit Präposition; zu-Infinitiv.","en":"Relative clause with preposition; zu-infinitive.","sents":["{Das ist das Restaurant, in dem wir uns kennengelernt haben.|Das ist das Restaurant, in dem wir haben uns kennengelernt.|Das ist das Restaurant, wo haben wir uns kennengelernt.}","{Ich habe vergessen, die Tür abzuschließen.|Ich habe vergessen, die Tür zu abschließen.|Ich habe vergessen, abzuschließen die Tür.}"]},{"title":"Wiederholung B1 XI","de":"weil + Modalverb ganz am Ende; außerdem → Inversion.","en":"weil + modal at the very end; außerdem → inversion.","sents":["{Ich lerne Deutsch, weil ich in Österreich arbeiten möchte.|Ich lerne Deutsch, weil ich möchte in Österreich arbeiten.|Ich lerne Deutsch, weil möchte ich in Österreich arbeiten.}","{Außerdem macht mir die Sprache Spaß.|Außerdem die Sprache macht mir Spaß.|Außerdem mir macht die Sprache Spaß.}"]},{"title":"Nachfeld","de":"B2: Vergleiche und Präpositionalgruppen können nach dem Verb-Ende stehen (Nachfeld).","en":"B2: comparisons and prepositional phrases can follow the final verb.","sents":["{Ich habe mich gefreut über dein Geschenk.|Ich habe gefreut mich über dein Geschenk.|Ich mich habe gefreut über dein Geschenk.} (gesprochen)","{Er ist größer geworden als sein Vater.|Er ist größer als geworden sein Vater.|Er ist als sein Vater größer geworden sein.}"]},{"title":"Partizipialsatz","de":"B2: Partizipialsatz auf Position 1 → Inversion.","en":"B2: participle clause in position 1 → inversion.","sents":["{Im Urlaub angekommen, ging sie sofort an den Strand.|Im Urlaub angekommen, sie ging sofort an den Strand.|Angekommen im Urlaub, sie ging sofort an den Strand.}","{Vom Lärm geweckt, stand er auf.|Vom Lärm geweckt, er stand auf.|Geweckt vom Lärm, er stand auf.}"]},{"title":"Konditional ohne wenn","de":"B2: Konditionalsatz ohne wenn: Verb an erster Stelle.","en":"B2: conditional without wenn: verb first.","sents":["{Sollten Sie Fragen haben, rufen Sie uns an.|Sollten Sie haben Fragen, rufen Sie uns an.|Sie sollten Fragen haben, rufen Sie uns an.}","{Hätte ich das gewusst, wäre ich gekommen.|Hätte ich gewusst das, wäre ich gekommen.|Ich hätte das gewusst, wäre ich gekommen.}"]},{"title":"Konzessiv B2","de":"B2: so … auch / wie dem auch sei = egal wie.","en":"B2: however … / be that as it may.","sents":["{So schwer es auch ist, ich gebe nicht auf.|So schwer ist es auch, ich gebe nicht auf.|So schwer es auch ist, gebe ich nicht auf es.}","{Wie dem auch sei, wir müssen handeln.|Wie dem auch ist, wir müssen handeln.|Wie auch dem sei, wir müssen handeln.}"]},{"title":"Doppelkonnektoren B2","de":"B2: einerseits … andererseits; je nachdem, ob/wie.","en":"B2: on the one hand … on the other; depending on.","sents":["{Einerseits|Entweder|Sowohl} ist die Stadt teuer, andererseits bietet sie viel.","{Je nachdem, wie das Wetter wird, fahren wir los.|Je nachdem, wie wird das Wetter, fahren wir los.|Je nachdem, wie das Wetter wird, wir fahren los.}"]},{"title":"Modalverb + Passiv im Nebensatz","de":"B2: Im Nebensatz steht das Modalverb ganz am Ende.","en":"B2: in the subordinate clause the modal goes at the very end.","sents":["{Ich weiß, dass das Problem gelöst werden muss.|Ich weiß, dass das Problem muss gelöst werden.|Ich weiß, dass das Problem gelöst muss werden.}","{Er sagt, dass die Arbeit bis Freitag erledigt sein muss.|Er sagt, dass die Arbeit muss bis Freitag erledigt sein.|Er sagt, dass die Arbeit bis Freitag muss erledigt sein.}"]},{"title":"Ersatzinfinitiv im Nebensatz","de":"B2: Doppelter Infinitiv: „hat/habe“ steht davor.","en":"B2: double infinitive: the auxiliary goes before it.","sents":["{Ich glaube, dass er nicht hat kommen dürfen.|Ich glaube, dass er nicht kommen dürfen hat.|Ich glaube, dass er nicht hat dürfen kommen.}","{Es tut mir leid, dass ich dich habe warten lassen.|Es tut mir leid, dass ich dich warten lassen habe.|Es tut mir leid, dass ich habe dich warten lassen.}"]},{"title":"Nominalstil","de":"B2: Präposition + Nomen + Genitiv ersetzt einen Nebensatz.","en":"B2: preposition + noun + genitive replaces a clause.","sents":["{Nach Abschluss des Studiums fand sie eine Stelle.|Nach Abschluss das Studium fand sie eine Stelle.|Nach dem Abschluss des Studiums sie fand eine Stelle.}","{Bei Nichtbeachtung der Regeln droht eine Strafe.|Bei Nichtbeachtung die Regeln droht eine Strafe.|Bei Nichtbeachtung der Regeln eine Strafe droht.}"]},{"title":"Verbalstil ↔ Nominalstil","de":"B2: Umformung Nebensatz → Präpositionalgruppe.","en":"B2: converting a clause into a prepositional phrase.","sents":["Nachdem er angekommen war = {nach seiner Ankunft|nach seinem Ankommen war|nach er Ankunft}","Weil die Preise steigen = {wegen der steigenden Preise|wegen die Preise steigen|weil steigender Preise}"]},{"title":"Infinitiv Perfekt","de":"B2: Partizip II + zu haben/sein = Vorzeitigkeit.","en":"B2: participle + zu haben/sein = past infinitive.","sents":["{Er behauptet, das Geld nicht genommen zu haben.|Er behauptet, das Geld nicht zu genommen haben.|Er behauptet, nicht genommen haben das Geld zu.}","{Ich bin froh, die Prüfung bestanden zu haben.|Ich bin froh, die Prüfung zu bestanden haben.|Ich bin froh, bestanden die Prüfung zu haben.}"]},{"title":"Reihenfolge der Satzglieder B2","de":"B2: Pronomen vor Nomen, auch vor dem Subjekt-Nomen.","en":"B2: pronouns before nouns, even before a noun subject.","sents":["{Gestern hat mir mein Kollege das Buch zurückgegeben.|Gestern hat mein Kollege das Buch mir zurückgegeben.|Gestern mein Kollege hat mir das Buch zurückgegeben.}","{Hat dir das jemand gesagt?|Hat jemand das dir gesagt?|Dir hat jemand das gesagt?}"]},{"title":"Satzgefüge B2","de":"B2: Verschachtelte Nebensätze: jedes Verb am Ende seines Satzes.","en":"B2: nested clauses: every verb at the end of its own clause.","sents":["{Obwohl das Projekt, das sehr teuer war, scheiterte, wurde weitergeplant.|Obwohl das Projekt, das war sehr teuer, scheiterte, wurde weitergeplant.|Obwohl das Projekt scheiterte, das sehr teuer war, weitergeplant wurde.}","{Dass er gelogen hat, ist nicht zu beweisen.|Dass er hat gelogen, ist nicht zu beweisen.|Dass er gelogen hat, es ist nicht zu beweisen.}"]},{"title":"Fokuspartikeln","de":"B2: nur, sogar, auch stehen vor dem Teil, den sie betonen.","en":"B2: nur, sogar, auch stand before the element they focus.","sents":["{Nur ich habe das gewusst.|Ich nur habe das gewusst.|Ich habe nur das gewusst nur.} (niemand sonst)","{Sogar der Chef war überrascht.|Der Chef sogar war überrascht.|Der Chef war überrascht sogar.}"]},{"title":"Modalpartikeln","de":"B2: Modalpartikeln (ja, doch, mal) stehen im Mittelfeld.","en":"B2: modal particles (ja, doch, mal) sit in the middle field.","sents":["{Komm doch mal vorbei!|Komm mal doch vorbei!|Doch komm mal vorbei!}","{Das ist ja interessant!|Das ja ist interessant!|Ja das ist interessant!} (Überraschung)"]},{"title":"Hervorhebung mit was / wer","de":"B2: Ein Nebensatz mit was/wer als Subjekt hebt etwas hervor.","en":"B2: a was/wer clause as subject puts something in focus.","sents":["{Was mich ärgert, ist der Lärm.|Was mich ärgert, der Lärm ist.|Was ärgert mich, ist der Lärm.}","{Wer viel liest, schreibt besser.|Wer viel liest, er schreibt besser.|Wer liest viel, schreibt besser.}"]}]},{"id":"synonyme","name":"Synonyme & Gegenteile","en":"Synonyms & opposites","kind":"syn","levels":[{"title":"beginnen = anfangen · billig ↔ teuer","items":[{"a":"beginnen","b":"anfangen","k":"syn","en":"to begin"},{"a":"billig","b":"teuer","k":"ant","en":"cheap / expensive"}]},{"title":"schnell = rasch · alt ↔ jung","items":[{"a":"schnell","b":"rasch","k":"syn","en":"fast"},{"a":"alt","b":"jung","k":"ant","en":"old / young"}]},{"title":"sprechen = reden · laut ↔ leise","items":[{"a":"sprechen","b":"reden","k":"syn","en":"to talk"},{"a":"laut","b":"leise","k":"ant","en":"loud / quiet"}]},{"title":"schauen = gucken · hell ↔ dunkel","items":[{"a":"schauen","b":"gucken","k":"syn","en":"to look"},{"a":"hell","b":"dunkel","k":"ant","en":"light / dark"}]},{"title":"schön = hübsch · groß ↔ klein","items":[{"a":"schön","b":"hübsch","k":"syn
