<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>El Game</title>
<style>
:root{--bg:#0f1418;--fg:#e6edf3;--card:#1a2129;--mute:#8b98a5;--sel:#ffd84d}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
 padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));background:rgba(15,20,24,.85)}
#bar a,#bar button{font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;border:0;background:var(--card);color:var(--fg);text-decoration:none}
#bar button.on{background:var(--fg);color:var(--bg)}
#hint{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));color:var(--mute);text-align:center;pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar">
 <a href="./">← Sensors</a>
 <button data-m="make" class="on">Make shape</button>
 <button data-m="cord">Cords</button>
 <button data-m="move">Move</button>
 <button id="clear">Clear</button>
</div>
<div id="hint"></div>
<script>
// ---------- live sensor data ----------
const L={acc:[0,0,0],lin:[0,0,0],gyro:[0,0,0],ori:[0,0,0],head:[0],mag:[0,0,0],grav:[0,0,0]};
let started=false;
async function startSensors(){
  if(started)return;started=true;
  try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();}catch(e){}
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();}catch(e){}
  addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity,l=e.acceleration,r=e.rotationRate;
    if(a)L.acc=[a.x||0,a.y||0,a.z||0];if(l)L.lin=[l.x||0,l.y||0,l.z||0];if(r)L.gyro=[r.alpha||0,r.beta||0,r.gamma||0];});
  addEventListener('deviceorientation',e=>{L.ori=[e.alpha||0,e.beta||0,e.gamma||0];if(e.webkitCompassHeading!=null)L.head=[e.webkitCompassHeading];});
  addEventListener('deviceorientationabsolute',e=>{if(e.alpha!=null)L.head=[e.alpha];});
  for(const[k,c]of[['mag','Magnetometer'],['grav','GravitySensor']]){
    if(!window[c])continue;
    try{const s=new window[c]({frequency:30});s.onreading=()=>{L[k]=[s.x||0,s.y||0,s.z||0]};s.start();}catch(e){}
  }
}
const sensorVec=()=>[].concat(L.acc,L.lin,L.gyro,L.ori,L.head,L.mag,L.grav);

// ---------- deterministic mixing (no RNG: output depends only on inputs) ----------
// p(F,k) in [0,1): every feature contributes with a fixed, made-up weight
function p(F,k){let s=0;for(let j=0;j<F.length;j++){const w=Math.sin((k+1)*12.9898+(j+1)*78.233)*43.7;s+=F[j]*w;}
  const v=Math.sin(s)*43758.5453;return v-Math.floor(v);}

// ---------- shapes ----------
const R=45; // max radius -> fits in ~100x100 px
function shapeFeatures(x,y,t){return sensorVec().concat([x,y,t,Math.sin(t*3.1)])}
function buildShape(s){
  const F=s.F,n=2+Math.floor(p(F,0)*8),H=[];
  for(let k=0;k<4;k++)H.push({f:n*(k+1)+Math.floor(p(F,10+k)*3),a:p(F,20+k)*(0.6/(k+1)),ph:p(F,30+k)*6.283});
  const pts=[];let mx=0;
  for(let i=0;i<=180;i++){const th=i/180*6.283;let r=1;for(const h of H)r+=h.a*Math.sin(h.f*th+h.ph);
    r=Math.abs(r)+0.15;mx=Math.max(mx,r);pts.push([th,r]);}
  s.pts=pts.map(([th,r])=>[Math.cos(th+p(F,3)*6.283)*r/mx*R,Math.sin(th+p(F,3)*6.283)*r/mx*R]);
  s.hue=Math.floor(p(F,4)*360);s.hue2=(s.hue+60+Math.floor(p(F,5)*180))%360;
  s.inner=Math.floor(p(F,6)*4); // 0..3 extra decorations
  s.spokes=3+Math.floor(p(F,7)*9);s.ir=0.2+p(F,8)*0.5;s.lw=1+p(F,9)*3;
}
function drawShape(s,sel){
  ctx.save();ctx.translate(s.x,s.y);
  ctx.beginPath();s.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
  ctx.fillStyle=`hsla(${s.hue},80%,55%,.55)`;ctx.fill();
  ctx.lineWidth=s.lw;ctx.strokeStyle=`hsl(${s.hue2},90%,70%)`;ctx.stroke();
  if(s.inner&1){ctx.beginPath();for(let i=0;i<s.spokes;i++){const a=i/s.spokes*6.283;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*R*s.ir*1.6,Math.sin(a)*R*s.ir*1.6);}ctx.stroke();}
  if(s.inner&2){ctx.beginPath();ctx.arc(0,0,R*s.ir,0,6.283);ctx.stroke();}
  if(sel){ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeStyle='#ffd84d';ctx.beginPath();ctx.arc(0,0,R+6,0,6.283);ctx.stroke();ctx.setLineDash([]);}
  ctx.restore();
}

// ---------- cords ----------
// Quadratic curve A -> B that passes through C at t=0.5, plus a wiggle that is
// zero at A, C and B and grows with the distance of C from the A-B midpoint.
function buildCord(c){
  const A=shapes.find(s=>s.id===c.a),B=shapes.find(s=>s.id===c.b);if(!A||!B)return false;
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,ab=Math.hypot(B.x-A.x,B.y-A.y)||1;
  const chaos=Math.min(2.5,Math.hypot(c.cx-mx,c.cy-my)/ab*2);
  const qx=2*c.cx-mx,qy=2*c.cy-my,F=c.F,W=[];
  for(let k=0;k<5;k++)W.push({f:2+k*2+Math.floor(p(F,k)*5),a:(0.3+p(F,10+k))/(k+1),ph:p(F,20+k)*6.283});
  const amp=chaos*(14+p(F,30)*26),pts=[];
  for(let i=0;i<=200;i++){const t=i/200,u=1-t;
    const x=u*u*A.x+2*u*t*qx+t*t*B.x,y=u*u*A.y+2*u*t*qy+t*t*B.y;
    const dx=2*u*(qx-A.x)+2*t*(B.x-qx),dy=2*u*(qy-A.y)+2*t*(B.y-qy),dl=Math.hypot(dx,dy)||1;
    let w=0;for(const h of W)w+=h.a*Math.sin(h.f*t*6.283+h.ph);
    const env=Math.sin(2*Math.PI*t)**2*amp;pts.push([x-dy/dl*w*env,y+dx/dl*w*env]);}
  c.pts=pts;c.hue=Math.floor(p(F,40)*360);c.lw=1.5+p(F,41)*2.5+chaos;c.chaos=chaos;return true;
}
function drawCord(c){
  ctx.beginPath();c.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.lineWidth=c.lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=`hsl(${c.hue},85%,65%)`;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(c.cx,c.cy,3,0,6.283);ctx.fill();
}

// ---------- state ----------
let shapes=[],cords=[],nextId=1,mode='make',selA=null,selB=null,active=null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('hint');
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
function setHint(){hint.textContent=mode==='make'?'Press and hold anywhere. The shape changes while you hold.':
  mode==='cord'?(selA==null?'Tap shape A':selB==null?'Tap shape B':'Tap point C – the cord goes through it'):'Drag a shape or a cord';}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;selA=selB=null;
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));setHint();});
document.getElementById('clear').onclick=()=>{shapes=[];cords=[];selA=selB=null;setHint();};
const hitShape=(x,y)=>[...shapes].reverse().find(s=>Math.hypot(s.x-x,s.y-y)<R);
const hitCord=(x,y)=>[...cords].reverse().find(c=>c.pts.some(([px,py])=>Math.hypot(px-x,py-y)<18));
const refreshCords=id=>cords=cords.filter(c=>{if(id!=null&&c.a!==id&&c.b!==id)return true;c.F=sensorVec();return buildCord(c);});

cv.addEventListener('pointerdown',e=>{
  startSensors();cv.setPointerCapture(e.pointerId);const x=e.clientX,y=e.clientY;
  if(mode==='make'){const s={id:nextId++,x,y,t0:performance.now(),t:0};s.F=shapeFeatures(x,y,0);buildShape(s);shapes.push(s);active={kind:'grow',s};}
  else if(mode==='cord'){const s=hitShape(x,y);
    if(selA==null){if(s)selA=s.id;}
    else if(selB==null){if(s&&s.id!==selA)selB=s.id;}
    else{const c={a:selA,b:selB,cx:x,cy:y,F:sensorVec()};if(buildCord(c))cords.push(c);selA=selB=null;}
    setHint();}
  else{const s=hitShape(x,y);if(s)active={kind:'shape',s,ox:x-s.x,oy:y-s.y};
    else{const c=hitCord(x,y);if(c)active={kind:'cord',c,lx:x,ly:y};}}
});
cv.addEventListener('pointermove',e=>{if(!active)return;const x=e.clientX,y=e.clientY;
  if(active.kind==='grow'){active.s.x=x;active.s.y=y;}
  else if(active.kind==='shape'){const s=active.s;s.x=x-active.ox;s.y=y-active.oy;s.F=shapeFeatures(s.x,s.y,s.t);buildShape(s);refreshCords(s.id);}
  else{const c=active.c;c.cx+=x-active.lx;c.cy+=y-active.ly;active.lx=x;active.ly=y;c.F=sensorVec();buildCord(c);}
});
const end=()=>{active=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

function frame(){
  if(active&&active.kind==='grow'){const s=active.s;s.t=(performance.now()-s.t0)/1000;s.F=shapeFeatures(s.x,s.y,s.t);buildShape(s);refreshCords(s.id);}
  ctx.clearRect(0,0,innerWidth,innerHeight);
  cords.forEach(drawCord);shapes.forEach(s=>drawShape(s,s.id===selA||s.id===selB));
  requestAnimationFrame(frame);
}
setHint();frame();
</script></body></html>
